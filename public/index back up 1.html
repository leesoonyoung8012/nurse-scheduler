    const maxN=getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6);
    const cur=Number(stats[n.id]?.nights||0);
    const room=mode.overrideMaxNight ? (range.max||3) : Math.max(0,maxN-cur);
    const maxLen=Math.max(1,Math.min(range.max||3,3,room));
    const lens=[];
    // 순번제 기본 원칙: 2~3개 블록 우선, 마지막 보정에서만 1개 허용
    for(let len=maxLen; len>=2; len--) lens.push(len);
    if((range.max||0)===1 || mode.allowSingle) lens.push(1);
    const starts=[];
    if(opts.includeCoveringStarts){
      for(let s=d-2; s<=d; s++) if(s>=1 && s<=last) starts.push(s);
    }else{
      starts.push(d);
    }
    let attempted=false;
    for(const len of lens){
      for(const start of starts){
        if(!(start<=d && d<start+len)) continue;
        if(start+len-1>last) continue;
        attempted=true;
        if(stepPlaceNightBlock(n,start,mode.reason,{forceLen:len,remainingTarget:len,replaceRest:mode.replaceRest,overrideLock:mode.overrideLock,overrideWanted:mode.overrideWanted,overrideNightGap:mode.overrideNightGap,overrideMaxNight:mode.overrideMaxNight,overrideNextWanted:mode.overrideNextWanted,preferLong:true,lockNight:true})){
          stepNightQueueMarkPlaced(n);
          stepLog(`${mode.reason} 순번제 ${n.name} ${makeDateKey(st.y,st.m,start)}부터 N ${len}개 배치`);
          return true;
        }
      }
    }
    if(attempted || lens.length){
      stepNightQueueMarkSkipped(n,d,mode.reason);
    }
  }
  return false;
}


function stepForceSingleNightForDate(d, reason, opts={}){
  const ward=getCurrentWard(), st=stepEnsureState(); if(!ward||!st) return false;
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const y=st.y,m=st.m,key=makeDateKey(y,m,d), dtype=getDateType(y,m,d);
  const max=getStaffingMaxForDate(ward,y,m,d,'N');
  if(max!==Infinity && stepCount(st.schedule,y,m,d,'N',nurses)>=max) return false;
  function fixed(code){ return ['AL','SL','HA','HP'].includes(String(code||'').toUpperCase()); }
  function candidateScore(n){
    const cur=String(st.schedule[key]?.[n.id]||'').toUpperCase();
    const stats=summarizeSchedule(st.schedule,nurses,y,m)[n.id]||{};
    let s=0;
    // 순번제 복구 대상이 있으면 먼저 고려하고, 그래도 안 되면 후보를 넓힙니다.
    const q=stepNightQueueState(nurses);
    const qIndex=(q.ids||[]).indexOf(n.id);
    if((q.skipped||[]).includes(n.id)) s-=5000;
    if(qIndex>=0) s+=qIndex*10;
    if(cur==='') s-=300;
    if(cur==='OF'||cur==='O') s-=200;
    if(stepLocked(y,m,d,n.id)) s+=180;
    if(cur==='WO') s+=900;
    if(stepIsNightKeep(n)) s+=2000; // 나이트킵은 2단계에서 이미 처리되므로 일반 N 부족 보정은 일반 가능자 우선
    const maxN=stepIsNightKeep(n) ? nightKeepMonthlyTargetByDays(daysInMonth(y,m)) : getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6);
    if(Number(stats.nights||0)>=maxN) s+=1200;
    s+=Number(stats.nights||0)*80;
    s+=String(n.name||'').localeCompare('', 'ko')/100000;
    return s;
  }
  const cands=nurses
    .filter(n=>stepIsCountedStaff(n))
    .filter(n=>!stepIsNightKeep(n))
    .filter(n=>stepAllowed(n,'N'))
    .filter(n=>!stepIsRestricted(n,dtype))
    .filter(n=>isPersonalShiftAllowedForDateType(n,'N',dtype))
    .filter(n=>{
      const maxN=stepIsNightKeep(n) ? nightKeepMonthlyTargetByDays(daysInMonth(y,m)) : getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6);
      const stats=summarizeSchedule(st.schedule,nurses,y,m)[n.id]||{};
      return maxN>0 && (opts.overrideMaxNight || Number(stats.nights||0)<maxN);
    })
    .filter(n=>{
      const cur=String(st.schedule[key]?.[n.id]||'').toUpperCase();
      if(fixed(cur)) return false;
      if(['D','E','MD','SD6'].includes(cur)) return false;
      // N→D / N→E 법적 전환 금지: 다음날이 D 또는 E면 오늘 N 배치 불가
      if(d<daysInMonth(y,m)){const nc=String(st.schedule[makeDateKey(y,m,d+1)]?.[n.id]||'').toUpperCase(); if(nc==='D'||nc==='E') return false;}
      return true;
    })
    .sort((a,b)=>candidateScore(a)-candidateScore(b));
  for(const n of cands){
    const cur=String(st.schedule[key]?.[n.id]||'').toUpperCase();
    // 최후 보정은 최소 N 인원을 맞추기 위해 N 텀은 완화할 수 있지만, 월간 N 상한은 유지합니다.
    if(stepViolatesPreviousMonthNightReentryGap(n,d)) continue;
    if(stepViolatesNightRecoveryOffGap(n,d)) continue;
    if(cur==='WO') continue;
    if(!stepNightCombinationSafeIfAssign(n,d,{replace:true,overrideLock:true,overrideNightGap:true,overrideNextWanted:true})) continue;
    st.schedule[key][n.id]='N';
    stepUnlock(y,m,d,n.id);
    stepLock(y,m,d,n.id,reason||'3단계 N 최종 단일보정');
    // 단일 N 뒤에도 가능한 경우에만 회복 OFF를 표시합니다. 이미 휴가/WO/N이면 건드리지 않습니다.
    for(let r=1; r<=stepNightOffCount(n); r++){
      const od=d+r; if(od>daysInMonth(y,m)) break;
      const ok=makeDateKey(y,m,od);
      const oc=String(st.schedule[ok]?.[n.id]||'').toUpperCase();
      if(!['AL','SL','WO','HA','HP','N','D','E','MD','SD6'].includes(oc)){
        st.schedule[ok][n.id]='OF';
        stepLock(y,m,od,n.id,'N후 2OFF');
      }
    }
    stepNightQueueMarkPlaced(n);
    stepLog(`${reason||'3단계 N 최종 단일보정'} ${n.name} ${makeDateKey(y,m,d)} N 1개 배치`);
    return true;
  }
  // 원티드 OFF까지 풀어야 하는 극단 상황: 고정휴가/근무유형/제한일만 유지합니다.
  const woCands=cands.filter(n=>String(st.schedule[key]?.[n.id]||'').toUpperCase()==='WO');
  for(const n of woCands){
    if(stepViolatesPreviousMonthNightReentryGap(n,d)) continue;
    if(stepViolatesNightRecoveryOffGap(n,d)) continue;
    if(!stepNightCombinationSafeIfAssign(n,d,{replace:true,overrideWanted:true,overrideLock:true,overrideNightGap:true,overrideNextWanted:true})) continue;
    st.schedule[key][n.id]='N';
    stepUnlock(y,m,d,n.id);
    stepLock(y,m,d,n.id,reason||'3단계 N 최종 단일보정-WO완화');
    stepNightQueueMarkPlaced(n);
    stepLog(`${reason||'3단계 N 최종 단일보정'} ${n.name} ${makeDateKey(y,m,d)} WO 완화 후 N 1개 배치`);
    return true;
  }
  return false;
}
function stepFillRemainingNightShortagesMinimumFirst(reason='3단계 N 최소인원 우선 최종보정'){
  const ward=getCurrentWard(), st=stepEnsureState(); if(!ward||!st) return {fixed:0, unresolved:[]};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const startedAt=Date.now();
  const expired=()=>Date.now()-startedAt>700;
  let fixed=0;
  for(let pass=0; pass<3 && !expired(); pass++){
    const misses=stepNightShortages();
    if(!misses.length) break;
    let changed=false;
    for(const miss of misses){
      let guard=0;
      while(!expired() && stepCount(st.schedule,st.y,st.m,miss.d,'N',nurses)<getStaffingMinForDate(ward,st.y,st.m,miss.d,'N') && guard++<nurses.length+2){
        if(!stepForceSingleNightForDate(miss.d, reason, {overrideMaxNight:false})) break;
        fixed++; changed=true;
      }
    }
    if(!changed) break;
  }
  return {fixed, unresolved:[...new Set(stepNightShortages().map(x=>`${makeDateKey(st.y,st.m,x.d)} N ${x.got}/${x.need}`))]};
}

function stepCanProceedAfterNight(){
  const st=stepEnsureState();
  if(!st) return false;
  if(st.done && st.done[3]) return true;
  const misses=stepNightShortages();
  if(!misses.length){
    st.done[3]=true;
    return true;
  }
  stepLog(`3단계 N 미해결로 다음 단계 진행 차단: ${misses.slice(0,5).map(x=>makeDateKey(st.y,st.m,x.d)+' N '+x.got+'/'+x.need).join(' / ')}`);
  stepPushDraft();
  renderWardSchedule();
  return false;
}

function stepCorrectNightBeforeNext(){
  const ward=getCurrentWard(), st=stepEnsureState(); if(!ward||!st) return {fixed:0,unresolved:[]};
  let fixed=0;
  const modes=[
    {reason:'3단계 N 순번 일반교정', replaceRest:false, overrideLock:false, overrideWanted:false, overrideNightGap:false, overrideMaxNight:false, overrideNextWanted:false, allowSingle:false},
    {reason:'3단계 N 순번 OFF전환교정', replaceRest:true, overrideLock:false, overrideWanted:false, overrideNightGap:false, overrideMaxNight:false, overrideNextWanted:false, allowSingle:false},
    {reason:'3단계 N 순번 텀완화교정', replaceRest:true, overrideLock:false, overrideWanted:false, overrideNightGap:true, overrideMaxNight:false, overrideNextWanted:false, allowSingle:false},
    {reason:'3단계 N 순번 보호OFF완화교정', replaceRest:true, overrideLock:true, overrideWanted:false, overrideNightGap:true, overrideMaxNight:false, overrideNextWanted:true, allowSingle:true},
    {reason:'3단계 N 순번 최대개수엄수교정', replaceRest:true, overrideLock:true, overrideWanted:false, overrideNightGap:true, overrideMaxNight:false, overrideNextWanted:true, allowSingle:true},
    {reason:'3단계 N 순번 최종교정-최대N엄수', replaceRest:true, overrideLock:true, overrideWanted:true, overrideNightGap:true, overrideMaxNight:false, overrideNextWanted:true, allowSingle:true}
  ];
  for(let pass=0; pass<12; pass++){
    let changed=false;
    const misses=stepNightShortages();
    if(!misses.length) break;
    for(const miss of misses){
      while(stepCount(st.schedule,st.y,st.m,miss.d,'N',(ward.nurses||[]))<getStaffingMinForDate(ward,st.y,st.m,miss.d,'N')){
        let ok=false;
        for(const mode of modes){
          if(stepTryQueueNightBlockForDate(miss.d,mode,{includeCoveringStarts:true})){ ok=true; changed=true; fixed++; break; }
        }
        if(!ok){
          if(stepForceSingleNightForDate(miss.d,'3단계 N 부족 최종보정')){ ok=true; changed=true; fixed++; }
        }
        if(!ok) break;
      }
    }
    if(!changed) break;
  }
  // 전체 월을 다시 훑어 2~3N 블록 생성 실패로 남은 후반부 부족일은 1N 완화로 끝까지 보정합니다.
  for(let pass=0; pass<4; pass++){
    let any=false;
    const misses=stepNightShortages();
    if(!misses.length) break;
    for(const miss of misses){
      while(stepCount(st.schedule,st.y,st.m,miss.d,'N',(ward.nurses||[]))<getStaffingMinForDate(ward,st.y,st.m,miss.d,'N')){
        if(stepForceSingleNightForDate(miss.d,'3단계 N 후반부 부족 단일보정')){ any=true; fixed++; }
        else break;
      }
    }
    if(!any) break;
  }
  return {fixed, unresolved:Array.from(new Set(stepNightShortages().map(x=>`${makeDateKey(st.y,st.m,x.d)} N ${x.got}/${x.need}`)))};
}


function stepBalanceGeneralNightPersonalCounts(){
  // v14.1.28: 3단계 N 생성 후 개인별 N 개수 차이를 가능한 한 1개 이내로 미세교정합니다.
  // 날짜별 N 인원은 그대로 유지하고, N 최대 개수/고정휴가/WO/근무유형은 깨지 않습니다.
  // 예: 6개 직원의 N 1개를 4개 직원에게 이동하여 5:5로 맞추는 2차 패스를 포함합니다.
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return {moves:0, summary:''};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const last=daysInMonth(st.y,st.m);
  const eligible=nurses
    .filter(n=>stepIsCountedStaff(n))
    .filter(n=>!stepIsNightKeep(n))
    .filter(n=>stepAllowed(n,'N'))
    .filter(n=>getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6)>0);
  if(eligible.length<2) return {moves:0, summary:''};

  function stats(){ return summarizeSchedule(st.schedule,nurses,st.y,st.m); }
  function nightCount(n){ return Number(stats()[n.id]?.nights||0); }
  function maxNight(n){ return getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6); }
  function isFixedRest(code){ return ['AL','SL','WO','HA','HP'].includes(String(code||'').toUpperCase()); }
  function isNightAt(n,day){ return String(st.schedule[makeDateKey(st.y,st.m,day)]?.[n.id]||'').toUpperCase()==='N'; }
  function hasNightNeighbor(n,day){
    const prev=day>1 && isNightAt(n,day-1);
    const next=day<last && isNightAt(n,day+1);
    return {prev,next};
  }
  function donorDayScore(donor, receiver, day){
    // donor의 N 블록 가장자리부터 넘깁니다. 중간 N을 빼서 블록을 크게 깨는 것은 마지막 후보입니다.
    const nb=hasNightNeighbor(donor,day);
    let s=0;
    if(nb.prev && nb.next) s+=500;
    if(nb.prev || nb.next) s-=80;
    // receiver가 이미 근처에 N이 있으면 연속 블록으로 자연스럽게 붙는 날짜를 우선합니다.
    const rb=hasNightNeighbor(receiver,day);
    if(rb.prev || rb.next) s-=120;
    // 월 전체에 너무 앞/뒤로 몰리지 않게 중후반 후보를 약간 우선합니다.
    s += Math.abs(day-(last*0.62))/100;
    return s;
  }
  function canReceiveNight(receiver, day, donor){
    const key=makeDateKey(st.y,st.m,day);
    const cur=String(st.schedule[key]?.[receiver.id]||'').toUpperCase();
    if(!stepIsRest(cur)) return false;
    if(isFixedRest(cur)) return false;
    if(nightCount(receiver)>=maxNight(receiver)) return false;
    const oldDonor=st.schedule[key]?.[donor.id]||'';
    const oldReceiver=st.schedule[key]?.[receiver.id]||'';
    const oldDonorLock=stepLockReason(st.y,st.m,day,donor.id);
    const oldReceiverLock=stepLockReason(st.y,st.m,day,receiver.id);
    st.schedule[key][donor.id]='OF';
    stepUnlock(st.y,st.m,day,donor.id);
    // 개인별 균형 교환은 날짜별 N 인원과 최대 N, N 재진입 텀을 함께 유지합니다.
    const ok=stepCanPlace(receiver,'N',day,{replace:true,overrideLock:true,overrideNightGap:false,overrideNextWanted:true});
    st.schedule[key][donor.id]=oldDonor;
    st.schedule[key][receiver.id]=oldReceiver;
    if(oldDonorLock) stepLock(st.y,st.m,day,donor.id,oldDonorLock); else stepUnlock(st.y,st.m,day,donor.id);
    if(oldReceiverLock) stepLock(st.y,st.m,day,receiver.id,oldReceiverLock); else stepUnlock(st.y,st.m,day,receiver.id);
    return ok;
  }
  function transferNight(donor, receiver, day){
    const key=makeDateKey(st.y,st.m,day);
    if(String(st.schedule[key]?.[donor.id]||'').toUpperCase()!=='N') return false;
    if(!canReceiveNight(receiver,day,donor)) return false;
    st.schedule[key][donor.id]='OF';
    stepUnlock(st.y,st.m,day,donor.id);
    st.schedule[key][receiver.id]='N';
    stepLock(st.y,st.m,day,receiver.id,'3단계 개인별 N 미세균형교환');
    for(let r=1; r<=stepNightOffCount(receiver); r++){
      const od=day+r;
      if(od>last) break;
      const ok=makeDateKey(st.y,st.m,od);
      const oc=String(st.schedule[ok]?.[receiver.id]||'').toUpperCase();
      if(!['AL','SL','WO','HA','HP','N','D','E','MD','SD6'].includes(oc)){
        st.schedule[ok][receiver.id]='OF';
        stepLock(st.y,st.m,od,receiver.id,'N후 2OFF');
      }
    }
    return true;
  }

  let moves=0;
  for(let pass=0; pass<120; pass++){
    const rows=eligible.map(n=>({n, cnt:nightCount(n), max:maxNight(n)}));
    const lows=rows.filter(x=>x.cnt<x.max).sort((a,b)=>a.cnt-b.cnt || String(a.n.name||'').localeCompare(String(b.n.name||''),'ko'));
    const highs=[...rows].sort((a,b)=>b.cnt-a.cnt || String(a.n.name||'').localeCompare(String(b.n.name||''),'ko'));
    if(!lows.length || !highs.length) break;
    const minCnt=lows[0].cnt;
    const maxCnt=highs[0].cnt;
    // 차이 1개까지는 허용합니다. 차이 2개 이상이면 6->4 같은 미세교정을 시도합니다.
    if(maxCnt-minCnt<=1) break;

    let changed=false;
    for(const low of lows){
      for(const high of highs){
        if(high.n.id===low.n.id) continue;
        if(high.cnt-low.cnt<=1) continue;
        const donorDays=[];
        for(let d=1; d<=last; d++){
          if(isNightAt(high.n,d)) donorDays.push(d);
        }
        donorDays.sort((a,b)=>{
          const ca=canReceiveNight(low.n,a,high.n)?0:1;
          const cb=canReceiveNight(low.n,b,high.n)?0:1;
          if(ca!==cb) return ca-cb;
          return donorDayScore(high.n,low.n,a)-donorDayScore(high.n,low.n,b);
        });
        for(const d of donorDays){
          if(transferNight(high.n,low.n,d)){
            moves++;
            changed=true;
            stepLog(`3단계 개인별 N 미세균형교환 ${high.n.name} ${makeDateKey(st.y,st.m,d)} N → ${low.n.name}`);
            break;
          }
        }
        if(changed) break;
      }
      if(changed) break;
    }
    if(!changed) break;
  }
  const finalRows=eligible.map(n=>`${n.name} ${nightCount(n)}`).join(', ');
  return {moves, summary:finalRows};
}




function stepRemoveUnsafeNightJuniorPairs(){
  // v14.1.37: 시니어지원자 없는 N 조합은 경고만 남기지 않고 실제 배정에서 제거합니다.
  // 원칙: N 2명 이상 날짜에 LV4+/차지/프리셉터/교육담당이 없으면,
  //       나이트킵은 최대한 보존하고 LV3/LV1/LV2 순으로 N을 OFF로 되돌려 주니어끼리 N이 남지 않게 합니다.
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return {removed:0, days:[]};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const y=st.y, m=st.m, last=daysInMonth(y,m);
  function key(d){ return makeDateKey(y,m,d); }
  function codeAt(n,d){ return String(st.schedule[key(d)]?.[n.id]||'').toUpperCase(); }
  function nightCount(n){ return Number((summarizeSchedule(st.schedule,nurses,y,m)[n.id]||{}).nights||0); }
  function donorScore(n,d){
    let s=0;
    if(stepIsNightKeep(n)) s+=5000; // 나이트킵은 일반 교정에서 가급적 빼지 않습니다.
    const rank=getNurseSkillRank(n);
    if(rank===3) s-=500;           // 일반 LV3 먼저 제거
    if(rank<=2) s-=250;            // 그래도 안 되면 주니어 제거
    if(isNurseSeniorSupport(n)) s+=8000;
    s-=nightCount(n)*20;
    const prev=d>1 && codeAt(n,d-1)==='N';
    const next=d<last && codeAt(n,d+1)==='N';
    if(prev&&next) s+=120;         // 3N 가운데는 되도록 보존
    return s;
  }
  let removed=0;
  const days=[];
  for(let pass=0; pass<10; pass++){
    let changed=false;
    for(let d=1; d<=last; d++){
      if(!stepNightDayHasUnsafePair(d)) continue;
      let arr=nurses.filter(n=>codeAt(n,d)==='N');
      // 시니어 투입 교정이 실패한 경우에는 안전조합이 될 때까지 N 인원을 줄입니다.
      while(arr.length>=2 && !arr.some(isNurseSeniorSupport)){
        const donors=[...arr].sort((a,b)=>donorScore(a,d)-donorScore(b,d));
        const donor=donors[0];
        if(!donor) break;
        st.schedule[key(d)][donor.id]='OF';
        stepUnlock(y,m,d,donor.id);
        removed++; changed=true;
        days.push(`${makeDateKey(y,m,d)} ${donor.name}`);
        stepLog(`3단계 N 주니어끼리 배정 제거 ${makeDateKey(y,m,d)} ${donor.name} N→OF`);
        arr=nurses.filter(n=>codeAt(n,d)==='N');
      }
    }
    if(!changed) break;
  }
  return {removed, days:[...new Set(days)]};
}

function stepRepairNightSeniorJuniorPairing(){
  // v14.1.31: N 2명 근무 조합의 하드 안전검사입니다.
  // 원칙: LV3 일반 + LV1/LV2 주니어, LV3+LV3, LV1/LV2끼리처럼 시니어지원자가 없는 N 조합은 금지합니다.
  // 3단계 배정 순간에도 막고, 이미 생긴 조합은 같은 날짜/교차교환으로 보정합니다.
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return {swaps:0, unresolved:[]};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const y=st.y, m=st.m, last=daysInMonth(y,m);
  const fixedRest=['AL','SL','WO','HA','HP'];
  function key(d){ return makeDateKey(y,m,d); }
  function codeAt(n,d){ return String(st.schedule[key(d)]?.[n.id]||'').toUpperCase(); }
  function nightCount(n){ return Number((summarizeSchedule(st.schedule,nurses,y,m)[n.id]||{}).nights||0); }
  function maxNight(n){ return stepIsNightKeep(n) ? nightKeepMonthlyTargetByDays(last) : getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6); }
  function isFixedRest(c){ return fixedRest.includes(String(c||'').toUpperCase()); }
  function assignedN(day){ return nurses.filter(n=>codeAt(n,day)==='N'); }
  function hasBadPair(day){
    return stepNightDayHasUnsafePair(day);
  }
  function donorScore(n,day){
    // 해당 날짜에서 빼낼 대상. LV3 일반을 먼저 빼고, 그래도 안 되면 N 많은 주니어를 빼냅니다.
    let s=0;
    const rank=getNurseSkillRank(n);
    if(rank===3) s-=400;
    if(rank<=2) s+=50;
    if(stepIsNightKeep(n)) s+=900;
    s += nightCount(n)*15;
    return s;
  }
  function seniorCandidateScore(n,day){
    let s=0;
    const cur=codeAt(n,day);
    if(cur==='') s-=280;
    if(cur==='OF'||cur==='O') s-=230;
    if(stepLocked(y,m,day,n.id)) s+=100;
    s+=nightCount(n)*70;
    if(hasNurseSkillTag(n,'차지가능')) s-=120;
    if(hasNurseSkillTag(n,'프리셉터')) s-=90;
    if(getNurseSkillRank(n)>=5) s-=60;
    return s;
  }
  function canTakeNOnDay(n,day,opts={}){
    if(!stepAllowed(n,'N')) return false;
    if(stepIsRestricted(n,getDateType(y,m,day))) return false;
    if(!isPersonalShiftAllowedForDateType(n,'N',getDateType(y,m,day))) return false;
    const cur=codeAt(n,day);
    if(!stepIsRest(cur)) return false;
    if(isFixedRest(cur)) return false;
    if(!opts.ignoreMax && nightCount(n)>=maxNight(n)) return false;
    const old=st.schedule[key(day)]?.[n.id]||'';
    const lock=stepLockReason(y,m,day,n.id);
    const ok=stepCanPlace(n,'N',day,{replace:true,overrideLock:true,overrideNightGap:false,overrideNextWanted:true});
    st.schedule[key(day)][n.id]=old;
    if(lock) stepLock(y,m,day,n.id,lock); else stepUnlock(y,m,day,n.id);
    return ok;
  }
  function canSeniorTakeSameDay(senior,day,donor){
    if(!isNurseSeniorSupport(senior)) return false;
    if(codeAt(senior,day)==='N') return false;
    if(!canTakeNOnDay(senior,day,{ignoreMax:false})) return false;
    return true;
  }
  function swapInSeniorSameDay(day, donor, senior){
    if(!canSeniorTakeSameDay(senior,day,donor)) return false;
    st.schedule[key(day)][donor.id]='OF';
    stepUnlock(y,m,day,donor.id);
    st.schedule[key(day)][senior.id]='N';
    stepLock(y,m,day,senior.id,'3단계 N 주니어-시니어 조합교정');
    return true;
  }
  function canCrossSwap(day, donor, senior, seniorNightDay){
    if(!isNurseSeniorSupport(senior)) return false;
    if(senior.id===donor.id) return false;
    if(codeAt(donor,day)!=='N') return false;
    if(codeAt(senior,seniorNightDay)!=='N') return false;
    if(day===seniorNightDay) return false;
    // bad day에서 senior는 쉴 수 있어야 하고, seniorNightDay에서 donor가 쉴 수 있어야 교차교환이 가능합니다.
    if(!canTakeNOnDay(senior,day,{ignoreMax:true})) return false; // senior는 N 개수 변화 없음
    if(!canTakeNOnDay(donor,seniorNightDay,{ignoreMax:true})) return false; // donor도 N 개수 변화 없음

    const k1=key(day), k2=key(seniorNightDay);
    const oldDonor1=st.schedule[k1]?.[donor.id]||'';
    const oldSenior1=st.schedule[k1]?.[senior.id]||'';
    const oldDonor2=st.schedule[k2]?.[donor.id]||'';
    const oldSenior2=st.schedule[k2]?.[senior.id]||'';
    const lD1=stepLockReason(y,m,day,donor.id), lS1=stepLockReason(y,m,day,senior.id);
    const lD2=stepLockReason(y,m,seniorNightDay,donor.id), lS2=stepLockReason(y,m,seniorNightDay,senior.id);

    st.schedule[k1][donor.id]='OF';
    st.schedule[k1][senior.id]='N';
    st.schedule[k2][senior.id]='OF';
    st.schedule[k2][donor.id]='N';
    const ok=!hasBadPair(day) && !hasBadPair(seniorNightDay);

    st.schedule[k1][donor.id]=oldDonor1;
    st.schedule[k1][senior.id]=oldSenior1;
    st.schedule[k2][donor.id]=oldDonor2;
    st.schedule[k2][senior.id]=oldSenior2;
    [[day,donor.id,lD1],[day,senior.id,lS1],[seniorNightDay,donor.id,lD2],[seniorNightDay,senior.id,lS2]].forEach(([dd,nid,reason])=>{
      if(reason) stepLock(y,m,dd,nid,reason); else stepUnlock(y,m,dd,nid);
    });
    return ok;
  }
  function doCrossSwap(day, donor, senior, seniorNightDay){
    if(!canCrossSwap(day,donor,senior,seniorNightDay)) return false;
    st.schedule[key(day)][donor.id]='OF';
    stepUnlock(y,m,day,donor.id);
    st.schedule[key(day)][senior.id]='N';
    stepLock(y,m,day,senior.id,'3단계 N 주니어-시니어 교차교환');
    st.schedule[key(seniorNightDay)][senior.id]='OF';
    stepUnlock(y,m,seniorNightDay,senior.id);
    st.schedule[key(seniorNightDay)][donor.id]='N';
    stepLock(y,m,seniorNightDay,donor.id,'3단계 N 주니어-시니어 교차교환');
    return true;
  }

  let swaps=0;
  const unresolved=[];
  for(let pass=0; pass<20; pass++){
    let changed=false;
    for(let d=1; d<=last; d++){
      if(!hasBadPair(d)) continue;
      const arr=assignedN(d);
      const donors=[...arr].sort((a,b)=>donorScore(a,d)-donorScore(b,d));
      let fixed=false;

      // 1) 같은 날짜 OFF/공백 시니어를 바로 투입
      for(const donor of donors){
        const cands=nurses
          .filter(n=>n.id!==donor.id)
          .filter(n=>!arr.some(x=>x.id===n.id))
          .filter(n=>canSeniorTakeSameDay(n,d,donor))
          .sort((a,b)=>seniorCandidateScore(a,d)-seniorCandidateScore(b,d));
        if(cands.length && swapInSeniorSameDay(d,donor,cands[0])){
          swaps++; changed=true; fixed=true;
          stepLog(`3단계 N 시니어-주니어 같은날교정 ${makeDateKey(y,m,d)} ${donor.name}→${cands[0].name}`);
          break;
        }
      }
      if(fixed) continue;

      // 2) 같은 날짜 교정이 안 되면, 다른 날짜의 시니어 N과 교차교환
      const seniors=nurses.filter(isNurseSeniorSupport).sort((a,b)=>seniorCandidateScore(a,d)-seniorCandidateScore(b,d));
      for(const donor of donors){
        for(const senior of seniors){
          if(senior.id===donor.id) continue;
          const seniorDays=[];
          for(let sd=1; sd<=last; sd++){
            if(codeAt(senior,sd)==='N') seniorDays.push(sd);
          }
          seniorDays.sort((a,b)=>Math.abs(a-d)-Math.abs(b-d));
          for(const sd of seniorDays){
            if(doCrossSwap(d,donor,senior,sd)){
              swaps++; changed=true; fixed=true;
              stepLog(`3단계 N 시니어-주니어 교차교환 ${makeDateKey(y,m,d)} ${donor.name}↔${senior.name}(${makeDateKey(y,m,sd)})`);
              break;
            }
          }
          if(fixed) break;
        }
        if(fixed) break;
      }
      if(!fixed && hasBadPair(d)) unresolved.push(`${makeDateKey(y,m,d)} N`);
    }
    if(!changed) break;
  }
  return {swaps, unresolved:[...new Set(unresolved)]};
}

function stepNightMaxOverages(){
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return [];
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const stats=summarizeSchedule(st.schedule,nurses,st.y,st.m);
  return nurses
    .filter(n=>stepAllowed(n,'N'))
    .map(n=>{
      const maxN=stepIsNightKeep(n) ? nightKeepMonthlyTargetByDays(daysInMonth(st.y,st.m)) : getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6);
      const cnt=Number(stats[n.id]?.nights||0);
      return {n,cnt,maxN};
    })
    .filter(x=>x.maxN>=0 && x.cnt>x.maxN);
}
function stepEnforceNightMaxStrict(){
  // v14.1.28: 혹시 이전 버전 결과나 보정 과정에서 개인별 N 최대값을 초과한 경우, 초과분을 OF로 되돌립니다.
  // 이후 N 부족은 최대값을 넘지 않는 다른 후보로만 다시 교정합니다.
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return 0;
  const last=daysInMonth(st.y,st.m);
  let fixed=0;
  for(let pass=0; pass<20; pass++){
    const over=stepNightMaxOverages();
    if(!over.length) break;
    let changed=false;
    over.forEach(row=>{
      let extra=row.cnt-row.maxN;
      for(let d=last; d>=1 && extra>0; d--){
        const key=makeDateKey(st.y,st.m,d);
        if(String(st.schedule[key]?.[row.n.id]||'').toUpperCase()!=='N') continue;
        st.schedule[key][row.n.id]='OF';
        stepUnlock(st.y,st.m,d,row.n.id);
        fixed++; extra--; changed=true;
        stepLog(`3단계 N 최대개수 초과 교정 ${row.n.name} ${makeDateKey(st.y,st.m,d)} N→OF (${row.cnt}/${row.maxN})`);
      }
    });
    if(!changed) break;
  }
  return fixed;
}

function stepClearGeneralNightStage(nurses){
  // 3단계를 다시 누를 때 예전 후보점수/이전 실행 결과가 남아 있으면 순번제가 적용되지 않는 것처럼 보입니다.
  // 일반 N 순번 대상자만 초기화하고, 나이트킵/요일조건 우선 N/원티드/연차/반차/병가는 유지합니다.
  const st=stepEnsureState(); if(!st) return 0;
  const qNurses=stepGeneralNightRotationQueue(nurses);
  const ids=new Set(qNurses.map(n=>n.id));
  let cleared=0;
  for(let d=1; d<=daysInMonth(st.y,st.m); d++){
    const key=makeDateKey(st.y,st.m,d);
    qNurses.forEach(n=>{
      const code=String(st.schedule[key]?.[n.id]||'').toUpperCase();
      const reason=stepLockReason(st.y,st.m,d,n.id);
      if(stepIsConditionedNightLockReason(reason)) return;
      if(code==='N'){
        st.schedule[key][n.id]='';
        stepUnlock(st.y,st.m,d,n.id);
        cleared++;
      }else if(code==='OF' && !reason.includes('전월 N 후 OFF') && (reason.includes('N후') || reason.includes('3단계') || reason.includes('순번'))){
        st.schedule[key][n.id]='';
        stepUnlock(st.y,st.m,d,n.id);
      }
    });
  }
  st.nightQueue={ids:qNurses.map(n=>n.id), skipped:[], cycleUsed:[], skipLog:{}};
  return cleared;
}



function stepMandatoryFillNightShortagesWithSafePair(){
  // v14.1.35: 3단계는 N 부족을 남기고 다음 단계로 넘어가면 안 됩니다.
  // 안전조합을 우선 유지하면서, N 1명 날짜는 3단계 내부에서 즉시 보정합니다.
  // 여기서는 N후 OFF 잠금/N 텀/WO 전날 제한은 완화하지만, 고정휴가·근무유형·개인별 N 최대·연속N 최대는 유지합니다.
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return {fixed:0, unresolved:[]};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const y=st.y, m=st.m, last=daysInMonth(y,m);
  const startedAt=Date.now();
  const expired=()=>Date.now()-startedAt>900;
  const enforceSenior=shouldEnforceSeniorSupportForShift(nurses,'N');
  const fixedRest=['AL','SL','HA','HP','WO'];
  function key(d){ return makeDateKey(y,m,d); }
  function codeAt(n,d){ return String(st.schedule[key(d)]?.[n.id]||'').toUpperCase(); }
  function isFixed(c){ return fixedRest.includes(String(c||'').toUpperCase()); }
  function ns(day){ return nurses.filter(n=>codeAt(n,day)==='N'); }
  function nCount(n){ return Number((summarizeSchedule(st.schedule,nurses,y,m)[n.id]||{}).nights||0); }
  function maxN(n){ return stepIsNightKeep(n) ? nightKeepMonthlyTargetByDays(last) : getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6); }
  function maxConsecN(n){ return Math.max(1,getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight??3)); }
  function consecIfN(n,day){
    let c=1;
    for(let d=day-1; d>=1; d--){ if(codeAt(n,d)==='N') c++; else break; }
    for(let d=day+1; d<=last; d++){ if(codeAt(n,d)==='N') c++; else break; }
    return c;
  }
  function hardCanTake(n,day,needSenior){
    if(needSenior && !isNurseSeniorSupport(n)) return false;
    if(!stepIsCountedStaff(n)) return false;
    if(stepIsNightKeep(n)) return false;
    if(!stepAllowed(n,'N')) return false;
    if(stepIsRestricted(n,getDateType(y,m,day))) return false;
    if(!isPersonalShiftAllowedForDateType(n,'N',getDateType(y,m,day))) return false;
    const cur=codeAt(n,day);
    if(cur==='N') return false;
    if(['D','E','MD','SD6'].includes(cur)) return false;
    if(isFixed(cur)) return false;
    if(stepViolatesPreviousMonthNightReentryGap(n,day)) return false;
    if(stepViolatesNightRecoveryOffGap(n,day)) return false;
    if(nCount(n)>=maxN(n)) return false;
    if(consecIfN(n,day)>maxConsecN(n)) return false;
    // N→D / N→E 법적 전환 금지: 다음날이 D 또는 E면 오늘 N 배치 불가
    if(day<last){const nc=String(st.schedule[makeDateKey(y,m,day+1)]?.[n.id]||'').toUpperCase(); if(nc==='D'||nc==='E') return false;}
    return true;
  }
  function score(n,day){
    let s=nCount(n)*100;
    if(isNurseSeniorSupport(n)) s-=80;
    if(hasNurseSkillTag(n,'차지가능')) s-=45;
    if(hasNurseSkillTag(n,'프리셉터')) s-=30;
    const cur=codeAt(n,day);
    if(cur===''||cur==='O'||cur==='OF') s-=40;
    if(stepLocked(y,m,day,n.id)) s+=30;
    s+=String(n.name||'').localeCompare('', 'ko')/100000;
    return s;
  }
  function place(n,day,reason){
    st.schedule[key(day)][n.id]='N';
    stepLock(y,m,day,n.id,reason);
    for(let r=1; r<=stepNightOffCount(n); r++){
      const od=day+r; if(od>last) break;
      const ok=key(od), oc=String(st.schedule[ok]?.[n.id]||'').toUpperCase();
      if(!['AL','SL','WO','HA','HP','N','D','E','MD','SD6'].includes(oc)){
        st.schedule[ok][n.id]='OF';
        stepLock(y,m,od,n.id,'N후 2OFF');
      }
    }
    return true;
  }
  let fixed=0;
  for(let pass=0; pass<3 && !expired(); pass++){
    let changed=false;
    const misses=stepNightShortages();
    if(!misses.length) break;
    for(const miss of misses){
      let guard=0;
      while(!expired() && stepCount(st.schedule,y,m,miss.d,'N',nurses)<getStaffingMinForDate(ward,y,m,miss.d,'N') && guard++<nurses.length+2){
        const arr=ns(miss.d);
        const needSenior=enforceSenior && !arr.some(isNurseSeniorSupport);
        let cands=nurses.filter(n=>hardCanTake(n,miss.d,needSenior)).sort((a,b)=>score(a,miss.d)-score(b,miss.d));
        if(!cands.length && !needSenior){
          cands=nurses.filter(n=>hardCanTake(n,miss.d,false)).sort((a,b)=>score(a,miss.d)-score(b,miss.d));
        }
        if(!cands.length) break;
        place(cands[0],miss.d,'3단계 N 부족 즉시보정-안전조합');
        fixed++; changed=true;
        stepLog(`3단계 N 부족 즉시보정 ${makeDateKey(y,m,miss.d)} ${cands[0].name} N 추가`);
      }
    }
    const pair=expired() ? {swaps:0} : stepRepairNightSeniorJuniorPairing();
    if(pair.swaps){ fixed+=pair.swaps; changed=true; }
    if(!changed) break;
  }
  const unresolved=[];
  stepNightShortages().forEach(x=>unresolved.push(`${makeDateKey(y,m,x.d)} N ${x.got}/${x.need}`));
  for(let d=1; d<=last; d++){
    if(stepNightDayHasUnsafePair(d)) unresolved.push(`${makeDateKey(y,m,d)} N 시니어지원자 없음`);
  }
  return {fixed, unresolved:[...new Set(unresolved)]};
}

function stepRepairNightShortageBySeniorSwap(){
  // N 최소인원은 부족한데 시니어 지원자가 개인별 N 최대치에 걸린 경우,
  // 앞 날짜의 시니어 N을 N 여유가 있는 일반 후보에게 넘기고 시니어를 부족 날짜로 이동합니다.
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return {fixed:0, swaps:0, forced:0, unresolved:[]};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const y=st.y, m=st.m, last=daysInMonth(y,m);
  const startedAt=Date.now();
  const expired=()=>Date.now()-startedAt>900;
  const enforceSenior=shouldEnforceSeniorSupportForShift(nurses,'N');
  function key(d){ return makeDateKey(y,m,d); }
  function code(n,d){ return String(st.schedule[key(d)]?.[n.id]||'').toUpperCase(); }
  function set(n,d,c){ if(!st.schedule[key(d)]) st.schedule[key(d)]={}; st.schedule[key(d)][n.id]=c; }
  function ns(d){ return nurses.filter(n=>code(n,d)==='N'); }
  function fixedRest(c){ return ['AL','SL','WO','HA','HP'].includes(String(c||'').toUpperCase()); }
  function nCount(n){ return Number((summarizeSchedule(st.schedule,nurses,y,m)[n.id]||{}).nights||0); }
  function maxN(n){ return stepIsNightKeep(n) ? nightKeepMonthlyTargetByDays(last) : getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6); }
  function maxConsecN(n){ return Math.max(1,getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight??3)); }
  function consecIfAssign(n,d){
    let c=1;
    for(let x=d-1; x>=1; x--){ if(code(n,x)==='N') c++; else break; }
    for(let x=d+1; x<=last; x++){ if(code(n,x)==='N') c++; else break; }
    return c;
  }
  function canReceiveShortageSenior(n,d){
    const cur=code(n,d);
    if(!isNurseSeniorSupport(n)) return false;
    if(!stepIsCountedStaff(n) || stepIsNightKeep(n)) return false;
    if(!stepAllowed(n,'N')) return false;
    if(stepIsRestricted(n,getDateType(y,m,d))) return false;
    if(!isPersonalShiftAllowedForDateType(n,'N',getDateType(y,m,d))) return false;
    if(fixedRest(cur) || ['D','E','MD','SD6','N'].includes(cur)) return false;
    if(stepViolatesPreviousMonthNightReentryGap(n,d)) return false;
    if(stepViolatesNightRecoveryOffGap(n,d)) return false;
    if(consecIfAssign(n,d)>maxConsecN(n)) return false;
    // 최소인원 보정에서는 날짜별 최대값보다 최소인원 충족을 우선합니다.
    return true;
  }
  function canReplaceEarlierNight(n,d){
    const cur=code(n,d);
    if(!stepIsCountedStaff(n) || stepIsNightKeep(n)) return false;
    if(!stepAllowed(n,'N')) return false;
    if(stepIsRestricted(n,getDateType(y,m,d))) return false;
    if(!isPersonalShiftAllowedForDateType(n,'N',getDateType(y,m,d))) return false;
    if(fixedRest(cur) || ['D','E','MD','SD6','N'].includes(cur)) return false;
    if(stepViolatesPreviousMonthNightReentryGap(n,d)) return false;
    if(stepViolatesNightRecoveryOffGap(n,d)) return false;
    if(nCount(n)>=maxN(n)) return false;
    if(consecIfAssign(n,d)>maxConsecN(n)) return false;
    const next=d<last ? code(n,d+1) : '';
    if(['AL','SL','HA','HP','D','E'].includes(next)) return false;
    const prev=d>1 ? code(n,d-1) : String(getPreviousMonthLastCode(ward,n.id,y,m)||'').toUpperCase();
    if(violatesWorkTypeTransition(n,prev,'N')) return false;
    return true;
  }
  function scoreReplacement(n){
    let s=nCount(n)*100;
    if(isNurseSeniorSupport(n)) s+=40;
    s+=String(n.name||'').localeCompare('', 'ko')/100000;
    return s;
  }
  function staffingOk(d){
    const got=stepCount(st.schedule,y,m,d,'N',nurses);
    const min=getStaffingMinForDate(ward,y,m,d,'N');
    const max=getStaffingMaxForDate(ward,y,m,d,'N');
    if(got<min) return false;
    if(max!==Infinity && ns(d).length>max) return false;
    if(enforceSenior && min>=2 && ns(d).length>=2 && !ns(d).some(isNurseSeniorSupport)) return false;
    return true;
  }

  let fixed=0, swaps=0, forced=0;
  for(let pass=0; pass<3 && !expired(); pass++){
    const misses=stepNightShortages();
    if(!misses.length) break;
    let changed=false;
    for(const miss of misses){
      const d=miss.d;
      let guard=0;
      while(!expired() && stepCount(st.schedule,y,m,d,'N',nurses)<getStaffingMinForDate(ward,y,m,d,'N') && guard++<nurses.length+2){
        const needSenior=enforceSenior && getStaffingMinForDate(ward,y,m,d,'N')>=2 && !ns(d).some(isNurseSeniorSupport);
        if(!needSenior){
          if(stepForceSingleNightForDate(d,'3단계 N 부족 최종 단일보정')){ fixed++; forced++; changed=true; continue; }
          break;
        }
        const seniors=nurses
          .filter(n=>canReceiveShortageSenior(n,d))
          .sort((a,b)=>nCount(a)-nCount(b) || String(a.name||'').localeCompare(String(b.name||''),'ko'));
        let repaired=false;
        for(const senior of seniors.slice(0,8)){
          for(let sd=last; sd>=1 && !repaired && !expired(); sd--){
            if(sd===d || code(senior,sd)!=='N') continue;
            if(!ns(sd).some(x=>x.id!==senior.id && isNurseSeniorSupport(x))) continue;
            const replacements=nurses
              .filter(n=>n.id!==senior.id && canReplaceEarlierNight(n,sd))
              .sort((a,b)=>scoreReplacement(a)-scoreReplacement(b));
            for(const repl of replacements.slice(0,8)){
              const snapShort=Object.assign({}, st.schedule[key(d)]||{});
              const snapSource=Object.assign({}, st.schedule[key(sd)]||{});
              set(senior,sd,'OF');
              set(repl,sd,'N');
              set(senior,d,'N');
              if(staffingOk(sd) && stepCount(st.schedule,y,m,d,'N',nurses)<=getStaffingMaxForDate(ward,y,m,d,'N')){
                stepLock(y,m,sd,repl.id,'3단계 N 월말부족 시니어교환');
                stepUnlock(y,m,sd,senior.id);
                stepLock(y,m,d,senior.id,'3단계 N 월말부족 시니어교환');
                stepNightQueueMarkPlaced(repl);
                stepNightQueueMarkPlaced(senior);
                swaps++; fixed++; changed=true; repaired=true;
                stepLog(`3단계 N 월말부족 시니어교환 ${makeDateKey(y,m,sd)} ${senior.name}→${repl.name}, ${makeDateKey(y,m,d)} ${senior.name} 배치`);
                break;
              }
              st.schedule[key(d)]=snapShort;
              st.schedule[key(sd)]=snapSource;
            }
          }
          if(repaired) break;
        }
        if(!repaired) break;
      }
    }
    if(!changed) break;
  }
  const unresolved=[...new Set(stepNightShortages().map(x=>`${makeDateKey(y,m,x.d)} N ${x.got}/${x.need}`))];
  return {fixed, swaps, forced, unresolved};
}

function stepExtendPreviousNightForMinimumStaffing(){
  // 최소인원은 OFF/월간 N 상한보다 우선합니다.
  // 다만 전월 N 후 회복 OFF와 월경계 N 재진입 텀은 깨지지 않게 유지합니다.
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return {fixed:0, overMax:[]};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const y=st.y, m=st.m, last=daysInMonth(y,m);
  const startedAt=Date.now();
  const expired=()=>Date.now()-startedAt>700;
  const enforceSenior=shouldEnforceSeniorSupportForShift(nurses,'N');
  function key(d){ return makeDateKey(y,m,d); }
  function code(n,d){ return String(st.schedule[key(d)]?.[n.id]||'').toUpperCase(); }
  function set(n,d,c){ if(!st.schedule[key(d)]) st.schedule[key(d)]={}; st.schedule[key(d)][n.id]=c; }
  function ns(d){ return nurses.filter(n=>code(n,d)==='N'); }
  function fixedRest(c){ return ['AL','SL','WO','HA','HP'].includes(String(c||'').toUpperCase()); }
  function nCount(n){ return Number((summarizeSchedule(st.schedule,nurses,y,m)[n.id]||{}).nights||0); }
  function maxN(n){ return stepIsNightKeep(n) ? nightKeepMonthlyTargetByDays(last) : getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6); }
  function maxConsecN(n){ return Math.max(1,getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight??3)); }
  function consecIfAssign(n,d){
    let c=1;
    for(let x=d-1; x>=1; x--){ if(code(n,x)==='N') c++; else break; }
    for(let x=d+1; x<=last; x++){ if(code(n,x)==='N') c++; else break; }
    return c;
  }
  function canExtend(n,d,needSenior,relaxConsecutive=false){
    const cur=code(n,d), prev=d>1?code(n,d-1):'';
    if(d<=1 || prev!=='N') return false;
    if(needSenior && !isNurseSeniorSupport(n)) return false;
    if(!stepIsCountedStaff(n) || stepIsNightKeep(n)) return false;
    if(!stepAllowed(n,'N')) return false;
    if(stepIsRestricted(n,getDateType(y,m,d))) return false;
    if(!isPersonalShiftAllowedForDateType(n,'N',getDateType(y,m,d))) return false;
    if(fixedRest(cur) || ['D','E','MD','SD6','N'].includes(cur)) return false;
    if(stepIsRecoveryOffLock(y,m,d,n.id) && stepLockReason(y,m,d,n.id).includes('전월 N 후 OFF')) return false;
    if(stepViolatesPreviousMonthNightReentryGap(n,d)) return false;
    if(stepViolatesNightRecoveryOffGap(n,d)) return false;
    if(consecIfAssign(n,d)>maxConsecN(n) && !relaxConsecutive) return false;
    if(stepCount(st.schedule,y,m,d,'N',nurses)>=getStaffingMaxForDate(ward,y,m,d,'N')) return false;
    if(!stepNightCombinationSafeIfAssign(n,d,{replace:true,overrideLock:true,overrideNightGap:false,overrideMaxNight:true,overrideNextWanted:true})) return false;
    const next=d<last ? code(n,d+1) : '';
    if(['AL','SL','HA','HP','D','E'].includes(next)) return false;
    return true;
  }
  let fixed=0; const overMax=[];
  for(let pass=0; pass<2 && !expired(); pass++){
    let changed=false;
    const misses=stepNightShortages();
    if(!misses.length) break;
    for(const miss of misses){
      let guard=0;
      while(!expired() && stepCount(st.schedule,y,m,miss.d,'N',nurses)<getStaffingMinForDate(ward,y,m,miss.d,'N') && guard++<nurses.length+2){
        const needSenior=enforceSenior && getStaffingMinForDate(ward,y,m,miss.d,'N')>=2 && !ns(miss.d).some(isNurseSeniorSupport);
        let candidates=nurses.filter(n=>canExtend(n,miss.d,needSenior,false));
        const underMaxCandidates=candidates.filter(n=>nCount(n)<maxN(n));
        const cands=underMaxCandidates
          .sort((a,b)=>{
            const ao=nCount(a)>=maxN(a)?1:0, bo=nCount(b)>=maxN(b)?1:0;
            return ao-bo || (needSenior && isNurseSeniorSupport(a)?-1:0) - (needSenior && isNurseSeniorSupport(b)?-1:0) || nCount(a)-nCount(b) || String(a.name||'').localeCompare(String(b.name||''),'ko');
          });
        if(!cands.length) break;
        const n=cands[0], before=nCount(n), limit=maxN(n), beforeConsec=consecIfAssign(n,miss.d), limitConsec=maxConsecN(n);
        set(n,miss.d,'N');
        stepUnlock(y,m,miss.d,n.id);
        stepLock(y,m,miss.d,n.id,'3단계 최소인원 우선 N연장');
        for(let r=1; r<=stepNightOffCount(n); r++){
          const od=miss.d+r; if(od>last) break;
          const oc=code(n,od);
          if(!['AL','SL','WO','HA','HP','N','D','E','MD','SD6'].includes(oc)){
            set(n,od,'OF');
            stepLock(y,m,od,n.id,'N후 2OFF');
          }
        }
        if(before>=limit) overMax.push(`${n.name} ${before+1}/${limit}`);
        if(beforeConsec>limitConsec) overMax.push(`${n.name} 연속N ${beforeConsec}/${limitConsec}`);
        fixed++; changed=true;
        stepLog(`3단계 최소인원 우선 N연장 ${makeDateKey(y,m,miss.d)} ${n.name} N 추가${before>=limit?' (월 N 상한 초과)':''}${beforeConsec>limitConsec?' (연속N 상한 초과)':''}`);
      }
    }
    if(!changed) break;
  }
  return {fixed, overMax};
}

function stepImproveNightBlockQuality(){
  // v14.1.35: Night는 개수만 맞추는 것이 아니라 2~3N 블록 품질을 우선합니다.
  // 일반 3교대/나이트킵 모두 1N 단독 블록을 최대한 줄이고, N 많은 직원의 날짜를 N 부족/단독 직원에게 교환합니다.
  // 날짜별 N 인원, 개인별 N 최대, 고정휴가, 시니어지원자 포함 조건은 유지합니다.
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return {moves:0, singles:0};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const y=st.y, m=st.m, last=daysInMonth(y,m);
  function key(d){ return makeDateKey(y,m,d); }
  function codeAt(n,d){ return String(st.schedule[key(d)]?.[n.id]||'').toUpperCase(); }
  function isN(n,d){ return codeAt(n,d)==='N'; }
  function isFixedRestCode(c){ return ['AL','SL','WO','HA','HP'].includes(String(c||'').toUpperCase()); }
  function nCount(n){ return Number((summarizeSchedule(st.schedule,nurses,y,m)[n.id]||{}).nights||0); }
  function maxN(n){ return stepIsNightKeep(n) ? nightKeepMonthlyTargetByDays(last) : getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6); }
  function blockList(n){
    const arr=[]; let stDay=0;
    for(let d=1; d<=last+1; d++){
      const c=d<=last && isN(n,d);
      if(c && !stDay) stDay=d;
      if((!c || d>last) && stDay){ arr.push({n,start:stDay,end:d-1,len:d-stDay}); stDay=0; }
    }
    return arr;
  }
  function allSingles(){
    return nurses
      .filter(n=>stepAllowed(n,'N') && !stepIsNightKeep(n))
      .flatMap(n=>blockList(n).filter(b=>b.len===1));
  }
  function donorEdgeScore(donor, day){
    const prev=day>1 && isN(donor,day-1);
    const next=day<last && isN(donor,day+1);
    let s=0;
    if(prev && next) s+=800;       // 3N 가운데를 빼는 것은 마지막 후보
    else if(prev || next) s-=80;   // 블록 가장자리는 선호
    else s+=200;                   // donor도 단독이면 가급적 피함
    s-=Math.max(0,nCount(donor)-5)*25;
    return s;
  }
  function canReceiverTake(receiver, day){
    const cur=codeAt(receiver,day);
    if(!stepIsRest(cur) || isFixedRestCode(cur)) return false;
    if(nCount(receiver)>=maxN(receiver)) return false;
    if(!stepAllowed(receiver,'N')) return false;
    if(stepIsRestricted(receiver,getDateType(y,m,day))) return false;
    if(!isPersonalShiftAllowedForDateType(receiver,'N',getDateType(y,m,day))) return false;
    return stepCanPlace(receiver,'N',day,{replace:true,overrideLock:true,overrideNightGap:false,overrideNextWanted:true,overrideRecoveryOff:true,overrideStaffingMax:true});
  }
  function transfer(donor, receiver, day){
    if(!donor || !receiver || donor.id===receiver.id) return false;
    if(!isN(donor,day)) return false;
    if(!canReceiverTake(receiver,day)) return false;
    const k=key(day);
    const oldD=st.schedule[k]?.[donor.id]||'';
    const oldR=st.schedule[k]?.[receiver.id]||'';
    const lD=stepLockReason(y,m,day,donor.id);
    const lR=stepLockReason(y,m,day,receiver.id);
    st.schedule[k][donor.id]='OF'; stepUnlock(y,m,day,donor.id);
    st.schedule[k][receiver.id]='N'; stepLock(y,m,day,receiver.id,'3단계 N 블록품질 교환');
    const shortage=stepCount(st.schedule,y,m,day,'N',nurses)<getStaffingMinForDate(ward,y,m,day,'N');
    const unsafe=stepNightDayHasUnsafePair(day);
    const over=nCount(receiver)>maxN(receiver);
    if(shortage || unsafe || over){
      st.schedule[k][donor.id]=oldD;
      st.schedule[k][receiver.id]=oldR;
      if(lD) stepLock(y,m,day,donor.id,lD); else stepUnlock(y,m,day,donor.id);
      if(lR) stepLock(y,m,day,receiver.id,lR); else stepUnlock(y,m,day,receiver.id);
      return false;
    }
    for(let r=1; r<=stepNightOffCount(receiver); r++){
      const od=day+r; if(od>last) break;
      const ok=key(od), oc=String(st.schedule[ok]?.[receiver.id]||'').toUpperCase();
      if(!['AL','SL','WO','HA','HP','N','D','E','MD','SD6'].includes(oc)){
        st.schedule[ok][receiver.id]='OF';
        stepLock(y,m,od,receiver.id,'N후 2OFF');
      }
    }
    return true;
  }
  let moves=0;
  for(let pass=0; pass<80; pass++){
    const singles=allSingles().sort((a,b)=>{
      const ca=nCount(a.n), cb=nCount(b.n);
      if(ca!==cb) return ca-cb;
      return a.start-b.start;
    });
    if(!singles.length) break;
    let changed=false;
    for(const block of singles){
      const receiver=block.n;
      // 단독 N 앞/뒤 날짜 중 하나를 받아 2N으로 만드는 것을 우선합니다.
      const targetDays=[block.start-1, block.start+1].filter(d=>d>=1&&d<=last);
      targetDays.sort((a,b)=>{
        const an=stepCount(st.schedule,y,m,a,'N',nurses), bn=stepCount(st.schedule,y,m,b,'N',nurses);
        return bn-an || Math.abs(a-block.start)-Math.abs(b-block.start);
      });
      for(const td of targetDays){
        if(!canReceiverTake(receiver,td)) continue;
        const donors=nurses
          .filter(n=>n.id!==receiver.id && !stepIsNightKeep(n) && isN(n,td))
          .filter(n=>nCount(n)>0)
          .sort((a,b)=>{
            const dc=nCount(b)-nCount(a);
            if(dc) return dc;
            return donorEdgeScore(a,td)-donorEdgeScore(b,td);
          });
        for(const donor of donors){
          if(transfer(donor,receiver,td)){
            moves++; changed=true;
            stepLog(`3단계 N 블록품질 교정 ${donor.name} ${makeDateKey(y,m,td)} N → ${receiver.name} (단독N 해소)`);
            break;
          }
        }
        if(changed) break;
      }
      if(changed) break;
    }
    if(!changed) break;
  }
  return {moves, singles:allSingles().length};
}

// 평일 N 부족 교정: 주말에 N이 배정된 비제한 간호사를 평일로 재배치하고,
// 비워진 주말 슬롯을 주말제한(토/일만 N 가능) 간호사로 채운다.
function stepRepairWeekdayNightShortageByWeekendSwap(){
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return {swaps:0};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const y=st.y, m=st.m, last=daysInMonth(y,m);
  function key(d){ return makeDateKey(y,m,d); }
  function codeAt(n,d){ return String(st.schedule[key(d)]?.[n.id]||'').toUpperCase(); }
  function dtype(d){ return getDateType(y,m,d); }
  function isWeekdayType(d){ return dtype(d)==='weekday'; }
  function isWeekendType(d){ return ['sat','sun','holiday'].includes(dtype(d)); }
  function nCount(n){ let c=0; for(let d=1;d<=last;d++) if(codeAt(n,d)==='N') c++; return c; }
  function maxNFor(n){ return stepIsNightKeep(n)?nightKeepMonthlyTargetByDays(last):getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6); }
  function fixedRest(c){ return ['AL','SL','WO','HA','HP'].includes(String(c||'').toUpperCase()); }
  function canWeekendFill(n,wd){
    if(codeAt(n,wd)==='N') return false;
    if(fixedRest(codeAt(n,wd))) return false;
    if(!stepAllowed(n,'N')) return false;
    if(stepIsRestricted(n,dtype(wd))) return false;
    if(!isPersonalShiftAllowedForDateType(n,'N',dtype(wd))) return false;
    if(nCount(n)>=maxNFor(n)) return false;
    return stepCanPlace(n,'N',wd,{replace:true,overrideLock:false});
  }
  const shortages=stepNightShortages().filter(x=>isWeekdayType(x.d));
  if(!shortages.length) return {swaps:0};
  let swaps=0;
  for(const miss of shortages){
    const d=miss.d;
    for(let pass=0; pass<miss.need-miss.got; pass++){
      if(stepCount(st.schedule,y,m,d,'N',nurses)>=getStaffingMinForDate(ward,y,m,d,'N')) break;
      let moved=false;
      // 부족 날짜와 가까운 주말부터 탐색
      const wdCandidates=[];
      for(let wd=1;wd<=last;wd++){ if(isWeekendType(wd)) wdCandidates.push(wd); }
      wdCandidates.sort((a,b)=>Math.abs(a-d)-Math.abs(b-d));
      for(const wd of wdCandidates){
        // 이 주말에서 평일로 옮길 수 있는 비제한 간호사 탐색
        const donors=nurses.filter(n=>{
          if(codeAt(n,wd)!=='N') return false;
          // 이미 잠긴(요일조건) N은 건드리지 않음
          const lr=stepLockReason(y,m,wd,n.id)||'';
          if(lr.includes('요일조건')||lr.includes('나이트킵')||lr.includes('2단계')) return false;
          // 이 간호사가 평일 N 가능한지 (제한 없는 간호사만)
          if(!isPersonalShiftAllowedForDateType(n,'N','weekday')) return false;
          if(!stepAllowed(n,'N')) return false;
          if(stepIsRestricted(n,dtype(d))) return false;
          return true;
        });
        for(const donor of donors){
          const oldWd=st.schedule[key(wd)][donor.id];
          const lockWd=stepLockReason(y,m,wd,donor.id);
          // 주말 N 임시 제거 후 평일 배치 가능 여부 확인
          st.schedule[key(wd)][donor.id]='OF';
          stepUnlock(y,m,wd,donor.id);
          const canDo=stepCanPlace(donor,'N',d,{replace:true,overrideLock:false,overrideNightGap:false});
          if(!canDo){
            st.schedule[key(wd)][donor.id]=oldWd;
            if(lockWd) stepLock(y,m,wd,donor.id,lockWd); else stepUnlock(y,m,wd,donor.id);
            continue;
          }
          // 비워진 주말 슬롯을 채울 수 있는 간호사 탐색 (주말제한 간호사 우선)
          const fillers=nurses.filter(n=>n.id!==donor.id&&canWeekendFill(n,wd))
            .sort((a,b)=>{
              const aRestricted=!isPersonalShiftAllowedForDateType(a,'N','weekday')?0:1;
              const bRestricted=!isPersonalShiftAllowedForDateType(b,'N','weekday')?0:1;
              return aRestricted-bRestricted || nCount(a)-nCount(b);
            });
          const filler=fillers[0];
          if(!filler){
            st.schedule[key(wd)][donor.id]=oldWd;
            if(lockWd) stepLock(y,m,wd,donor.id,lockWd); else stepUnlock(y,m,wd,donor.id);
            continue;
          }
          // 교환 실행
          st.schedule[key(d)][donor.id]='N';
          stepLock(y,m,d,donor.id,'3단계 주말→평일 N 재배치');
          st.schedule[key(wd)][filler.id]='N';
          stepLock(y,m,wd,filler.id,'3단계 주말N 대체배치');
          swaps++;
          stepLog(`3단계 N 주말→평일 재배치: ${donor.name} ${key(wd)}→${key(d)} / ${filler.name} ${key(wd)} 대체`);
          moved=true;
          break;
        }
        if(moved) break;
      }
    }
  }
  return {swaps};
}

function stepRunGeneralNight(){
  const ward=getCurrentWard(), st=stepEnsureState(); if(!ward||!st) return;
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const y=st.y, m=st.m, last=daysInMonth(y,m);
  const enforceSenior=shouldEnforceSeniorSupportForShift(nurses,'N');
  const regularQueue=stepGeneralNightRotationQueue(nurses);
  const cleared=stepClearGeneralNightStage(nurses);
  let placed=0;

  // v14.1.35 Night 블록 엔진
  // 목표: 날짜별 N 부족 0 → 안전조합 → 2~3N 블록 → 개인별 N 균형.
  // 1N은 월말/후보부족 등 불가피한 경우에만 마지막 보정에서 허용합니다.
  function key(d){ return makeDateKey(y,m,d); }
  function codeAt(n,d){ return String(st.schedule[key(d)]?.[n.id]||'').toUpperCase(); }
  function currentNs(d){ return nurses.filter(n=>codeAt(n,d)==='N'); }
  function nCount(n){ return Number((summarizeSchedule(st.schedule,nurses,y,m)[n.id]||{}).nights||0); }
  function maxN(n){ return stepIsNightKeep(n) ? nightKeepMonthlyTargetByDays(last) : getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6); }
  function fixedRest(code){ return ['AL','SL','WO','HA','HP'].includes(String(code||'').toUpperCase()); }
  function eligibleForN(n,d,relaxed=false){
    const cur=codeAt(n,d);
    if(!stepIsCountedStaff(n)) return false;
    if(stepIsNightKeep(n)) return false;
    if(!stepAllowed(n,'N')) return false;
    if(stepIsRestricted(n,getDateType(y,m,d))) return false;
    if(!isPersonalShiftAllowedForDateType(n,'N',getDateType(y,m,d))) return false;
    if(fixedRest(cur)) return false;
    if(['D','E','MD','SD6','N'].includes(cur)) return false;
    if(nCount(n)>=maxN(n)) return false;
    // N 최소 인원이 이미 충족된 날에는 3교대 추가 배치를 억제합니다.
    // → NK 등이 있는 날 N을 낭비적으로 소진하지 않아 월말 N 부족을 방지합니다.
    // relaxed 패스에서는 이 제한을 해제합니다.
    if(!relaxed && stepCount(st.schedule,y,m,d,'N',nurses)>=getStaffingMinForDate(ward,y,m,d,'N')) return false;
    return stepCanPlace(n,'N',d,{replace:true,overrideLock:relaxed,overrideNightGap:relaxed,overrideNextWanted:relaxed,skipNightPairSafety:false});
  }
  function blockCandidateScore(n,start,len,needSenior){
    let s=0;
    s += nCount(n)*130;
    s -= len*35; // 3N/2N 선호
    const idx=regularQueue.findIndex(x=>x.id===n.id);
    if(idx>=0) s+=idx*4;
    if(needSenior && isNurseSeniorSupport(n)) s-=600;
    if(isNurseSeniorSupport(n)){
      if(hasNurseSkillTag(n,'차지가능')) s-=35;
      if(hasNurseSkillTag(n,'프리셉터')) s-=25;
      s-=15;
    }
    const q=stepNightQueueState(nurses);
    if((q.skipped||[]).includes(n.id)) s-=80;
    // 월 전체 분산: 너무 같은 사람에게 초반 몰림 방지
    s += Math.abs(start-(last*0.55))/200;
    return s;
  }
  function canPlaceWholeBlock(n,start,len,relaxed,needSenior){
    if(needSenior && !isNurseSeniorSupport(n)) return false;
    if(nCount(n)+len>maxN(n)) return false;
    for(let i=0;i<len;i++){
      const d=start+i;
      if(d<1 || d>last) return false;
      if(!eligibleForN(n,d,relaxed)) return false;
      if(stepCount(st.schedule,y,m,d,'N',nurses)>=getStaffingMaxForDate(ward,y,m,d,'N')) return false;
      // 두 번째 N 이상을 만드는 순간 안전조합이 깨지면 배치하지 않습니다.
      if(!stepNightCombinationSafeIfAssign(n,d,{replace:true,overrideLock:relaxed,overrideNightGap:relaxed,overrideNextWanted:relaxed})) return false;
    }
    return true;
  }
  function placeWholeBlock(n,start,len,reason,relaxed=false){
    if(!canPlaceWholeBlock(n,start,len,relaxed,false)) return false;
    for(let i=0;i<len;i++){
      const d=start+i;
      st.schedule[key(d)][n.id]='N';
      stepLock(y,m,d,n.id,reason);
      placed++;
    }
    for(let r=1; r<=stepNightOffCount(n); r++){
      const od=start+len-1+r; if(od>last) break;
      const ok=key(od), oc=String(st.schedule[ok]?.[n.id]||'').toUpperCase();
      if(!['AL','SL','WO','HA','HP','N','D','E','MD','SD6'].includes(oc)){
        st.schedule[ok][n.id]='OF';
        stepLock(y,m,od,n.id,'N후 2OFF');
      }
    }
    stepNightQueueMarkPlaced(n);
    stepLog(`${reason} ${n.name} ${makeDateKey(y,m,start)}부터 N ${len}개 배치`);
    return true;
  }
  function tryPlaceBlockCoveringDay(day,relaxed=false,allowSingle=false){
    const need=getStaffingMinForDate(ward,y,m,day,'N');
    const arr=currentNs(day);
    const hasSenior=arr.some(isNurseSeniorSupport);
    const needSenior=need>=2 && !hasSenior;
    const lens=[];
    for(const l of [3,2]) lens.push(l);
    if(allowSingle) lens.push(1);
    const options=[];
    for(const len of lens){
      for(let start=day-len+1; start<=day; start++){
        if(start<1 || start+len-1>last) continue;
        options.push({start,len});
      }
    }
    const pool=nurses.filter(n=>stepIsCountedStaff(n)&&!stepIsNightKeep(n)&&stepAllowed(n,'N'));
    const candidates=[];
    for(const opt of options){
      for(const n of pool){
        if(needSenior && !isNurseSeniorSupport(n)) continue;
        if(canPlaceWholeBlock(n,opt.start,opt.len,relaxed,needSenior)){
          candidates.push({n,start:opt.start,len:opt.len,score:blockCandidateScore(n,opt.start,opt.len,needSenior)});
        }
      }
    }
    candidates.sort((a,b)=>a.score-b.score);
    if(!candidates.length) return false;
    const c=candidates[0];
    return placeWholeBlock(c.n,c.start,c.len,relaxed?'3단계 N 블록 텀완화배치':'3단계 N 블록 기본배치',relaxed);
  }

  // 월초부터 끝까지 전체 패턴을 먼저 잡습니다. 매 날짜마다 부족분은 2~3N 블록으로 메웁니다.
  for(let pass=0; pass<5; pass++){
    let changed=false;
    for(let d=1; d<=last; d++){
      while(stepCount(st.schedule,y,m,d,'N',nurses)<getStaffingMinForDate(ward,y,m,d,'N')){
        if(tryPlaceBlockCoveringDay(d,false,false)) changed=true;
        else break;
      }
    }
    if(!changed) break;
  }
  // 후보 부족 날짜는 텀/보호OFF를 완화하되 2~3N 블록 원칙을 유지합니다.
  for(let pass=0; pass<3; pass++){
    let changed=false;
    for(let d=1; d<=last; d++){
      while(stepCount(st.schedule,y,m,d,'N',nurses)<getStaffingMinForDate(ward,y,m,d,'N')){
        if(tryPlaceBlockCoveringDay(d,true,false)) changed=true;
        else break;
      }
    }
    if(!changed) break;
  }

  const correction=stepCorrectNightBeforeNext();
  const pairFix1=stepRepairNightSeniorJuniorPairing();
  if(pairFix1.swaps){ stepLog(`3단계 N 시니어 조합 1차교정 ${pairFix1.swaps}건 완료`); }
  const quality1=stepImproveNightBlockQuality();
  if(quality1.moves){ stepLog(`3단계 N 블록품질 1차교정 ${quality1.moves}건 완료 · 남은 단독N ${quality1.singles}건`); }
  const personalBalance=stepBalanceGeneralNightPersonalCounts();
  if(personalBalance.moves){ stepLog(`3단계 개인별 N 균형 보정 ${personalBalance.moves}건 완료 · ${personalBalance.summary}`); }
  const quality2=stepImproveNightBlockQuality();
  if(quality2.moves){ stepLog(`3단계 N 블록품질 2차교정 ${quality2.moves}건 완료 · 남은 단독N ${quality2.singles}건`); }
  const pairFix2=stepRepairNightSeniorJuniorPairing();
  if(pairFix2.swaps){ stepLog(`3단계 N 시니어 조합 2차교정 ${pairFix2.swaps}건 완료`); }
  stepEnforceNightMaxStrict();
  const shortageGuard=stepMandatoryFillNightShortagesWithSafePair();
  if(shortageGuard.fixed){ stepLog(`3단계 N 부족 즉시보정 ${shortageGuard.fixed}건 완료`); }

  for(let stabilize=0; stabilize<8; stabilize++){
    const pairLoop=stepRepairNightSeniorJuniorPairing();
    const qualityLoop=stepImproveNightBlockQuality();
    const balLoop=stepBalanceGeneralNightPersonalCounts();
    stepEnforceNightMaxStrict();
    if(pairLoop.swaps){ stepLog(`3단계 N 시니어 조합 안정화 ${pairLoop.swaps}건 완료`); }
    if(qualityLoop.moves){ stepLog(`3단계 N 블록품질 안정화 ${qualityLoop.moves}건 완료 · 남은 단독N ${qualityLoop.singles}건`); }
    if(balLoop.moves){ stepLog(`3단계 N 개인별 균형 안정화 ${balLoop.moves}건 완료 · ${balLoop.summary}`); }
    if(!pairLoop.swaps && !qualityLoop.moves && !balLoop.moves) break;
  }

  const finalShortageGuard=stepMandatoryFillNightShortagesWithSafePair();
  if(finalShortageGuard.fixed){ stepLog(`3단계 N 부족 최종즉시보정 ${finalShortageGuard.fixed}건 완료`); }
  const finalQuality=stepImproveNightBlockQuality();
  if(finalQuality.moves){ stepLog(`3단계 N 블록품질 최종교정 ${finalQuality.moves}건 완료 · 남은 단독N ${finalQuality.singles}건`); }

  const removedUnsafe=stepRemoveUnsafeNightJuniorPairs();
  if(removedUnsafe.removed){ stepLog(`3단계 N 주니어끼리 배정 최종제거 ${removedUnsafe.removed}건`); }
  const unsafeDays=[];
  for(let d=1; d<=last; d++){
    if(stepNightDayHasUnsafePair(d)) unsafeDays.push(`${makeDateKey(y,m,d)} N 시니어지원자 없음`);
  }
  const finalMisses=stepNightShortages();
  const q=stepNightQueueState(nurses);
  const skippedNames=(q.skipped||[]).map(id=>(nurses.find(n=>n.id===id)?.name||id)).slice(0,6).join(', ');
  const queueNames=regularQueue.map(n=>n.name).join(' → ');
  const unresolved=[...finalMisses.map(x=>`${makeDateKey(y,m,x.d)} N ${x.got}/${x.need}`), ...unsafeDays];
  const remainingSingles=stepImproveNightBlockQuality().singles || 0;
  if(unresolved.length){
    st.done[3]=false;
    stepLog(`3단계 N 블록엔진 미해결: ${unresolved.slice(0,8).join(' / ')} · 단독N ${remainingSingles}건 · 큐 ${queueNames || '대상 없음'} · 기존 일반N ${cleared}칸 초기화 · 새 N ${placed}건${skippedNames?` · 다음 우선복구: ${skippedNames}`:''}`);
  }else{
    st.done[3]=true;
    stepLog(`3단계 N 블록엔진 완료: 2~3N 우선 · 단독N ${remainingSingles}건 · 큐 ${queueNames || '대상 없음'} · 기존 일반N ${cleared}칸 초기화 · 새 N ${placed}건, 즉시교정 ${correction.fixed||0}건${skippedNames?` · 다음 우선복구: ${skippedNames}`:''}`);
  }
  stepPushDraft(); renderWardSchedule();
}

function stepRunStaffingAdjustment(){
  if(!stepCanProceedAfterNight()) return;
  const ward=getCurrentWard(), st=stepEnsureState(); if(!ward||!st) return;
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const last=daysInMonth(st.y,st.m);
  let fixed=0, maxFilled=0, unresolved=[];
  const restPriority=(code)=>{ code=String(code||'').toUpperCase(); if(code==='OF'||code==='O'||!code) return 0; if(code==='WO') return 1; if(['HA','HP'].includes(code)) return 2; return 9; };
  function statOf(n){ return summarizeSchedule(st.schedule,nurses,st.y,st.m)[n.id]||{}; }
  function offCount(n){
    // summarizeSchedule은 totalOff만 제공하므로, 단계별 보정에서는 빈칸까지 실제 OFF 후보로 계산합니다.
    // 이전 버전은 stat.off/wanted 등을 읽어 항상 0에 가까워져 OFF 과다/부족 교환이 제대로 작동하지 않았습니다.
    let c=0;
    for(let dd=1; dd<=last; dd++){
      const code=String(st.schedule[makeDateKey(st.y,st.m,dd)]?.[n.id]||'').toUpperCase();
      if(stepIsRest(code)) c++;
    }
    return c;
  }
  function basicOffCount(n){
    let c=0;
    for(let dd=1; dd<=last; dd++){
      const code=String(st.schedule[makeDateKey(st.y,st.m,dd)]?.[n.id]||'').toUpperCase();
      if(isBasicOffCodeForBalance(code)) c++;
    }
    return c;
  }
  function shiftCount(n,shift){ const stat=statOf(n); if(shift==='D') return Number(stat.days||0); if(shift==='E') return Number(stat.evenings||0); if(shift==='N') return Number(stat.nights||0); return 0; }
  function targetOffFor(n){
    if(stepIsNightKeep(n)) return Math.max(0,last-nightKeepMonthlyTargetByDays(last));
    return getRegularMonthlyOffTarget(ward,st.y,st.m);
  }
  function isConvertibleRest(n,d,allowProtected=false){
    const code=String(st.schedule[makeDateKey(st.y,st.m,d)]?.[n.id]||'').toUpperCase();
    if(['AL','SL','HA','HP'].includes(code)) return false;
    if(code==='WO') return false; // 원티드 OFF는 날짜 지정이므로 최대인원 보정에서는 보호, 최소인원 미달 때만 마지막 후보로 사용
    if(stepLocked(st.y,st.m,d,n.id) && !allowProtected) return false;
    return stepIsRest(code);
  }
  function tryPlaceShift(d,shift,allowProtected){
    const key=makeDateKey(st.y,st.m,d);
    if(shift==='N'){
      const cands=nurses.filter(n=>stepIsCountedStaff(n) && stepAllowed(n,'N') && stepIsRest(st.schedule[key]?.[n.id]) && !['AL','SL','HA','HP'].includes(String(st.schedule[key]?.[n.id]||'').toUpperCase()))
        .filter(n=>allowProtected || !stepLocked(st.y,st.m,d,n.id))
        .sort((a,b)=> restPriority(st.schedule[key]?.[a.id])-restPriority(st.schedule[key]?.[b.id]) || shiftCount(a,'N')-shiftCount(b,'N') || offCount(b)-offCount(a));
      for(const n of cands){ if(stepPlaceNightBlock(n,d,'최소인원보정N',{preferLong:true,overrideWanted:true,overrideLock:allowProtected})){ fixed++; return true; } }
      return false;
    }
    const cands=nurses.filter(n=>stepIsCountedStaff(n) && stepAllowed(n,shift) && stepIsRest(st.schedule[key]?.[n.id]) && !['AL','SL','HA','HP'].includes(String(st.schedule[key]?.[n.id]||'').toUpperCase()))
      .filter(n=>allowProtected || !stepLocked(st.y,st.m,d,n.id))
      .sort((a,b)=> restPriority(st.schedule[key]?.[a.id])-restPriority(st.schedule[key]?.[b.id]) || shiftCount(a,shift)-shiftCount(b,shift) || offCount(b)-offCount(a));
    for(const n of cands){ if(stepAssign(n,shift,d,'최소인원보정',{replace:true,overrideWanted:true,overrideLock:allowProtected,overrideMinOff:true})){ fixed++; return true; } }
    return false;
  }
	  // 1) 대원칙: 날짜별 D/E/N 최소인원은 먼저 충족합니다.
	  for(let pass=0; pass<8; pass++){
	    let changed=false;
    for(let d=1; d<=last; d++){
      for(const shift of ['D','E','N']){
        const need=getStaffingMinForDate(ward,st.y,st.m,d,shift);
        while(stepCount(st.schedule,st.y,st.m,d,shift,nurses)<need){
          if(tryPlaceShift(d,shift,false) || tryPlaceShift(d,shift,true)){ changed=true; }
          else { unresolved.push(`${makeDateKey(st.y,st.m,d)} ${shift} 후보 부족 (${stepCount(st.schedule,st.y,st.m,d,shift,nurses)}/${need})`); break; }
        }
      }
    }
	    if(!changed) break;
	  }
	  function repairMinimumByWorkConversion(){
	    let moves=0;
	    function keyOf(d){ return makeDateKey(st.y,st.m,d); }
	    function codeAt(n,d){ return String(st.schedule[keyOf(d)]?.[n.id]||'').toUpperCase(); }
	    function dayMinOk(d){
	      for(const sh of ['D','E','N']){
	        if(stepCount(st.schedule,st.y,st.m,d,sh,nurses)<getStaffingMinForDate(ward,st.y,st.m,d,sh)) return false;
	      }
	      return true;
	    }
	    function surplusOf(d,sh){
	      return stepCount(st.schedule,st.y,st.m,d,sh,nurses)-getStaffingMinForDate(ward,st.y,st.m,d,sh);
	    }
	    for(let iter=0; iter<80; iter++){
	      let changed=false;
	      for(let d=1; d<=last && !changed; d++){
	        for(const needShift of ['D','E','N']){
	          if(stepCount(st.schedule,st.y,st.m,d,needShift,nurses)>=getStaffingMinForDate(ward,st.y,st.m,d,needShift)) continue;
	          const currentKey=keyOf(d);
	          const cands=nurses
	            .filter(n=>stepIsCountedStaff(n) && stepAllowed(n,needShift))
	            .filter(n=>['D','E','N','MD','SD6'].includes(codeAt(n,d)) && codeAt(n,d)!==needShift)
	            .filter(n=>!stepLocked(st.y,st.m,d,n.id) || !stepIsRecoveryOffLock(st.y,st.m,d,n.id))
	            .filter(n=>stepCanPlace(n,needShift,d,{replace:true,overrideWanted:true,overrideLock:false,overrideStaffingMax:true,overrideMinOff:true}))
	            .sort((a,b)=>{
	              const ac=codeAt(a,d), bc=codeAt(b,d);
	              return surplusOf(d,bc)-surplusOf(d,ac) || (ac==='N'?1:0)-(bc==='N'?1:0) || shiftCount(a,needShift)-shiftCount(b,needShift);
	            });
	          for(const n of cands){
	            const snap=Object.assign({}, st.schedule[currentKey]||{});
	            const old=codeAt(n,d);
	            st.schedule[currentKey][n.id]=needShift;
	            if(dayMinOk(d)){
	              moves++; fixed++; changed=true;
	              stepLog(`7단계 최소인원 우선 근무전환 ${makeDateKey(st.y,st.m,d)} ${n.name} ${old}→${needShift}`);
	              break;
	            }
	            st.schedule[currentKey]=snap;
	          }
	          if(changed) break;
	        }
	      }
	      if(!changed) break;
	    }
	    return moves;
	  }
	  const convertedMinimum=repairMinimumByWorkConversion();
	  const pairedMinimum=stepRepairMinimumByPairedSwap(st.schedule,ward,st.y,st.m);
	  // 2) 추가 보정: 근무 최소인원을 맞춘 뒤에도 월 기준OFF보다 OFF가 많은 직원은,
  // 날짜별 최대인원 범위 안에서 D/E/N 근무로 전환합니다. 강제 연차처럼 보이는 과다 OFF를 줄이기 위한 단계입니다.
  // 단, 허용근무코드/AL·SL·반차/WO 보호/E→D/N→D,E 차단은 유지합니다.
  for(let pass=0; pass<5; pass++){
    let changed=false;
    for(let d=1; d<=last; d++){
      for(const shift of ['D','E','N']){
        const configuredMax=getStaffingMaxForDate(ward,st.y,st.m,d,shift);
        const minForShift=getStaffingMinForDate(ward,st.y,st.m,d,shift);
        const max=configuredMax===Infinity ? minForShift : configuredMax;
        while(stepCount(st.schedule,st.y,st.m,d,shift,nurses)<max){
          const key=makeDateKey(st.y,st.m,d);
          const cands=nurses.filter(n=>stepIsCountedStaff(n) && isConvertibleRest(n,d,false) && stepAllowed(n,shift) && basicOffCount(n)>targetOffFor(n))
            .sort((a,b)=> (basicOffCount(b)-targetOffFor(b))-(basicOffCount(a)-targetOffFor(a)) || shiftCount(a,shift)-shiftCount(b,shift));
          let ok=false;
          for(const n of cands){
            if(shift==='N'){
              {
                const fairLimit = stepIsNightKeep(n) ? nightKeepMonthlyTargetByDays(last) : stepNightFairLimit(n,nurses);
                if(shiftCount(n,'N') < fairLimit && stepPlaceNightBlock(n,d,'과다OFF근무전환N',{forceLen:Math.min(stepNightBlockRange(n).max||2, Math.max(stepNightBlockRange(n).min||2, fairLimit-shiftCount(n,'N'))), remainingTarget:Math.max(1, fairLimit-shiftCount(n,'N'))})){ maxFilled++; changed=true; ok=true; break; }
              }
            }else if(stepAssign(n,shift,d,'과다OFF근무전환',{replace:true,overrideWanted:false,overrideLock:false,overrideStaffingMax:false})){
              maxFilled++; changed=true; ok=true; break;
            }
          }
          if(!ok) break;
        }
      }
    }
    if(!changed) break;
  }
  const orderedExcessFill=stepFillExcessBasicOffToWork(st.schedule,ward,st.y,st.m);
	  st.done[7]=true;
	  unresolved=[];
	  for(let d=1; d<=last; d++){
	    ['D','E','N'].forEach(shift=>{
	      const need=getStaffingMinForDate(ward,st.y,st.m,d,shift);
	      const got=stepCount(st.schedule,st.y,st.m,d,shift,nurses);
	      if(got<need) unresolved.push(`${makeDateKey(st.y,st.m,d)} ${shift} 후보 부족 (${got}/${need})`);
	    });
	  }
	  const baseMsg=`7단계 최소인원 보정 ${fixed}건, 근무전환 ${convertedMinimum}건, 2인교환 ${pairedMinimum.moves||0}건, 과다 OFF 근무전환 ${maxFilled}건, 월 기준OFF D/E/N 전환 ${orderedExcessFill.moves||0}건`;
  if(unresolved.length) stepLog(`${baseMsg}, 미해결 ${Array.from(new Set(unresolved)).slice(0,5).join(' / ')}`);
  else stepLog(`${baseMsg} 완료`);
  stepPushDraft(); renderWardSchedule();
}
function stepRunOfficeDay(){

  const ward=getCurrentWard(), st=stepEnsureState(); if(!ward||!st) return; const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive'); let placed=0;
  for(let d=1; d<=daysInMonth(st.y,st.m); d++){ const dtype=getDateType(st.y,st.m,d); nurses.filter(n=>stepIsCountedStaff(n)&&stepIsOfficeOrDayKeep(n)).forEach(n=>{ if(dtype==='weekday' && stepAssign(n,'D',d,'상근/D킵')) placed++; else if(!st.schedule[makeDateKey(st.y,st.m,d)][n.id]) st.schedule[makeDateKey(st.y,st.m,d)][n.id]='OF'; }); }
  st.done[4]=true; stepLog(`4단계 상근/데이킵 D ${placed}건 배치`); stepPushDraft(); renderWardSchedule();
}
