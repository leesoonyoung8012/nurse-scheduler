  st.done[5]=true; stepLog(`5단계 D 최소인원 ${placed}건 보충`); stepPushDraft(); renderWardSchedule();
}
function stepRunEvening(){
  if(!stepCanProceedAfterNight()) return;
  const ward=getCurrentWard(), st=stepEnsureState(); if(!ward||!st) return; const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive'); let placed=0;
  for(let d=1; d<=daysInMonth(st.y,st.m); d++){ while(stepCount(st.schedule,st.y,st.m,d,'E',nurses)<getStaffingMinForDate(ward,st.y,st.m,d,'E')){ const cands=nurses.filter(n=>stepIsCountedStaff(n)&&stepAllowed(n,'E')&&stepIsRest(st.schedule[makeDateKey(st.y,st.m,d)]?.[n.id])&&!stepLocked(st.y,st.m,d,n.id)).sort((a,b)=>{const sa=summarizeSchedule(st.schedule,nurses,st.y,st.m); return (sa[a.id]?.evenings||0)-(sa[b.id]?.evenings||0);}); let ok=false; for(const n of cands){ if(stepAssign(n,'E',d,'E최소',{replace:true,overrideWanted:true})){ placed++; ok=true; break; } } if(!ok) break; } }
  st.done[6]=true; stepLog(`6단계 E 최소인원 ${placed}건 보충`); stepPushDraft(); renderWardSchedule();
}

function stepPostFinalizeBalanceAndNewNight(){
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return {swaps:0,newNight:0,newBalanced:0,offFixed:0};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const y=st.y, m=st.m, last=daysInMonth(y,m);
  const movable=['D','E','N'];
  const fixedRest=['WO','AL','SL','HA','HP'];
  const baseTargetOff=getRegularMonthlyOffTarget(ward,y,m);

  function key(d){ return makeDateKey(y,m,d); }
  function codeAt(n,d){ return String(st.schedule[key(d)]?.[n.id]||'').toUpperCase(); }
  function setCode(n,d,code){ if(!st.schedule[key(d)]) st.schedule[key(d)]={}; st.schedule[key(d)][n.id]=code; }
  function isFixedRest(c){ return fixedRest.includes(String(c||'').toUpperCase()); }
  function offCount(n){ let c=0; for(let d=1; d<=last; d++){ if(stepIsRest(codeAt(n,d))) c++; } return c; }
  function shiftCount(n,shift){ let c=0; for(let d=1; d<=last; d++){ if(codeAt(n,d)===shift) c++; } return c; }
  function fixedRestCount(n){ let c=0; for(let d=1; d<=last; d++){ if(isFixedRest(codeAt(n,d))) c++; } return c; }
  function targetOff(n){ return stepIsNightKeep(n) ? Math.max(0,last-nightKeepMonthlyTargetByDays(last)) : baseTargetOff; }
  function targetNight(n){
    if(!stepAllowed(n,'N')) return 0;
    if(stepIsNightKeep(n)) return nightKeepMonthlyTargetByDays(last);
    const maxN=getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6);
    if(!stepIsCountedStaff(n)) return Math.min(3, Math.max(0,maxN));
    return Math.max(0,maxN);
  }
  function traineeTargets(n){
    const offT=targetOff(n);
    const workT=Math.max(0,last-offT);
    const nT=Math.min(targetNight(n), workT);
    const remain=Math.max(0,workT-nT);
    const eT=stepAllowed(n,'E') ? Math.floor(remain/2) : 0;
    const dT=stepAllowed(n,'D') ? Math.max(0,remain-eT) : 0;
    return {off:offT,N:nT,E:eT,D:dT};
  }
  function restCanGive(n,d,allowLocked=false){
    const c=codeAt(n,d);
    if(!stepIsRest(c)) return false;
    if(isFixedRest(c)) return false;
    if(stepIsRecoveryOffLock(y,m,d,n.id)) return false;
    if(stepLocked(y,m,d,n.id) && !allowLocked) return false;
    return true;
  }
  function workCanGive(n,d){ return movable.includes(codeAt(n,d)); }
  function transitionOk(n,shift,d){
    const prev=d>1?codeAt(n,d-1):String(getPreviousMonthLastCode(ward,n.id,y,m)||'').toUpperCase();
    const next=d<last?codeAt(n,d+1):'';
    if(prev==='E' && shift==='D') return false;
    if(prev==='N' && (shift==='D'||shift==='E')) return false;
    if(shift==='E' && next==='D') return false;
    if(shift==='N' && (next==='D'||next==='E')) return false;
    return true;
  }
  function canTake(n,shift,d,allowNightGap=true){
    const cur=codeAt(n,d), dtype=getDateType(y,m,d);
    if(isFixedRest(cur)) return false;
    if(stepIsRecoveryOffLock(y,m,d,n.id) && stepIsRest(cur)) return false;
    if(!stepAllowed(n,shift)) return false;
    if(stepIsRestricted(n,dtype)) return false;
    if(!isPersonalShiftAllowedForDateType(n,shift,dtype)) return false;
    if(!transitionOk(n,shift,d)) return false;
    if(shift==='N'){
      if(stepViolatesPreviousMonthNightReentryGap(n,d)) return false;
      if(stepViolatesNightRecoveryOffGap(n,d)) return false;
      if(stepViolatesNightReentryGap(n,d) && !allowNightGap) return false;
      const maxN=targetNight(n);
      if(maxN<=0) return false;
      if(cur!=='N' && shiftCount(n,'N')>=maxN && stepIsCountedStaff(n)) return false;
    }
    return true;
  }
  function staffingOk(d){
    for(const shift of movable){
      const cnt=stepCount(st.schedule,y,m,d,shift,nurses);
      if(cnt<getStaffingMinForDate(ward,y,m,d,shift)) return false;
      const max=getStaffingMaxForDate(ward,y,m,d,shift);
      if(max!==Infinity && cnt>max) return false;
      const hasNew=nurses.some(n=>!stepIsCountedStaff(n)&&codeAt(n,d)===shift);
      if(hasNew && cnt<=0) return false;
    }
    return true;
  }
  function snapDay(d){ return Object.assign({}, st.schedule[key(d)]||{}); }
  function restoreDay(d,snap){ st.schedule[key(d)]=Object.assign({}, snap||{}); }
  function commit(d, changes){
    const snap=snapDay(d);
    for(const [n,code] of changes){ setCode(n,d,code); }
    if(!staffingOk(d)){ restoreDay(d,snap); return false; }
    return true;
  }

  let swaps=0, offFixed=0, newNight=0, newBalanced=0;

  function rebalanceTrainees(){
    let changedTotal=0;
    const trainees=nurses.filter(n=>!stepIsCountedStaff(n));
    for(const n of trainees){
      const t=traineeTargets(n);
      // 1) 신규는 월 기준OFF를 먼저 맞춥니다. 과다 근무는 D/E 초과분부터 OFF로 전환합니다.
      for(let pass=0; pass<last; pass++){
        if(offCount(n)>=t.off) break;
        const days=[...Array(last)].map((_,i)=>i+1).sort((a,b)=>{
          const ca=codeAt(n,a), cb=codeAt(n,b);
          const overA=(ca==='D'?shiftCount(n,'D')-t.D:ca==='E'?shiftCount(n,'E')-t.E:ca==='N'?shiftCount(n,'N')-t.N:0);
          const overB=(cb==='D'?shiftCount(n,'D')-t.D:cb==='E'?shiftCount(n,'E')-t.E:cb==='N'?shiftCount(n,'N')-t.N:0);
          return overB-overA || b-a;
        });
        let ok=false;
        for(const d of days){
          const c=codeAt(n,d);
          if(!movable.includes(c)) continue;
          if(commit(d,[[n,'OF']])){ changedTotal++; ok=true; break; }
        }
        if(!ok) break;
      }
      // 2) 신규 N은 설정값이 있으면 최소 3개까지, 숙련자 N이 있는 날짜에 동반 배치합니다.
      while(shiftCount(n,'N')<t.N){
        let placed=false;
        const days=[...Array(last)].map((_,i)=>i+1).sort((a,b)=>{
          const ea=stepCount(st.schedule,y,m,a,'N',nurses), eb=stepCount(st.schedule,y,m,b,'N',nurses);
          return eb-ea || shiftCount(n,'N') || a-b;
        });
        for(const d of days){
          if(!restCanGive(n,d,true) && !['D','E'].includes(codeAt(n,d))) continue;
          if(stepCount(st.schedule,y,m,d,'N',nurses)<=0) continue;
          if(!canTake(n,'N',d,true)) continue;
          if(commit(d,[[n,'N']])){ newNight++; changedTotal++; placed=true; break; }
        }
        if(!placed) break;
      }
      // 3) 신규 E/D도 훈련 로테이션으로 균등하게 맞춥니다. 단독 근무는 금지합니다.
      for(const shift of ['E','D']){
        while(shiftCount(n,shift)<t[shift] && offCount(n)>t.off){
          let placed=false;
          const days=[...Array(last)].map((_,i)=>i+1).sort((a,b)=>a-b);
          for(const d of days){
            if(!restCanGive(n,d,true)) continue;
            if(stepCount(st.schedule,y,m,d,shift,nurses)<=0) continue;
            if(!canTake(n,shift,d,true)) continue;
            if(commit(d,[[n,shift]])){ changedTotal++; placed=true; break; }
          }
          if(!placed) break;
        }
      }
      // 4) D가 과하고 E가 부족한 신규는 같은 날 코드를 바꿔 균형을 잡습니다.
      while(stepAllowed(n,'E') && shiftCount(n,'E')<t.E && shiftCount(n,'D')>t.D){
        let changed=false;
        for(let d=1; d<=last; d++){
          if(codeAt(n,d)!=='D') continue;
          if(stepCount(st.schedule,y,m,d,'E',nurses)<=0) continue;
          if(canTake(n,'E',d,true) && commit(d,[[n,'E']])){ changedTotal++; changed=true; break; }
        }
        if(!changed) break;
      }
      // 5) 그래도 신규 OFF가 목표보다 적으면 추가로 근무를 OFF 처리합니다.
      for(let pass=0; pass<last; pass++){
        if(offCount(n)>=t.off) break;
        let ok=false;
        for(let d=last; d>=1; d--){
          if(movable.includes(codeAt(n,d)) && commit(d,[[n,'OF']])){ changedTotal++; ok=true; break; }
        }
        if(!ok) break;
      }
    }
    return changedTotal;
  }

  function rebalanceRegularOff(){
    let changedTotal=0;
    for(let iter=0; iter<2500; iter++){
      const over=nurses.filter(n=>stepIsCountedStaff(n)&&offCount(n)>targetOff(n)).sort((a,b)=>(offCount(b)-targetOff(b))-(offCount(a)-targetOff(a)));
      const under=nurses.filter(n=>stepIsCountedStaff(n)&&offCount(n)<targetOff(n)).sort((a,b)=>(targetOff(a)-offCount(a))-(targetOff(b)-offCount(b)));
      if(!over.length || !under.length) break;
      let changed=false;
      for(const o of over){
        for(const u of under){
          if(o.id===u.id) continue;
          for(let d=1; d<=last && !changed; d++){
            const uShift=codeAt(u,d);
            if(!movable.includes(uShift) || !restCanGive(o,d,true)) continue;
            // 직접: OFF 과다자가 부족자의 근무를 받고, 부족자는 OFF 확보
            if(canTake(o,uShift,d,true) && commit(d,[[u,'OF'],[o,uShift]])){ swaps++; changedTotal++; changed=true; break; }
            const relays=nurses.filter(r=>r.id!==o.id&&r.id!==u.id&&stepIsCountedStaff(r)&&workCanGive(r,d))
              .sort((a,b)=>offCount(a)-offCount(b) || String(a.name||'').localeCompare(String(b.name||''),'ko'));
            // 2단계: o <- rShift, r <- uShift, u <- OFF
            for(const r of relays){
              const rShift=codeAt(r,d);
              if(rShift===uShift) continue;
              if(canTake(o,rShift,d,true) && canTake(r,uShift,d,true) && commit(d,[[u,'OF'],[r,uShift],[o,rShift]])){ swaps++; changedTotal++; changed=true; break; }
            }
            if(changed) break;
            // 3단계: o <- r1, r1 <- r2, r2 <- u, u <- OFF
            for(const r1 of relays){
              const r1Shift=codeAt(r1,d);
              for(const r2 of relays){
                if(r1.id===r2.id) continue;
                const r2Shift=codeAt(r2,d);
                if(canTake(o,r1Shift,d,true) && canTake(r1,r2Shift,d,true) && canTake(r2,uShift,d,true) && commit(d,[[u,'OF'],[r2,uShift],[r1,r2Shift],[o,r1Shift]])){ swaps++; changedTotal++; changed=true; break; }
              }
              if(changed) break;
            }
          }
          if(changed) break;
        }
        if(changed) break;
      }
      if(!changed) break;
    }
    return changedTotal;
  }

  // 구조화된 최종 엔진: 신규 훈련 목표 → 숙련자 OFF 균형 → 신규 재균형 → 숙련자 OFF 재균형 순서로 반복합니다.
  for(let pass=0; pass<6; pass++){
    const a=rebalanceTrainees();
    const b=rebalanceRegularOff();
    const c=rebalanceTrainees();
    newBalanced += a+c;
    offFixed += b;
    if(a+b+c===0) break;
  }
  return {swaps,newNight,newBalanced,offFixed};
}


function stepFinalStructuredRepair(){
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return {offFixed:0,newFixed:0,nightQueueFixed:0};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const y=st.y,m=st.m,last=daysInMonth(y,m);
  const target=getRegularMonthlyOffTarget(ward,y,m);
  const movable=['D','E','N'];
  function key(d){return makeDateKey(y,m,d)}
  function code(n,d){return String(st.schedule[key(d)]?.[n.id]||'').toUpperCase()}
  function set(n,d,c){if(!st.schedule[key(d)]) st.schedule[key(d)]={}; st.schedule[key(d)][n.id]=c}
  function offCnt(n){let c=0; for(let d=1; d<=last; d++){ if(stepIsRest(code(n,d))) c++; } return c;}
  function shCnt(n,sh){let c=0; for(let d=1; d<=last; d++){ if(code(n,d)===sh)c++; } return c;}
  function fixedRest(c){return ['WO','AL','SL','HA','HP'].includes(String(c||'').toUpperCase())}
  function canGiveRest(n,d){const c=code(n,d); return stepIsRest(c)&&!fixedRest(c)&&!stepIsRecoveryOffLock(y,m,d,n.id);}
  function canTakeShift(n,sh,d){
    const c=code(n,d); if(fixedRest(c)) return false;
    if(stepIsRecoveryOffLock(y,m,d,n.id) && stepIsRest(c)) return false;
    if(!stepAllowed(n,sh)) return false;
    if(stepIsRestricted(n,getDateType(y,m,d))) return false;
    if(!isPersonalShiftAllowedForDateType(n,sh,getDateType(y,m,d))) return false;
    if(sh==='N' && stepViolatesPreviousMonthNightReentryGap(n,d)) return false;
    if(sh==='N' && stepViolatesNightRecoveryOffGap(n,d)) return false;
    const prev=d>1?code(n,d-1):String(getPreviousMonthLastCode(ward,n.id,y,m)||'').toUpperCase();
    const next=d<last?code(n,d+1):'';
    if(prev==='E'&&sh==='D') return false;
    if(prev==='N'&&(sh==='D'||sh==='E')) return false;
    if(sh==='E'&&next==='D') return false;
    if(sh==='N'&&(next==='D'||next==='E')) return false;
    return true;
  }
  function staffingOk(d){
    for(const sh of movable){
      const got=stepCount(st.schedule,y,m,d,sh,nurses);
      if(got<getStaffingMinForDate(ward,y,m,d,sh)) return false;
      const mx=getStaffingMaxForDate(ward,y,m,d,sh);
      if(mx!==Infinity && got>mx) return false;
      if(nurses.some(n=>!stepIsCountedStaff(n)&&code(n,d)===sh) && got<=0) return false;
    }
    return true;
  }
  function snap(d){return Object.assign({},st.schedule[key(d)]||{})}
  function restore(d,x){st.schedule[key(d)]=Object.assign({},x||{})}
  function commit(d,changes){const s=snap(d); changes.forEach(([n,c])=>set(n,d,c)); if(!staffingOk(d)){restore(d,s); return false;} return true;}
  let offFixed=0,newFixed=0,nightQueueFixed=0;

  // 1) 신규는 최소인원 외 훈련 배치: OFF 목표는 월 기준OFF, D/E/N은 가능한 범위에서 균형.
  for(const n of nurses.filter(n=>!stepIsCountedStaff(n))){
    const maxN=stepAllowed(n,'N')?Math.min(3,Math.max(0,getNurseNumberSetting(n,'maxNightPerMonth',3))):0;
    const workTarget=Math.max(0,last-target);
    const eTarget=stepAllowed(n,'E')?Math.floor((workTarget-maxN)/2):0;
    const dTarget=stepAllowed(n,'D')?Math.max(0,workTarget-maxN-eTarget):0;
    const goals=[['N',maxN],['E',eTarget],['D',dTarget]];
    for(const [sh,goal] of goals){
      let guard=0;
      while(shCnt(n,sh)<goal && offCnt(n)>target && guard++<last){
        let placed=false;
        for(let d=1; d<=last; d++){
          if(!canGiveRest(n,d) && !['D','E'].includes(code(n,d))) continue;
          if(['D','E','N'].includes(sh) && stepCount(st.schedule,y,m,d,sh,nurses)<=0) continue;
          if(canTakeShift(n,sh,d) && commit(d,[[n,sh]])){newFixed++; placed=true; break;}
        }
        if(!placed) break;
      }
    }
    // 신규 OFF 부족은 과한 근무부터 OFF로 되돌림
    let guard=0;
    while(offCnt(n)<target && guard++<last){
      let ok=false;
      for(let d=last; d>=1; d--){ if(movable.includes(code(n,d)) && commit(d,[[n,'OF']])){newFixed++; ok=true; break;} }
      if(!ok) break;
    }
  }

  // 2) 숙련자 OFF 부족/과다 직접 및 2단계 교환. N 회복 OFF 잠금은 transitionOk로 보호하므로 교환 후보로 허용.
  for(let iter=0; iter<3000; iter++){
    const over=nurses.filter(n=>stepIsCountedStaff(n)&&!stepIsNightKeep(n)&&offCnt(n)>target).sort((a,b)=>offCnt(b)-offCnt(a));
    const under=nurses.filter(n=>stepIsCountedStaff(n)&&!stepIsNightKeep(n)&&offCnt(n)<target).sort((a,b)=>offCnt(a)-offCnt(b));
    if(!over.length||!under.length) break;
    let changed=false;
    for(const o of over){ for(const u of under){ for(let d=1; d<=last && !changed; d++){
      const us=code(u,d); if(!movable.includes(us)||!canGiveRest(o,d)) continue;
      if(canTakeShift(o,us,d) && commit(d,[[u,'OF'],[o,us]])){offFixed++; changed=true; break;}
      const relays=nurses.filter(r=>r.id!==o.id&&r.id!==u.id&&stepIsCountedStaff(r)&&movable.includes(code(r,d))).sort((a,b)=>offCnt(a)-offCnt(b));
      for(const r of relays){const rs=code(r,d); if(canTakeShift(o,rs,d)&&canTakeShift(r,us,d)&&commit(d,[[u,'OF'],[r,us],[o,rs]])){offFixed++; changed=true; break;}}
    } if(changed) break;} if(changed) break;}
    if(!changed) break;
  }

  return {offFixed,newFixed,nightQueueFixed};
}

function stepReduceWorkForOffShortageAtEnd(){
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return {moves:0, remaining:[]};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive'&&!isUnifiedNewNurse(n));
  const y=st.y, m=st.m, last=daysInMonth(y,m);
  function key(d){ return makeDateKey(y,m,d); }
  function code(n,d){ return String(st.schedule[key(d)]?.[n.id]||'').toUpperCase(); }
  function offCnt(n){ return scheduleOffCountForNurse(st.schedule,n,y,m); }
  function target(n){ return getMonthlyTargetOffForNurse(ward,n,y,m); }
  function canReduce(n,d,shift){
    if(!['D','E'].includes(shift)) return false;
    if(stepLocked(y,m,d,n.id) && ['WO','AL','SL','HA','HP'].includes(stepLockReason(y,m,d,n.id))) return false;
    return stepCount(st.schedule,y,m,d,shift,nurses)>getStaffingMinForDate(ward,y,m,d,shift);
  }
  let moves=0;
  for(let pass=0; pass<20; pass++){
    const shortage=nurses
      .filter(n=>offCnt(n)<target(n))
      .sort((a,b)=>(offCnt(a)-target(a))-(offCnt(b)-target(b)) || String(a.name||'').localeCompare(String(b.name||''),'ko'));
    if(!shortage.length) break;
    let changed=false;
    for(const n of shortage){
      for(let d=last; d>=1; d--){
        const c=code(n,d);
        if(!canReduce(n,d,c)) continue;
        st.schedule[key(d)][n.id]='OF';
        stepUnlock(y,m,d,n.id);
        moves++; changed=true;
        stepLog(`8단계 OFF 부족 최종감산 ${n.name} ${makeDateKey(y,m,d)} ${c}→OF`);
        break;
      }
      if(changed) break;
    }
    if(!changed) break;
  }
  const remaining=nurses.filter(n=>offCnt(n)<target(n)).map(n=>`${n.name} 월 기준OFF ${offCnt(n)}/${target(n)}`);
  return {moves, remaining};
}

function stepRepairNightReentryGapBySameDaySwap(){
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return {moves:0, remaining:[]};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const counted=nurses.filter(stepIsCountedStaff);
  const y=st.y, m=st.m, last=daysInMonth(y,m);
  function key(d){ return makeDateKey(y,m,d); }
  function code(n,d){ return String(st.schedule[key(d)]?.[n.id]||'').toUpperCase(); }
  function set(n,d,c){ if(!st.schedule[key(d)]) st.schedule[key(d)]={}; st.schedule[key(d)][n.id]=c; }
  function nCount(n){ return scheduleShiftCountForNurse(st.schedule,n,y,m,'N'); }
  function maxN(n){ return stepIsNightKeep(n) ? nightKeepMonthlyTargetByDays(last) : getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6); }
  function fixedRest(c){ return ['AL','SL','WO','HA','HP'].includes(String(c||'').toUpperCase()); }
  function daySafe(d){
    const got=stepCount(st.schedule,y,m,d,'N',nurses);
    if(got<getStaffingMinForDate(ward,y,m,d,'N')) return false;
    const max=getStaffingMaxForDate(ward,y,m,d,'N');
    if(max!==Infinity && got>max) return false;
    return !stepNightDayHasUnsafePair(d);
  }
  function violatingNightDays(n){
    const days=[];
    for(let d=1; d<=last; d++){
      if(code(n,d)==='N' && stepViolatesNightReentryGap(n,d)) days.push(d);
    }
    return days;
  }
  function canReceive(receiver, donor, d){
    if(receiver.id===donor.id) return false;
    if(!stepIsCountedStaff(receiver) || stepIsNightKeep(receiver)) return false;
    if(!stepAllowed(receiver,'N')) return false;
    if(nCount(receiver)>=maxN(receiver)) return false;
    const cur=code(receiver,d);
    if(fixedRest(cur) || ['D','E','MD','SD6','N'].includes(cur)) return false;
    if(stepViolatesPreviousMonthNightReentryGap(receiver,d)) return false;
    if(stepViolatesNightRecoveryOffGap(receiver,d)) return false;
    if(stepViolatesNightReentryGap(receiver,d)) return false;
    const k=key(d);
    const donorOld=st.schedule[k]?.[donor.id]||'';
    const recvOld=st.schedule[k]?.[receiver.id]||'';
    const donorLock=stepLockReason(y,m,d,donor.id);
    const recvLock=stepLockReason(y,m,d,receiver.id);
    set(donor,d,'OF');
    stepUnlock(y,m,d,donor.id);
    set(receiver,d,'N');
    const ok=stepCanPlace(receiver,'N',d,{replace:true,overrideLock:true,overrideNightGap:false,overrideNextWanted:true}) && daySafe(d);
    set(donor,d,donorOld);
    set(receiver,d,recvOld);
    if(donorLock) stepLock(y,m,d,donor.id,donorLock); else stepUnlock(y,m,d,donor.id);
    if(recvLock) stepLock(y,m,d,receiver.id,recvLock); else stepUnlock(y,m,d,receiver.id);
    return ok;
  }
  let moves=0;
  for(let pass=0; pass<30; pass++){
    let changed=false;
    const offenders=counted
      .flatMap(n=>violatingNightDays(n).map(d=>({n,d})))
      .sort((a,b)=>a.d-b.d || nCount(b.n)-nCount(a.n));
    if(!offenders.length) break;
    for(const row of offenders){
      const cands=counted
        .filter(n=>canReceive(n,row.n,row.d))
        .sort((a,b)=>nCount(a)-nCount(b) || String(a.name||'').localeCompare(String(b.name||''),'ko'));
      if(!cands.length) continue;
      const recv=cands[0], d=row.d;
      set(row.n,d,'OF');
      stepUnlock(y,m,d,row.n.id);
      set(recv,d,'N');
      stepLock(y,m,d,recv.id,'3단계 N 재진입 텀 교환보정');
      moves++; changed=true;
      stepLog(`3단계 N 재진입 텀 교환보정 ${makeDateKey(y,m,d)} ${row.n.name}→${recv.name}`);
      break;
    }
    if(!changed) break;
  }
  const remaining=counted.flatMap(n=>violatingNightDays(n).map(d=>`${makeDateKey(y,m,d)} ${n.name} N 재진입 텀 부족`));
  return {moves, remaining:[...new Set(remaining)]};
}

function stepPairSeparatedSingleNightBlocks(){
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return {moves:0};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive'&&stepIsCountedStaff(n));
  const y=st.y, m=st.m, last=daysInMonth(y,m);
  function key(d){ return makeDateKey(y,m,d); }
  function code(n,d){ return String(st.schedule[key(d)]?.[n.id]||'').toUpperCase(); }
  function isN(n,d){ return code(n,d)==='N'; }
  function isSingle(n,d){ return isN(n,d) && !(d>1&&isN(n,d-1)) && !(d<last&&isN(n,d+1)); }
  function canOwn(n,d){
    const old=st.schedule[key(d)]?.[n.id]||'';
    const lock=stepLockReason(y,m,d,n.id);
    st.schedule[key(d)][n.id]='';
    const ok=stepCanPlace(n,'N',d,{replace:true,overrideLock:true,overrideNightGap:true,overrideNextWanted:true,overrideRecoveryOff:true,overrideStaffingMax:true,overrideMaxNight:true});
    st.schedule[key(d)][n.id]=old;
    if(lock) stepLock(y,m,d,n.id,lock); else stepUnlock(y,m,d,n.id);
    return ok;
  }
  function daySafe(d){
    const got=stepCount(st.schedule,y,m,d,'N',(ward.nurses||[]));
    if(got<getStaffingMinForDate(ward,y,m,d,'N')) return false;
    const max=getStaffingMaxForDate(ward,y,m,d,'N');
    if(max!==Infinity && got>max) return false;
    return !stepNightDayHasUnsafePair(d);
  }
  let moves=0;
  for(let pass=0; pass<20; pass++){
    let changed=false;
    for(let d=1; d<=last-2 && !changed; d++){
      const outer=nurses.filter(n=>isSingle(n,d)&&isSingle(n,d+2));
      if(!outer.length) continue;
      const middle=nurses.filter(n=>isSingle(n,d+1));
      for(const a of outer){
        for(const b of middle){
          if(a.id===b.id) continue;
          if(!canOwn(a,d+1) || !canOwn(b,d)) continue;
          const k1=key(d), k2=key(d+1);
          const a1=st.schedule[k1]?.[a.id]||'', b1=st.schedule[k1]?.[b.id]||'';
          const a2=st.schedule[k2]?.[a.id]||'', b2=st.schedule[k2]?.[b.id]||'';
          const la1=stepLockReason(y,m,d,a.id), lb1=stepLockReason(y,m,d,b.id);
          const la2=stepLockReason(y,m,d+1,a.id), lb2=stepLockReason(y,m,d+1,b.id);
          st.schedule[k1][a.id]='OF';
          st.schedule[k1][b.id]='N';
          st.schedule[k2][b.id]='OF';
          st.schedule[k2][a.id]='N';
          if(daySafe(d) && daySafe(d+1)){
            stepUnlock(y,m,d,a.id); stepLock(y,m,d,b.id,'3단계 1N 블록쌍 교환');
            stepUnlock(y,m,d+1,b.id); stepLock(y,m,d+1,a.id,'3단계 1N 블록쌍 교환');
            moves++; changed=true;
            stepLog(`3단계 1N 블록쌍 교환 ${makeDateKey(y,m,d)}-${makeDateKey(y,m,d+2)} ${a.name}/${b.name}`);
            break;
          }
          st.schedule[k1][a.id]=a1; st.schedule[k1][b.id]=b1;
          st.schedule[k2][a.id]=a2; st.schedule[k2][b.id]=b2;
          [[d,a.id,la1],[d,b.id,lb1],[d+1,a.id,la2],[d+1,b.id,lb2]].forEach(([dd,id,reason])=>{
            if(reason) stepLock(y,m,dd,id,reason); else stepUnlock(y,m,dd,id);
          });
        }
        if(changed) break;
      }
    }
    if(!changed) break;
  }
  return {moves};
}

function stepFillDayEveningMinimumAtEnd(){
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return {placed:0, unresolved:[]};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const y=st.y, m=st.m, last=daysInMonth(y,m);
  let placed=0;
  for(const shift of ['D','E']){
    for(let d=1; d<=last; d++){
      let guard=0;
      while(stepCount(st.schedule,y,m,d,shift,nurses)<getStaffingMinForDate(ward,y,m,d,shift) && guard++<nurses.length+5){
        const opposite=shift==='E'?'D':'E';
        const cands=nurses
          .filter(n=>{
            if(!stepIsCountedStaff(n)||!stepAllowed(n,shift)) return false;
            const cur=String(st.schedule[makeDateKey(y,m,d)]?.[n.id]||'').toUpperCase();
            if(['AL','SL','WO','HA','HP','N'].includes(cur)) return false;
            if(stepIsRest(cur)) return true;
            return cur===opposite && stepCount(st.schedule,y,m,d,opposite,nurses)>getStaffingMinForDate(ward,y,m,d,opposite);
          })
          .sort((a,b)=>{
            const sa=summarizeSchedule(st.schedule,nurses,y,m);
            const ak=shift==='D' ? (sa[a.id]?.days||0) : (sa[a.id]?.evenings||0);
            const bk=shift==='D' ? (sa[b.id]?.days||0) : (sa[b.id]?.evenings||0);
            return ak-bk || String(a.name||'').localeCompare(String(b.name||''),'ko');
          });
        let ok=false;
        for(const n of cands){
          if(stepAssign(n,shift,d,`${shift}최종최소`,{replace:true,overrideWanted:true,overrideLock:true,overrideStaffingMax:false,overrideMinOff:true,overrideRecoveryOff:true})){
            placed++; ok=true; break;
          }
        }
        if(!ok && shift==='E'){
          const dDonors=nurses.filter(n=>stepIsCountedStaff(n)&&String(st.schedule[makeDateKey(y,m,d)]?.[n.id]||'').toUpperCase()==='D')
            .filter(n=>stepCanPlace(n,'E',d,{replace:true,overrideWanted:true,overrideLock:true,overrideStaffingMax:false,overrideMinOff:true,overrideRecoveryOff:true}));
          const dFillers=nurses.filter(n=>stepIsCountedStaff(n)&&stepAllowed(n,'D')&&stepIsRest(st.schedule[makeDateKey(y,m,d)]?.[n.id]))
            .filter(n=>!['AL','SL','WO','HA','HP','N'].includes(String(st.schedule[makeDateKey(y,m,d)]?.[n.id]||'').toUpperCase()))
            .filter(n=>stepCanPlace(n,'D',d,{replace:true,overrideWanted:true,overrideLock:true,overrideStaffingMax:false,overrideMinOff:true,overrideRecoveryOff:true}));
          for(const donor of dDonors){
            for(const filler of dFillers){
              if(donor.id===filler.id) continue;
              const k=makeDateKey(y,m,d);
              const oldDonor=st.schedule[k]?.[donor.id]||'', oldFiller=st.schedule[k]?.[filler.id]||'';
              st.schedule[k][donor.id]='E';
              st.schedule[k][filler.id]='D';
              if(stepCount(st.schedule,y,m,d,'D',nurses)>=getStaffingMinForDate(ward,y,m,d,'D') &&
                 stepCount(st.schedule,y,m,d,'E',nurses)>=getStaffingMinForDate(ward,y,m,d,'E')){
                stepLock(y,m,d,donor.id,'E최종 2인교환');
                stepLock(y,m,d,filler.id,'D최종 2인교환');
                placed+=2; ok=true; break;
              }
              st.schedule[k][donor.id]=oldDonor;
              st.schedule[k][filler.id]=oldFiller;
            }
            if(ok) break;
          }
        }
        if(!ok){
          const emergency=nurses
            .filter(n=>stepIsCountedStaff(n)&&stepAllowed(n,shift))
            .filter(n=>{
              const cur=String(st.schedule[makeDateKey(y,m,d)]?.[n.id]||'').toUpperCase();
              if(!['O','OF'].includes(cur)) return false;
              if(stepIsRestricted(n,getDateType(y,m,d))) return false;
              if(!isPersonalShiftAllowedForDateType(n,shift,getDateType(y,m,d))) return false;
              const prev=d>1?String(st.schedule[makeDateKey(y,m,d-1)]?.[n.id]||'').toUpperCase():String(getPreviousMonthLastCode(ward,n.id,y,m)||'').toUpperCase();
              const next=d<last?String(st.schedule[makeDateKey(y,m,d+1)]?.[n.id]||'').toUpperCase():'';
              if(violatesWorkTypeTransition(n,prev,shift)) return false;
              if(shift==='E' && next==='D') return false;
              if(shift==='N' && (next==='D'||next==='E')) return false;
              return true;
            })
            .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko'));
          if(emergency.length){
            const n=emergency[0], k=makeDateKey(y,m,d);
            st.schedule[k][n.id]=shift;
            stepLock(y,m,d,n.id,`${shift}최종응급최소`);
            placed++; ok=true;
          }
        }
        if(!ok) break;
      }
    }
  }
  const unresolved=[];
  for(let d=1; d<=last; d++){
    for(const shift of ['D','E']){
      const got=stepCount(st.schedule,y,m,d,shift,nurses), min=getStaffingMinForDate(ward,y,m,d,shift);
      if(got<min) unresolved.push(`${makeDateKey(y,m,d)} ${shift} ${got}/${min}`);
    }
  }
  return {placed, unresolved};
}

function stepRebuildLateMonthNightBlocks(){
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return {changed:false, score:0, remainingSingles:0};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const counted=nurses.filter(n=>stepIsCountedStaff(n));
  const y=st.y, m=st.m, last=daysInMonth(y,m);
  if(last<5) return {changed:false, score:0, remainingSingles:0};
  // 월말 N은 앞쪽 블록을 하루 늘려 해결하는 경우가 많아 마지막 8일을 함께 재검토합니다.
  const start=Math.max(1,last-7);
  const days=Array.from({length:last-start+1},(_,i)=>start+i);
  function key(d){ return makeDateKey(y,m,d); }
  function code(n,d){ return String(st.schedule[key(d)]?.[n.id]||'').toUpperCase(); }
  function set(n,d,c){ if(!st.schedule[key(d)]) st.schedule[key(d)]={}; st.schedule[key(d)][n.id]=c; }
  function isFixedRest(c){ return ['AL','SL','WO','HA','HP'].includes(String(c||'').toUpperCase()); }
  function isMutableBase(n,d){
    const c=code(n,d);
    if(stepIsNightKeep(n) || !stepIsCountedStaff(n) || !stepAllowed(n,'N')) return false;
    if(['D','E','MD','SD6'].includes(c) || isFixedRest(c)) return false;
    return c==='' || c==='O' || c==='OF' || c==='N';
  }
  const mutable=counted.filter(n=>days.some(d=>isMutableBase(n,d)));
  if(!mutable.length) return {changed:false, score:0, remainingSingles:0};

  const originalRows={};
  days.forEach(d=>{ originalRows[key(d)]=Object.assign({}, st.schedule[key(d)]||{}); });
  const originalLocks={};
  days.forEach(d=>mutable.forEach(n=>{ originalLocks[`${d}:${n.id}`]=stepLockReason(y,m,d,n.id); }));

  function restore(){
    days.forEach(d=>{ st.schedule[key(d)]=Object.assign({}, originalRows[key(d)]||{}); });
    days.forEach(d=>mutable.forEach(n=>{
      const reason=originalLocks[`${d}:${n.id}`];
      if(reason) stepLock(y,m,d,n.id,reason); else stepUnlock(y,m,d,n.id);
    }));
  }
  function clearMutableN(){
    days.forEach(d=>mutable.forEach(n=>{
      if(code(n,d)==='N'){
        set(n,d,'OF');
        stepUnlock(y,m,d,n.id);
      }
    }));
  }
  function nCount(n){
    let c=0;
    for(let d=1; d<=last; d++){ if(code(n,d)==='N') c++; }
    return c;
  }
  function maxN(n){ return stepIsNightKeep(n) ? nightKeepMonthlyTargetByDays(last) : getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6); }
  function maxConsec(n){
    let v=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight??3);
    if(v<=0) v=Number(data.commonScheduleSettings?.defaultMaxConsecutiveNight??3)||3;
    return v;
  }
  function nightStreakIf(n,d){
    let c=1;
    for(let x=d-1; x>=1; x--){ if(code(n,x)==='N') c++; else break; }
    for(let x=d+1; x<=last; x++){ if(code(n,x)==='N') c++; else break; }
    return c;
  }
  function canNight(n,d){
    if(!isMutableBase(n,d)) return false;
    if(nCount(n)>=maxN(n)) return false;
    if(stepIsRestricted(n,getDateType(y,m,d))) return false;
    if(!isPersonalShiftAllowedForDateType(n,'N',getDateType(y,m,d))) return false;
    if(stepViolatesPreviousMonthNightReentryGap(n,d)) return false;
    if(stepViolatesNightRecoveryOffGap(n,d)) return false;
    if(stepViolatesNightReentryGap(n,d)) return false;
    if(stepViolatesFutureNightGap(n,d)) return false;
    if(nightStreakIf(n,d)>maxConsec(n)) return false;
    const prev=d>1?code(n,d-1):String(getPreviousMonthLastCode(ward,n.id,y,m)||'').toUpperCase();
    const next=d<last?code(n,d+1):'';
    if(violatesWorkTypeTransition(n,prev,'N')) return false;
    if(next==='D'||next==='E') return false;
    return true;
  }
  function fixedNightNames(d){
    return nurses.filter(n=>code(n,d)==='N' && !mutable.some(x=>x.id===n.id));
  }
  function candidateCombos(d){
    const need=Math.max(0,getStaffingMinForDate(ward,y,m,d,'N')-fixedNightNames(d).length);
    if(need===0) return [[]];
    const pool=mutable.filter(n=>canNight(n,d));
    const combos=[];
    function rec(idx,pick){
      if(pick.length===need){ combos.push(pick.slice()); return; }
      for(let i=idx; i<pool.length; i++){
        pick.push(pool[i]);
        rec(i+1,pick);
        pick.pop();
      }
    }
    rec(0,[]);
    return combos;
  }
  function safeAllDays(){
    for(const d of days){
      const got=stepCount(st.schedule,y,m,d,'N',nurses);
      const min=getStaffingMinForDate(ward,y,m,d,'N');
      const max=getStaffingMaxForDate(ward,y,m,d,'N');
      if(got<min || (max!==Infinity && got>max)) return false;
      if(stepNightDayHasUnsafePair(d)) return false;
    }
    return true;
  }
  function blocks(n){
    const arr=[]; let s=0;
    for(let d=1; d<=last+1; d++){
      const is=d<=last && code(n,d)==='N';
      if(is && !s) s=d;
      if((!is || d>last) && s){ arr.push({start:s,end:d-1,len:d-s}); s=0; }
    }
    return arr;
  }
  function score(){
    let s=0;
    for(const n of mutable){
      for(const b of blocks(n).filter(b=>b.end>=start-1)){
        if(b.len===1) s+=500;
        else if(b.len===2) s-=80;
        else if(b.len===3) s-=120;
        else s+=200;
      }
      for(let d=start; d<=last; d++){
        if(code(n,d)==='N' && stepViolatesNightReentryGap(n,d)) s+=60;
        if(code(n,d)==='N' && stepViolatesNightRecoveryOffGap(n,d)) s+=1000;
      }
    }
    return s;
  }

  const originalScore=score();
  const startedAt=Date.now();
  const deadlineMs=850;
  const maxLeaves=1800;
  const maxCombosPerDay=10;
  let best=null, bestScore=Infinity, tried=0, visited=0;
  clearMutableN();
  function dfs(dayIndex){
    if(tried>=maxLeaves || visited++>maxLeaves*8 || Date.now()-startedAt>deadlineMs) return;
    if(dayIndex>=days.length){
      tried++;
      if(!safeAllDays()) return;
      const sc=score();
      if(sc<bestScore){
        bestScore=sc;
        best=days.map(d=>({d,row:Object.assign({},st.schedule[key(d)]||{})}));
      }
      return;
    }
    const d=days[dayIndex];
    const need=Math.max(0,getStaffingMinForDate(ward,y,m,d,'N')-fixedNightNames(d).length);
    let combos;
    if(need===0){
      combos=[[]];
    }else{
      const pool=mutable.filter(n=>canNight(n,d)).sort((a,b)=>{
        const blockScore=(n)=>{
          const prev=d>1 && code(n,d-1)==='N' ? -5 : 0;
          const next=d<last && code(n,d+1)==='N' ? -4 : 0;
          return prev + next + nCount(n);
        };
        return blockScore(a)-blockScore(b) || String(a.name||'').localeCompare(String(b.name||''),'ko');
      });
      combos=[];
      function rec(idx,pick){
        if(combos.length>=maxCombosPerDay || Date.now()-startedAt>deadlineMs) return;
        if(pick.length===need){ combos.push(pick.slice()); return; }
        for(let i=idx; i<pool.length && combos.length<maxCombosPerDay; i++){
          pick.push(pool[i]);
          rec(i+1,pick);
          pick.pop();
        }
      }
      rec(0,[]);
    }
    for(const combo of combos){
      const snap=Object.assign({}, st.schedule[key(d)]||{});
      mutable.forEach(n=>{ if(code(n,d)==='N') set(n,d,'OF'); });
      combo.forEach(n=>{ set(n,d,'N'); stepLock(y,m,d,n.id,'월말 N 블록 재배치'); });
      dfs(dayIndex+1);
      st.schedule[key(d)]=snap;
    }
  }
  dfs(0);
  if(!best || bestScore>=originalScore){
    restore();
    return {changed:false, score:originalScore, remainingSingles:0};
  }
  restore();
  best.forEach(x=>{
    st.schedule[key(x.d)]=Object.assign({}, x.row);
    mutable.forEach(n=>{
      if(String(x.row[n.id]||'').toUpperCase()==='N') stepLock(y,m,x.d,n.id,'월말 N 블록 재배치');
      else stepUnlock(y,m,x.d,n.id);
    });
  });
  const singles=mutable.reduce((sum,n)=>sum+blocks(n).filter(b=>b.len===1&&b.end>=start).length,0);
  stepLog(`월말 N 블록 재배치 ${makeDateKey(y,m,start)}~${makeDateKey(y,m,last)} 점수 ${originalScore}→${bestScore}`);
  return {changed:true, score:bestScore, remainingSingles:singles};
}

  const pairSingles2=stepPairSeparatedSingleNightBlocks();
  if(pairSingles2.moves) stepLog(`3단계 1N 블록쌍 최종교환 ${pairSingles2.moves}건`);
  const lateNightRebuild=stepRebuildLateMonthNightBlocks();
  if(lateNightRebuild.changed) stepLog(`3단계 월말 N 블록 재배치 완료 · 남은 단독N ${lateNightRebuild.remainingSingles}건`);
  const reentryFix2=stepRepairNightReentryGapBySameDaySwap();
  if(reentryFix2.moves) stepLog(`3단계 N 재진입 텀 최종교정 ${reentryFix2.moves}건${reentryFix2.remaining.length?` · 잔여 ${reentryFix2.remaining.slice(0,5).join(' / ')}`:''}`);

  const weekdaySwap=stepRepairWeekdayNightShortageByWeekendSwap();
  if(weekdaySwap.swaps) stepLog(`3단계 N 주말→평일 재배치 교정 ${weekdaySwap.swaps}건`);

  const removedUnsafe=stepRemoveUnsafeNightJuniorPairs();
  if(removedUnsafe.removed){ stepLog(`3단계 N 주니어끼리 배정 최종제거 ${removedUnsafe.removed}건`); }
  const misses=stepNightShortages();
  const unsafe=[];
  for(let d=1; d<=last; d++){ if(stepNightDayHasUnsafePair(d)) unsafe.push(`${makeDateKey(y,m,d)} N 시니어지원자 없음`); }
  const singles=stepImproveNightBlockQuality().singles || 0;
  const queueNames=regularQueue.map(n=>n.name).join(' → ');
  const unresolved=[...misses.map(x=>`${makeDateKey(y,m,x.d)} N ${x.got}/${x.need}`), ...unsafe];
  if(unresolved.length){
    st.done[3]=false;
    stepLog(`3단계 N 안전블록 엔진 미해결: ${unresolved.slice(0,10).join(' / ')} · 단독N ${singles}건 · 큐 ${queueNames||'대상 없음'} · 기존 일반N ${cleared}칸 초기화 · 새 N ${placed}건`);
  }else{
    st.done[3]=true;
    stepLog(`3단계 N 안전블록 엔진 완료: N 부족 0 · 시니어지원 조합 유지 · 단독N ${singles}건 · 큐 ${queueNames||'대상 없음'} · 기존 일반N ${cleared}칸 초기화 · 새 N ${placed}건`);
  }
  stepPushDraft();
  renderWardSchedule();
}

function stepRunAll(){

  stepClearGenerationState();

let stepGenerationBusy=false;
function setStepGenerationStatus(message,type='busy'){
  const el=document.getElementById('stepgenStatus');
  if(!el) return;
  el.textContent=message||'';
  el.classList.remove('hidden','done','warn');
  if(type==='done') el.classList.add('done');
  if(type==='warn') el.classList.add('warn');
}
function setStepButtonsDisabled(disabled, clickedBtn){
  document.querySelectorAll('[data-step-action]').forEach(btn=>{
    btn.disabled=!!disabled;
    if(!disabled && btn.dataset.originalText) btn.textContent=btn.dataset.originalText;
  });
  if(clickedBtn && disabled){
    clickedBtn.dataset.originalText=clickedBtn.dataset.originalText || clickedBtn.textContent;
    clickedBtn.textContent='계산 중...';
  }
}
function runStepWithFeedback(evt,label,fnName){
  if(stepGenerationBusy) return;
  const fn=window[fnName];
  if(typeof fn!=='function') return alert('실행할 단계를 찾을 수 없습니다.');
  const clicked=evt?.currentTarget;
  stepGenerationBusy=true;
  setStepButtonsDisabled(true,clicked);
  setStepGenerationStatus(`${label} 계산 중입니다. 잠시만 기다려 주세요.`);
  const run=()=>setTimeout(()=>{
    try{
      fn();
      setStepGenerationStatus(`${label} 완료되었습니다. 결과를 확인해 주세요.`,'done');
    }catch(e){
      console.error(e);
      setStepGenerationStatus(`${label} 실행 중 오류가 발생했습니다. 점검 결과와 설정을 확인해 주세요.`,'warn');
      alert(`${label} 실행 중 오류가 발생했습니다: ${e?.message||e}`);
    }finally{
      stepGenerationBusy=false;
      setStepButtonsDisabled(false);
    }
  },25);
  if(window.requestAnimationFrame) window.requestAnimationFrame(run);
  else run();
}
function resetStepWithFeedback(evt){
  if(stepGenerationBusy) return;
  const clicked=evt?.currentTarget;
  stepGenerationBusy=true;
  setStepButtonsDisabled(true,clicked);
  setStepGenerationStatus('단계별 생성 초안을 초기화하는 중입니다.');
  const run=()=>setTimeout(()=>{
    try{
      stepResetGeneration();
      setStepGenerationStatus('단계별 생성 초안을 초기화했습니다.','done');
    }finally{
      stepGenerationBusy=false;
      setStepButtonsDisabled(false);
    }
  },25);
  if(window.requestAnimationFrame) window.requestAnimationFrame(run);
  else run();
}

function deleteCurrentMonthWardSchedule(){
  const ward=getCurrentWard();
  if(!ward) return;
  normalizeWardStructure(ward);
  const currentMonthKey=monthKey(uiYear,uiMonth);
  const savedSchedule=cloneJson(ward.schedulesByMonth?.[currentMonthKey] || {});
  const hasSaved=Object.keys(savedSchedule||{}).length>0;
  const draftKey=getScheduleDraftKey(ward.id,uiYear,uiMonth);
  const draftSchedule=cloneJson(scheduleDraftState[draftKey]?.schedule || {});
  const hasDraft=Object.keys(draftSchedule||{}).length>0;
  if(!hasSaved && !hasDraft){
    alert('삭제할 근무표가 없습니다.');
    return;
  }
  if(!confirm(`${currentMonthKey} 근무표를 전체 삭제할까요? 저장된 보관본과 현재 화면의 근무표가 모두 비워집니다.`)) return;

  if(ward.schedulesByMonth && ward.schedulesByMonth[currentMonthKey]){
    delete ward.schedulesByMonth[currentMonthKey];
  }

  // ward.schedule은 기존 화면/관리자 조회 호환용 백업이므로, 현재 삭제 대상과 같으면 함께 비웁니다.
  try{
    if(JSON.stringify(ward.schedule||{}) === JSON.stringify(savedSchedule||{}) || JSON.stringify(ward.schedule||{}) === JSON.stringify(draftSchedule||{})){
      ward.schedule={};
    }
  }catch(e){
    ward.schedule={};
  }

  scheduleDraftState[draftKey]={schedule:{}, edit:false};
  resultCache=null;
  saveData(true);
  renderWardSchedule();
  renderWardScheduleArchive();
  popup('해당 월 근무표가 전체 삭제되었습니다.');
}

function buildStyledExcelHtml(ward,schedule,stats,y,m){
  const dayCount=daysInMonth(y,m);
  const nurses=(ward.nurses||[]);
  const codeStyle={
    D:'background:#dbeafe;color:#1e3a8a;font-weight:bold;',
    E:'background:#fef3c7;color:#92400e;font-weight:bold;',
    N:'background:#ede9fe;color:#5b21b6;font-weight:bold;',
    O:'background:#f1f5f9;color:#334155;font-weight:bold;',
    OF:'background:#f1f5f9;color:#334155;font-weight:bold;',
    WO:'background:#e0f2fe;color:#075985;font-weight:bold;',
    AL:'background:#dcfce7;color:#166534;font-weight:bold;',
    SL:'background:#fee2e2;color:#991b1b;font-weight:bold;',
    HA:'background:#fef3c7;color:#92400e;font-weight:bold;',
    HP:'background:#fef3c7;color:#92400e;font-weight:bold;',
    MD:'background:#fce7f3;color:#9d174d;font-weight:bold;',
    SD6:'background:#fce7f3;color:#9d174d;font-weight:bold;'
  };

  const header='background:#1d4ed8;color:#ffffff;font-weight:bold;'+border;
  const nameCell='background:#f8fafc;font-weight:bold;text-align:left;'+border;
  const summary='background:#e2e8f0;font-weight:bold;'+border;
  const title='font-size:18px;font-weight:bold;text-align:left;padding:8px;';
  let html=`<html><head><meta charset="utf-8"><style>table{border-collapse:collapse;font-family:Arial,sans-serif;font-size:11pt;} .sat{color:#2563eb;font-weight:bold}.sun{color:#dc2626;font-weight:bold}</style></head><body>`;
  html+=`<table><tr><td colspan="${dayCount+7}" style="${title}">${escapeHtml(ward.name)} ${y}년 ${m}월 근무표</td></tr>`;
  html+='<tr><td style="'+header+'">간호사</td>';
  for(let d=1; d<=dayCount; d++){
    const key=makeDateKey(y,m,d);
    const type=getDateType(y,m,d);
    const dow=getDowLabel(y,m,d);
    const color=(type==='sat')?'color:#2563eb;':((type==='sun'||type==='holiday')?'color:#dc2626;':'');
    const memo=getHolidayMemoByDate(key);
    html+=`<td style="${header}${color}">${d}<br>${dow}${memo?`<br>${escapeHtml(memo)}`:''}</td>`;
  }
  ['D 횟수','E 횟수','N 횟수','MD 횟수','OFF 개수','주말/휴일 OFF'].forEach(h=>html+=`<td style="${header}">${h}</td>`);
  html+='</tr>';
  nurses.forEach(n=>{
    html+=`<tr><td style="${nameCell}">${escapeHtml(n.name||'')}</td>`;
    for(let d=1; d<=dayCount; d++){
      const key=makeDateKey(y,m,d);
      const code=String(schedule[key]?.[n.id]||'').toUpperCase();
      html+=`<td style="${border}${codeStyle[code]||''}">${escapeHtml(code)}</td>`;
    }
    html+=`<td style="${border}">${stats[n.id]?.days||0}</td><td style="${border}">${stats[n.id]?.evenings||0}</td><td style="${border}">${stats[n.id]?.nights||0}</td><td style="${border}">${stats[n.id]?.midDays||0}</td><td style="${border}">${stats[n.id]?.totalOff||0}</td><td style="${border}">${stats[n.id]?.weekendHolidayOff||0}</td></tr>`;
  });
  const workSummaryRows=[
    {label:'D 명수', codes:['D']},
    {label:'E 명수', codes:['E']},
    {label:'N 명수', codes:['N']},
    {label:'MD/SD6 명수', codes:['MD','SD6']},
    {label:'OFF 명수', codes:['O','OF','WO','AL','SL','HA','HP']}
  ];
  function countCodesOnDay(day, codes){
    const key=makeDateKey(y,m,day);
    const workCodes=['D','E','N','MD','SD6'];
    const isWorkRow=codes.some(c=>workCodes.includes(String(c).toUpperCase()));
    return nurses.filter(n=>{
      if(isWorkRow && isUnifiedNewNurse(n)) return false;
      return codes.includes(String(schedule[key]?.[n.id]||'').toUpperCase());
    }).length;

  html+=`<tr><td colspan="${dayCount+7}" style="${summary};text-align:left">날짜별 근무코드 인원 집계</td></tr>`;

  });
  html+='</table></body></html>';
  return html;
}
function downloadStyledExcel(ward,schedule,y,m){
  const stats=summarizeSchedule(schedule,ward.nurses,y,m);
  const html=buildStyledExcelHtml(ward,schedule,stats,y,m);
  const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${ward.name}_${y}_${String(m).padStart(2,'0')}_근무표.xls`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

  activeTab='ward-schedule';
  renderApp();
}
function deleteArchivedScheduleMonth(monthKeyText){
  const ward=getCurrentWard();
  if(!ward.schedulesByMonth || !ward.schedulesByMonth[monthKeyText]) return;
  if(!confirm(`${monthKeyText} 근무표 보관본을 삭제할까요?`)) return;
  delete ward.schedulesByMonth[monthKeyText];
  const draftKey=getScheduleDraftKey(ward.id,Number(monthKeyText.slice(0,4)),Number(monthKeyText.slice(5,7)));
  delete scheduleDraftState[draftKey];
  saveData(true);
  renderWardScheduleArchive();
  popup('보관 근무표가 삭제되었습니다.');
}

function renderGenerateSummary(){
  const ward=getCurrentWard();
  if(!ward) return '';
  const draft=ensureScheduleDraft(ward,uiYear,uiMonth);
  const schedule=draft.schedule||{};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave' && n.employmentStatus!=='inactive');
  const stats=summarizeSchedule(schedule,nurses,uiYear,uiMonth);
  const targetOff=getRegularMonthlyOffTarget(ward,uiYear,uiMonth);
  const issues=[];
  function needFor(day,shift){ return getStaffingMinForDate(ward,uiYear,uiMonth,day,shift); }
  function count(day,shift){ return stepCount(schedule,uiYear,uiMonth,day,shift,nurses); }
  function expCount(key,shift){ return nurses.filter(n=>schedule[key]?.[n.id]===shift && !getNurseConstraints(n).isNew).length; }
  function isRestricted(n,dtype){ const c=getNurseConstraints(n); return (dtype==='sat'&&c.satRestricted)||((dtype==='holiday'||dtype==='sun')&&c.holidayRestricted)||((dtype==='sat'||dtype==='sun'||dtype==='holiday')&&c.weekendRestricted); }
  for(let d=1; d<=daysInMonth(uiYear,uiMonth); d++){
    const key=makeDateKey(uiYear,uiMonth,d), dtype=getDateType(uiYear,uiMonth,d);
    ['D','E','N'].forEach(shift=>{
      const cnt=count(d,shift);
      const min=needFor(d,shift);
      const max=getStaffingMaxForDate(ward,uiYear,uiMonth,d,shift);
      if(cnt < min) issues.push(`${key} ${shift} 인원 부족 (${cnt}/${min})`);
      if(max!==Infinity && cnt > max) issues.push(`${key} ${shift} 최대인원 초과 (${cnt}/${max})`);
    });
    nurses.forEach(n=>{
      const code=schedule[key]?.[n.id]||'';
      if(isHardPlacementWorkCode(code) && !hardPlacementAllowedForNurse(n,code,uiYear,uiMonth,d)){
        issues.push(`${key} ${hardPlacementViolationText(n,code,uiYear,uiMonth,d)}`);
      }
      if(getNurseConstraints(n).isNew && ['D','E','N'].includes(code) && expCount(key,code)===0) issues.push(`${key} ${n.name} 신규 단독근무 위험 (${code})`);
      if(d===1){
        const prev=getPreviousMonthLastCode(ward,n.id,uiYear,uiMonth);
        if(violatesWorkTypeTransition(n,prev,code)) issues.push(`${key} ${n.name} 전달 마지막 근무 연속성 위반 (${prev}→${code})`);
      }
    });
  }
  issues.push(...collectSkillMixIssues(schedule,nurses,uiYear,uiMonth,ward));
  nurses.forEach(n=>{
    const minNs=getNurseNumberSetting(n,'minConsecutiveNight',data.commonScheduleSettings?.defaultMinConsecutiveNight ?? 0);
    const maxNs=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3);
    const prevTail=getPreviousMonthTailCodesSinceLastOff(ward,n.id,uiYear,uiMonth);
    let streak=countTrailingFromArray(prevTail, c=>String(c||'').toUpperCase()==='N'), start=streak>0 ? '전월말' : 0;
    for(let d=1; d<=daysInMonth(uiYear,uiMonth)+1; d++){
      const key=d<=daysInMonth(uiYear,uiMonth) ? makeDateKey(uiYear,uiMonth,d) : '';
      const code=d<=daysInMonth(uiYear,uiMonth) ? String(schedule[key]?.[n.id]||'').toUpperCase() : '';
      if(code==='N'){
        if(streak===0) start=d;
        streak++;
      } else if(streak>0){
        const label = start==='전월말' ? `${n.name} 전월 말부터 이어진 연속 N` : `${makeDateKey(uiYear,uiMonth,start)} ${n.name} 연속 N`;
        if(minNs>0 && streak<minNs) issues.push(`${label} 최소 미달 (${streak}/${minNs})`);
        if(maxNs>0 && streak>maxNs) issues.push(`${label} 최대 초과 (${streak}/${maxNs})`);
        streak=0; start=0;
      }
    }
    const maxWork=getNurseNumberSetting(n,'maxConsecutiveDays',data.commonScheduleSettings?.defaultMaxConsecutiveDays ?? 5);
    const workPrevTail=getPreviousMonthTailCodesSinceLastOff(ward,n.id,uiYear,uiMonth);
    let workStreak=countTrailingFromArray(workPrevTail, c=>stepWorkCodes().includes(String(c||'').toUpperCase()));
    let workStart=workStreak>0 ? '전월말' : 0;
    for(let d=1; d<=daysInMonth(uiYear,uiMonth)+1; d++){
      const key=d<=daysInMonth(uiYear,uiMonth) ? makeDateKey(uiYear,uiMonth,d) : '';
      const code=d<=daysInMonth(uiYear,uiMonth) ? String(schedule[key]?.[n.id]||'').toUpperCase() : '';
      if(d<=daysInMonth(uiYear,uiMonth) && stepWorkCodes().includes(code)){
        if(workStreak===0) workStart=d;
        workStreak++;
      }else if(workStreak>0){
        const label=workStart==='전월말' ? `${n.name} 전월 말부터 이어진 연속근무` : `${makeDateKey(uiYear,uiMonth,workStart)} ${n.name} 연속근무`;
        if(maxWork>0 && workStreak>maxWork) issues.push(`${label} 최대 초과 (${workStreak}/${maxWork})`);
        workStreak=0; workStart=0;
      }
    }
    const minOff=getNurseNumberSetting(n,'minConsecutiveOff',data.commonScheduleSettings?.defaultMinConsecutiveOff ?? 1);
    const maxOff=getNurseNumberSetting(n,'maxConsecutiveOff',data.commonScheduleSettings?.defaultMaxConsecutiveOff ?? 3);
    let offStreak=0, offStart=0;
    for(let d=1; d<=daysInMonth(uiYear,uiMonth)+1; d++){
      const key=d<=daysInMonth(uiYear,uiMonth) ? makeDateKey(uiYear,uiMonth,d) : '';
      const code=d<=daysInMonth(uiYear,uiMonth) ? String(schedule[key]?.[n.id]||'').toUpperCase() : '';
      if(d<=daysInMonth(uiYear,uiMonth) && stepIsRest(code)){
        if(offStreak===0) offStart=d;
        offStreak++;
      }else if(offStreak>0){
        if(minOff>1 && offStreak<minOff) issues.push(`${makeDateKey(uiYear,uiMonth,offStart)} ${n.name} 연속 OFF 최소 미달 (${offStreak}/${minOff})`);
        if(maxOff>0 && offStreak>maxOff) issues.push(`${makeDateKey(uiYear,uiMonth,offStart)} ${n.name} 연속 OFF 최대 초과 (${offStreak}/${maxOff})`);
        offStreak=0; offStart=0;
      }
    }
  });
  issues.push(...collectNightLimitIssues(schedule, ward, uiYear, uiMonth));
  // N 균등 분배는 나이트킵/개인별 상한/최소인원 보정 때문에 차이가 날 수 있어 하드 경고로 표시하지 않습니다.
  const unique=[...new Set(issues)];
  const offIssues=[...new Set(collectMonthlyOffBalanceIssues(schedule, ward, uiYear, uiMonth))];
  if(unique.length===0 && offIssues.length===0) return `<div class="ok" style="margin-top:8px">근무인원 부족, 배치제한 위반, 신규/주니어 위험조합 없음 · 월 기준OFF 균형 및 전월 마지막 OFF 이후 연속흐름 포함 점검 완료</div>`;
  const hardHtml=unique.map(w=>`<div class="alert" style="margin-top:8px">${w}</div>`).join('');
  const offHtml=offIssues.map(w=>`<div class="alert" style="margin-top:8px">${w}</div>`).join('');
  return `<div><div class="alert" style="margin-top:8px"><strong>${unique.length?'근무표 확인 필요':'OFF 균형 확인 필요'}</strong></div>${hardHtml}${offHtml}</div>`;
}

function renderScheduleTable(ward,schedule,stats,editable=false){
  const dayCount=daysInMonth(uiYear,uiMonth);
  const codeOptions=getAvailableScheduleCodes();
  const nurses=(ward.nurses||[]);
  const workSummaryRows=[
    {label:'D 명수', codes:['D'], className:'daily-count-row'},
    {label:'E 명수', codes:['E'], className:'daily-count-row'},
    {label:'N 명수', codes:['N'], className:'daily-count-row'},
    {label:'MD/SD6 명수', codes:['MD','SD6'], className:'daily-count-row'},
    {label:'OFF 명수', codes:['O','OF','WO','AL','SL','HA','HP'], className:'daily-count-row'}
  ];
  function countCodesOnDay(day, codes){
    const key=makeDateKey(uiYear,uiMonth,day);
    const workCodes=['D','E','N','MD','SD6'];
    const isWorkRow=codes.some(c=>workCodes.includes(String(c).toUpperCase()));
    return nurses.filter(n=>{
      if(isWorkRow && isUnifiedNewNurse(n)) return false;
      return codes.includes(String(schedule[key]?.[n.id]||'').toUpperCase());
    }).length;
  }
  function countCodesInMonth(codes){
    let total=0;
    for(let d=1; d<=dayCount; d++) total += countCodesOnDay(d,codes);
    return total;
  }
  let html='<div class="schedule-wrap"><table class="schedule-table-fit"><colgroup><col class="sticky-col">' + Array.from({length:dayCount},()=>'<col class="day-col">').join('') + Array.from({length:6},()=>'<col class="summary-col">').join('') + '</colgroup><thead><tr><th class="sticky">간호사</th>';
  for(let d=1;d<=dayCount;d++){
    const dayClass=getDayNumberClass(uiYear,uiMonth,d);
    const dowClass=getDowClass(uiYear,uiMonth,d);
    const key=makeDateKey(uiYear,uiMonth,d);
    const memo=getHolidayMemoByDate(key);
    html+=`<th><div class="${dayClass}">${d}</div><div class="small ${dowClass}">${getDowLabel(uiYear,uiMonth,d)}</div>${memo?`<div class="holiday-note" style="margin-top:4px">${escapeHtml(memo)}</div>`:''}</th>`;
  }
  html+='<th>D</th><th>E</th><th>N</th><th>MD</th><th>OFF</th><th>휴일OFF</th></tr></thead><tbody>';
  nurses.forEach(n=>{
    html+=`<tr><td class="sticky"><div><strong>${escapeHtml(n.name)}</strong></div></td>`;
    for(let d=1;d<=dayCount;d++){
      const key=makeDateKey(uiYear,uiMonth,d), code=schedule[key]?.[n.id]||'';
      if(editable){
        html+=`<td class="schedule-code-cell"><select class="schedule-cell-select" onchange="updateScheduleCellDraft('${ward.id}',${uiYear},${uiMonth},'${key}','${n.id}',this.value)"><option value=""></option>${codeOptions.map(c=>`<option value="${c}" ${c===code?'selected':''}>${c}</option>`).join('')}</select></td>`;
      } else {
        html+=`<td class="schedule-code-cell">${escapeHtml(code)}</td>`;
      }
    }
    html+=`<td>${stats[n.id]?.days||0}</td><td>${stats[n.id]?.evenings||0}</td><td>${stats[n.id]?.nights||0}</td><td>${stats[n.id]?.midDays||0}</td><td>${stats[n.id]?.totalOff||0}</td><td>${stats[n.id]?.weekendHolidayOff||0}</td></tr>`;
  });

  // 날짜별 근무코드 인원 집계: 각 날짜에 D/E/N/OFF/MD가 몇 명인지 바로 확인
  html += `<tr><td class="sticky" colspan="${dayCount+7}" style="background:#f8fafc;font-weight:700;text-align:left">날짜별 근무코드 인원 집계</td></tr>`;
  workSummaryRows.forEach(row=>{
    html += `<tr class="${row.className}"><td class="sticky" style="background:#f8fafc;font-weight:700">${row.label}</td>`;
    for(let d=1; d<=dayCount; d++){
      const cnt=countCodesOnDay(d,row.codes);
      html += `<td style="background:#f8fafc;font-weight:700">${cnt}</td>`;
    }
    const monthTotal=countCodesInMonth(row.codes);
    html += `<td colspan="6" style="background:#f8fafc;font-weight:700;text-align:left">월 합계 ${monthTotal}</td></tr>`;
  });

  html+='</tbody></table></div>'; return html;
}

function renderStageAwareGenerateSummary(){
  const ward=getCurrentWard();
  const st=stepGenerationState;
  if(st && ward && st.wardId===ward.id && st.y===uiYear && st.m===uiMonth && !st.done[8]){
    const doneNums=Object.keys(st.done||{}).filter(k=>st.done[k]).map(Number).sort((a,b)=>a-b);
    const lastDone=doneNums.length ? Math.max(...doneNums) : 0;
    const nextStep = lastDone>=7 ? 8 : lastDone+1;
    return `<div class="muted" style="margin-top:8px;border:1px solid #dbe4ef;background:#f8fafc;border-radius:14px;padding:14px 16px;line-height:1.6">
      <strong>단계별 생성 진행중</strong><br>
      현재는 ${lastDone ? `${lastDone}단계까지 실행` : '아직 단계 실행 전'}된 임시 근무표입니다. 전체 근무표 점검은 8단계 OFF 정리/최종점검 완료 후 표시됩니다.<br>
      다음 실행 권장 단계: <strong>${nextStep}단계</strong><br>
      <span class="small">중간 단계에서는 D/E 인원이 아직 배치되지 않아 D/E 부족 경고가 대량으로 뜨는 것이 정상이라, 최종 점검 결과를 숨깁니다.</span>
    </div>`;
  }
  return renderGenerateSummary() || '<div class="muted">이상 없음</div>';
}
function renderMonthContinuityPanel(ward,schedule){
  if(!ward) return '';
  const prev=getPrevMonthYearMonth(uiYear,uiMonth);
  const prevSchedule=getWardScheduleForMonth(ward,prev.y,prev.m);
  if(!prevSchedule || Object.keys(prevSchedule||{}).length===0){
    return `<div class="item" style="margin-top:12px;background:#f8fafc">
      <h4>전월 연속성 점검</h4>
      <div class="small muted" style="margin-top:6px">${prev.y}년 ${prev.m}월 근무표가 저장되어 있지 않아 월 경계 흐름을 비교할 수 없습니다.</div>
    </div>`;
  }
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const prevLast=daysInMonth(prev.y,prev.m);
  const curLast=daysInMonth(uiYear,uiMonth);
  const prevDays=[Math.max(1,prevLast-2), Math.max(1,prevLast-1), prevLast].filter((v,i,a)=>a.indexOf(v)===i);
  const curDays=[1,2,3].filter(d=>d<=curLast);
  const workCodes=['D','E','N','MD','SD6'];
  function pkey(d){ return makeDateKey(prev.y,prev.m,d); }
  function ckey(d){ return makeDateKey(uiYear,uiMonth,d); }
  function codePrev(n,d){ return String(prevSchedule[pkey(d)]?.[n.id]||'').toUpperCase(); }
  function codeCur(n,d){ return String(schedule[ckey(d)]?.[n.id]||'').toUpperCase(); }
  function codeCell(c){ return c ? escapeHtml(c) : '<span class="muted">-</span>'; }
  function restNeeded(){ return Math.max(2, Number(ward.nightRestDaysAfterBlock ?? data.commonScheduleSettings?.defaultNightRestDaysAfterBlock ?? 2)); }
  const rows=nurses.map(n=>{
    const issues=[];
    const prevLastCode=getPreviousMonthLastCode(ward,n.id,uiYear,uiMonth);
    const day1=codeCur(n,1);
    if(day1 && violatesWorkTypeTransition(n,prevLastCode,day1)){
      issues.push(`전월말 ${prevLastCode||'-'}→1일 ${day1} 연속성 위반`);
    }
    const recovery=getPreviousMonthNightRecoveryRemaining(ward,n.id,uiYear,uiMonth,restNeeded());
    for(let d=1; d<=Math.min(recovery,curLast); d++){
      const c=codeCur(n,d);
      if(workCodes.includes(c)) issues.push(`전월 N 후 ${d}일차 OFF 필요`);
    }
    const prevTail=getPreviousMonthTailCodesSinceLastOff(ward,n.id,uiYear,uiMonth);
    const nStreakBefore=countTrailingFromArray(prevTail, c=>String(c||'').toUpperCase()==='N');
    if(nStreakBefore>0){
      let curN=0;
      for(let d=1; d<=curLast; d++){
        if(codeCur(n,d)==='N') curN++;
        else break;
      }
      const maxNs=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3);
      if(maxNs>0 && nStreakBefore+curN>maxNs) issues.push(`전월말부터 연속 N 최대 초과 (${nStreakBefore+curN}/${maxNs})`);
    }
    const tailLabel=prevTail.length ? prevTail.join(' ') : '전월 말 OFF로 단절';
    const status=issues.length ? `<span class="badge" style="border-color:#f59e0b;color:#92400e;background:#fffbeb">확인 필요</span><div class="small" style="margin-top:4px;color:#92400e">${issues.map(escapeHtml).join('<br>')}</div>` : '<span class="badge" style="border-color:#86efac;color:#166534;background:#f0fdf4">정상</span>';
    return `<tr>
      <td>${escapeHtml(n.name||'')}</td>
      <td>${prevDays.map(d=>`${d}일 ${codeCell(codePrev(n,d))}`).join(' · ')}</td>
      <td>${curDays.map(d=>`${d}일 ${codeCell(codeCur(n,d))}`).join(' · ')}</td>
      <td>${escapeHtml(tailLabel)}</td>
      <td>${status}</td>
    </tr>`;
  }).join('');
  return `<div class="item" style="margin-top:12px;background:#f8fafc">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div>
        <h4>전월 연속성 점검</h4>
        <div class="small muted" style="margin-top:4px">${prev.y}년 ${prev.m}월 말 근무와 ${uiYear}년 ${uiMonth}월 초 근무를 이어서 확인합니다.</div>
      </div>
      <span class="badge">${prev.y}.${pad(prev.m)} → ${uiYear}.${pad(uiMonth)}</span>
    </div>
    <div class="nurse-table-wrap" style="margin-top:10px;max-height:320px">
      <table style="min-width:980px">
        <thead><tr><th>간호사</th><th>전월 말 3일</th><th>이번 달 초 3일</th><th>마지막 OFF 이후 흐름</th><th>결과</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

    </div>
    <div class="card">
      <h3>간호부 공유 일정 목록</h3><div class="height:12px"></div>
      ${adminSharedEvents.map(e=>`<div class="item" style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><div><strong>${e.date}</strong>${e.startTime&&e.endTime?` ${e.startTime}~${e.endTime}`:(e.startTime?` ${e.startTime}`:(e.time?` ${e.time}`:''))} · ${escapeHtml(e.title)} <span class="badge">관리자 입력</span></div><button onclick="manageEvent('system','${e.id}')">열기</button></div></div>`).join('') || '<div class="muted">등록된 간호부 공유 일정이 없습니다.</div>'}
    </div>`;
  renderMonthCalendar('wardCalendarBox',uiYear,uiMonth,ward.id,'edit');
}
function deleteWardEvent(id){ const ward=getCurrentWard(); ward.calendarEvents=ward.calendarEvents.filter(e=>e.id!==id); saveData(); renderApp(); }


function syncFromStorageSilently(){
  // Firebase 사용 시 localStorage는 임시 백업일 뿐입니다. 다른 탭 변경은 Firebase watchFirebaseData에서 반영합니다.
  if(window.nurseDb) return;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw || raw===lastSavedSnapshot) return;
    const incoming = JSON.parse(raw);
    if(!incoming) return;
    data = incoming;
    ensureDataDefaults();
    ensureShiftCodeWorkTypeConsistency();
    lastSavedSnapshot = raw;
    if(currentUser){
      if(currentUser.role==='ward'){
        const refreshedUser = (data.users||[]).find(u=>u.loginId===currentUser.loginId && u.password===currentUser.password);
        if(refreshedUser) currentUser = refreshedUser;
      } else {
        const refreshedAdmin = (data.users||[]).find(u=>u.loginId===currentUser.loginId && u.role==='admin');
        if(refreshedAdmin) currentUser = refreshedAdmin;
      }
      renderApp();
      popup('다른 화면의 변경사항이 자동 반영되었습니다.');
    }
  }catch(e){}
}

window.addEventListener('storage', function(e){
  if(e.key===STORAGE_KEY){ syncFromStorageSilently(); }
});

setInterval(function(){
  syncFromStorageSilently();
}, 1500);


function toggleTimeSelectMode(sel, forceOpen){
  if(!sel) return;
  if(forceOpen){
    sel.classList.remove('time-select-collapsed');
    sel.classList.add('time-select-open');
    sel.setAttribute('size','4');
  } else {
    sel.classList.remove('time-select-open');
    sel.classList.add('time-select-collapsed');
    sel.removeAttribute('size');
  }
}
function attachTimeSelectBehavior(){
  document.querySelectorAll('select[data-time-select="1"]').forEach(function(sel){
    if(sel.dataset.bound === '1') return;
    sel.dataset.bound = '1';
    toggleTimeSelectMode(sel, false);

    sel.addEventListener('focus', function(){
      toggleTimeSelectMode(sel, true);
    });
    sel.addEventListener('mousedown', function(){
      toggleTimeSelectMode(sel, true);
    });
    sel.addEventListener('change', function(){
      toggleTimeSelectMode(sel, false);
    });
    sel.addEventListener('blur', function(){
      setTimeout(function(){ toggleTimeSelectMode(sel, false); }, 100);
    });
  });
}


window.addEventListener('error', function(e){
  const err=document.getElementById('loginError');
  if(err && !currentUser){
    err.textContent='스크립트 오류가 발생했습니다. 최신 파일로 다시 실행해 주세요.';
    err.classList.remove('hidden');
  }
});

window.onload=function(){
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('appScreen').classList.add('hidden');
};
