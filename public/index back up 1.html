          if(dailyCount(key,'N') >= maxForDay(d,'N')) continue;
          if(tryPlaceNightBlock(n,d,'nightOnlyQuota')) changed=true;
        }
      }
      if(!changed) break;
    }
  }

  // 전월 마지막 OFF 이후 이어진 N 흐름은 다른 배정 원칙보다 먼저 확정하고, Night 라인을 가장 먼저 생성합니다.
  enforceCarriedNightContinuity();
  enforceNightRecoveryOffBlocks();
  fillNightFirst();
  fillNightOnlyMonthlyQuota();
  repairNightRotationByBlockSwaps();

  // 1) 공통 자연어 생성원칙은 사용하지 않고, 수간호사 작성 순서 기반 고정 엔진으로 실행합니다.
  // 원티드/휴가 잠금 -> N 우선 -> N 후 OFF -> D 최소 -> E 최소 -> 균형 보정 순서입니다.
  fillMinimumStaffing();
  repairNewNotAlone();
  fillRemainingWithWork();
  reduceAboveMinimumForOffTarget();
  balanceOffBySwaps();
  balanceOffByChainSwaps();
  addWorkForOverOffUpToMax();
  if(opt.balanceDEN) balanceDEN();
  repairNewNotAlone();
  balanceOffBySwaps();
  balanceOffByChainSwaps();
  addWorkForOverOffUpToMax();

  // 2) 최종 강제 수리: 절대 제한 위반 제거 후, 최소인원만 다시 보충
  function repairHardConstraints(){
    for(let pass=0; pass<6; pass++){
      let changed=false;
      for(let d=1; d<=last; d++){
        const key=makeDateKey(y,m,d), dtype=getDateType(y,m,d);
        nurses.forEach(n=>{
          const code=schedule[key]?.[n.id]||'';
          if(workCodes.includes(code) && isRestricted(n,dtype)){ schedule[key][n.id]='OF'; changed=true; }
          if(code && workCodes.includes(code) && !allAllowedCodes(n).includes(code)){ schedule[key][n.id]='OF'; changed=true; }
        });
        ['D','E'].forEach(shift=>{
          while(staffingCount(key,shift) < minForDay(d,shift)){
            const candidates=nurses.filter(n=>isOff(schedule[key]?.[n.id]) && canPlace(n,shift,d,'minimum',true)).sort((a,b)=>score(a,shift,key,dtype,'minimum')-score(b,shift,key,dtype,'minimum'));
            if(!candidates.length) break;
            schedule[key][candidates[0].id]=shift;
            changed=true;
          }
        });
      }
      repairNewNotAlone();
      if(!changed) break;
    }
  }
  repairHardConstraints();
  fillNightFirst();
  reduceAboveMinimumForOffTarget();
  balanceOffBySwaps();
  balanceOffByChainSwaps();
  addWorkForOverOffUpToMax();
  if(opt.balanceDEN) balanceDEN();
  repairNewNotAlone();
  balanceOffBySwaps();
  balanceOffByChainSwaps();
  addWorkForOverOffUpToMax();
  repairHardConstraints();
  enforceCarriedNightContinuity();
  enforceNightRecoveryOffBlocks();
  enforceNurseConfiguredHardRules();
  enforceStaffingBounds();
  enforceConsecutiveOffRules();
  fillNightFirst();
  fillNightOnlyMonthlyQuota();
  repairHardConstraints();
  enforceNightRecoveryOffBlocks();
  enforceNurseConfiguredHardRules();
  enforceStaffingBounds();
  enforceConsecutiveOffRules();
  addWorkForOverOffUpToMax();
  enforceNightRecoveryOffBlocks();
  enforceNurseConfiguredHardRules();
  enforceStaffingBounds();
  enforceConsecutiveOffRules();
  // 최종 단계에서도 모든 N 묶음 뒤 보호 OFF를 다시 잠급니다.
  for(let pass=0; pass<3; pass++){
    const changedRecovery=enforceNightRecoveryOffBlocks();
    const changedHard=enforceNurseConfiguredHardRules();
    const changedStaff=enforceStaffingBounds();
    if(!changedRecovery && !changedHard && !changedStaff) break;
  }
  // 최종 확정 직전에는 병동 수간호사의 D/E/N 최소 인원을 마지막으로 보정합니다.
  // N 후 OFF 2개는 기본 원칙이지만, 그 때문에 근무인원이 부족해지는 경우에는 근무인원 충족을 우선합니다.
  enforceStaffingBounds();



  function absoluteStaffingCandidateCanPlace(n, shift, day, relaxed=false){
    const key=makeDateKey(y,m,day), dtype=getDateType(y,m,day);
    const existing=String(schedule[key]?.[n.id]||'').toUpperCase();
    // AL/SL/교육성 고정휴가는 절대 깨지 않습니다. WO는 월 기준OFF에 포함되는 요청일 뿐이므로,
    // 정말 근무 최소인원이 부족할 때에는 마지막 후보로만 전환 가능합니다.
    if(['AL','SL'].includes(existing)) return false;
    if(workCodes.includes(existing) && existing!==shift) return false;
    if(!allAllowedCodes(n).includes(shift)) return false;
    if(isRestricted(n,dtype)) return false;
    if(['D','E','N'].includes(shift) && dailyCount(key,shift) >= maxForDay(day,shift) && existing!==shift) return false;

    const prevCode=prevCodeAt(day,n.id);
    if(!relaxed){
      const maxC=getNurseNumberSetting(n,'maxConsecutiveDays',data.commonScheduleSettings?.defaultMaxConsecutiveDays ?? 5);
      const maxNs=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3);
      const maxN=effectiveMonthlyMaxNight(n);
      if(opt.enforcePreviousMonthTransition && violatesWorkTypeTransition(n, prevCode, shift)) return false;
      if(maxC>0 && consecutiveIf(n,day,shift)>maxC) return false;
      if(shift==='N'){
        if(maxN<=0 || maxNs===0) return false;
        const stats=statNow();
        if((stats[n.id]?.nights||0) >= maxN && existing!=='N') return false;
        if(maxNs>0 && nightStreakIf(n,day,shift)>maxNs) return false;
      }
    } else {
      // 완화 모드는 "근무 인원 최소값"을 맞추기 위한 마지막 수단입니다.
      // 개인별 가능 근무코드/상근/데이킵/고정휴가는 여전히 깨지 않습니다.
      if(shift==='N'){
        const maxNs=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3);
        if(maxNs===0) return false;
      }
    }
    return true;
  }

  function absoluteStaffingCandidateScore(n, shift, day){
    const key=makeDateKey(y,m,day);
    const cur=String(schedule[key]?.[n.id]||'').toUpperCase();
    let p=0;
    if(cur==='') p-=300;
    if(cur==='O' || cur==='OF') p-=180;
    if(isLockedOff(day,n.id)) p+=250; // N 후 회복 OFF는 되도록 보존
    if(cur==='WO') p+=900;            // 원티드 OFF는 월 기준OFF 안에 포함되지만 마지막 후보
    p += score(n,shift,key,getDateType(y,m,day),'absoluteMinimum');
    return p;
  }

  function enforceAbsoluteMinimumStaffingFinal(){
    // 대원칙: D/E/N 최소인원 부족은 최종 결과에 남기지 않습니다.
    // 단, 개인별 가능 근무코드와 AL/SL 고정휴가는 깨지 않습니다.
    let changed=false;
    for(let pass=0; pass<8; pass++){
      let passChanged=false;
      for(let d=1; d<=last; d++){
        const key=makeDateKey(y,m,d);
        for(const shift of ['N','D','E']){
          let guard=0;
          while(staffingCount(key,shift) < minForDay(d,shift) && guard++ < nurses.length+10){
            let candidates=nurses
              .filter(n=>isOff(schedule[key]?.[n.id]||''))
              .filter(n=>absoluteStaffingCandidateCanPlace(n,shift,d,false))
              .sort((a,b)=>absoluteStaffingCandidateScore(a,shift,d)-absoluteStaffingCandidateScore(b,shift,d));
            if(!candidates.length){
              candidates=nurses
                .filter(n=>isOff(schedule[key]?.[n.id]||''))
                .filter(n=>absoluteStaffingCandidateCanPlace(n,shift,d,true))
                .sort((a,b)=>absoluteStaffingCandidateScore(a,shift,d)-absoluteStaffingCandidateScore(b,shift,d));
            }
            if(!candidates.length) break;
            schedule[key][candidates[0].id]=shift;
            changed=true; passChanged=true;
          }
        }
      }
      // 근무 최소인원 보정 후 N 묶음 회복 OFF를 다시 잠그되,
      // 다음 pass에서 근무 최소인원이 다시 부족하면 다시 근무를 우선합니다.
      enforceNightRecoveryOffBlocks();
      if(!passChanged) break;
    }
    return changed;
  }

  function enforceNightKeepMonthlyTargetFinal(){
    // 나이트킵은 월간 N 목표를 먼저 확보해야 합니다. 30일=15, 31일=16가 기본이며,
    // 근무자별 N 최대값 입력과 무관하게 자동계산 목표를 사용합니다.
    let changed=false;
    const nightKeepers=nurses.filter(isNightOnlyNurse);
    for(const n of nightKeepers){
      const target=effectiveMonthlyMaxNight(n);
      if(target<=0) continue;
      let safety=0;
      while((statNow()[n.id]?.nights||0) < target && safety++ < last*3){
        let placed=false;
        const days=[...Array(last)].map((_,i)=>i+1).sort((a,b)=>{
          const ka=makeDateKey(y,m,a), kb=makeDateKey(y,m,b);
          const ca=String(schedule[ka]?.[n.id]||'').toUpperCase();
          const cb=String(schedule[kb]?.[n.id]||'').toUpperCase();
          const pa=(ca==='WO'?900:0)+(isLockedOff(a,n.id)?250:0)+dailyCount(ka,'N')*30+a/100;
          const pb=(cb==='WO'?900:0)+(isLockedOff(b,n.id)?250:0)+dailyCount(kb,'N')*30+b/100;
          return pa-pb;
        });
        for(const d of days){
          const key=makeDateKey(y,m,d);
          const cur=String(schedule[key]?.[n.id]||'').toUpperCase();
          if(['AL','SL','WO','HA','HP'].includes(cur)) continue;
          if(!isOff(cur)) continue;
          if(dailyCount(key,'N')>=maxForDay(d,'N')) continue;
          if(tryPlaceNightBlock(n,d,'nightKeepTarget')){ placed=true; changed=true; break; }
        }
        if(!placed){
          for(const d of days){
            const key=makeDateKey(y,m,d);
            const cur=String(schedule[key]?.[n.id]||'').toUpperCase();
            if(['AL','SL','WO','HA','HP'].includes(cur)) continue;
            if(!isOff(cur)) continue;
            if(absoluteStaffingCandidateCanPlace(n,'N',d,true)){
              schedule[key][n.id]='N';
              placed=true; changed=true; break;
            }
          }
        }
        if(!placed) break;
        enforceNightRecoveryOffBlocks();
      }
    }
    return changed;
  }


  function emergencyCanTakeNight(n, day, options={}){
    const key=makeDateKey(y,m,day), dtype=getDateType(y,m,day);
    const existing=String(schedule[key]?.[n.id]||'').toUpperCase();
    if(['AL','SL','HA','HP'].includes(existing)) return false;
    if(!allAllowedCodes(n).includes('N')) return false;
    if(isRestricted(n,dtype)) return false;
    const maxNs=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3);
    if(maxNs===0) return false;
    // 긴급 N 보정에서는 N 텀/월간 N 상한/회복 OFF 잠금은 완화합니다.
    // 단, 개인이 N 자체가 불가능하거나 고정휴가인 경우는 건드리지 않습니다.
    const emergencyMaxNs=Math.max(1, Math.min(3, Math.max(maxNs, Number(options.maxConsecutiveNight||0) || maxNs || 3)));
    if(nightStreakIf(n,day,'N')>emergencyMaxNs) return false;
    if(existing && !isOff(existing) && existing!=='N') return false;
    return true;
  }

  function emergencyNightCandidateScore(n, day){
    const key=makeDateKey(y,m,day);
    const cur=String(schedule[key]?.[n.id]||'').toUpperCase();
    const st=statNow()[n.id]||{};
    const c=getNurseConstraints(n);
    let s=0;
    // OFF/공백을 우선 N으로 전환합니다. 원티드 OFF는 마지막 후보입니다.
    if(cur==='') s-=300;
    if(cur==='O' || cur==='OF') s-=220;
    if(cur==='WO') s+=900;
    if(isLockedOff(day,n.id)) s+=150; // 그래도 필요하면 풀 수 있음
    if(c.isNew) s-=120;              // 신규도 설정된 N 경험을 쌓도록 배제하지 않음
    if(isNightOnlyNurse(n)) s-=80;
    s += Number(st.nights||0)*40;
    s += stableNurseTie(n);
    return s;
  }

  function forceNightMinimumByRemovingOff(){
    // 3단계 핵심: 날짜별 N 최소인원은 반드시 0 부족으로 만들기 위한 최후 보정입니다.
    // 방법: OFF/공백/WO를 순서대로 풀고, N 텀과 월간 N 상한은 완화합니다.
    let changed=false;
    for(let pass=0; pass<10; pass++){
      let passChanged=false;
      for(let d=1; d<=last; d++){
        const key=makeDateKey(y,m,d);
        let guard=0;
        while(staffingCount(key,'N') < minForDay(d,'N') && guard++ < nurses.length+5){
          const candidates=nurses
            .filter(n=>isOff(schedule[key]?.[n.id]||''))
            .filter(n=>dailyCount(key,'N') < maxForDay(d,'N'))
            .filter(n=>emergencyCanTakeNight(n,d,{maxConsecutiveNight:3}))
            .sort((a,b)=>emergencyNightCandidateScore(a,d)-emergencyNightCandidateScore(b,d));
          if(!candidates.length) break;
          schedule[key][candidates[0].id]='N';
          changed=true; passChanged=true;
        }
      }
      if(!passChanged) break;
    }
    return changed;
  }

  function enforceNewNurseConfiguredNightMinimum(){
    // 신규 간호사라도 근무자 설정에서 N 가능 + 월 N 개수가 입력되어 있으면 최소 3개까지는 경험 배치합니다.
    // 기존 N 근무자와 1:1 교환하여 날짜별 N 최소/최대 인원은 유지합니다.
    let changed=false;
    const newTargets=nurses.filter(n=>getNurseConstraints(n).isNew && allAllowedCodes(n).includes('N'));
    for(const n of newTargets){
      const configured=getNurseNumberSetting(n,'maxNightPerMonth',0);
      const target=Math.min(3, Math.max(0, configured));
      if(target<=0) continue;
      let safety=0;
      while((statNow()[n.id]?.nights||0) < target && safety++ < last*2){
        let placed=false;
        const days=[...Array(last)].map((_,i)=>i+1).sort((a,b)=>{
          const ca=String(schedule[makeDateKey(y,m,a)]?.[n.id]||'').toUpperCase();
          const cb=String(schedule[makeDateKey(y,m,b)]?.[n.id]||'').toUpperCase();
          return ((ca==='WO'?900:0)+(isLockedOff(a,n.id)?100:0)+a/100) - ((cb==='WO'?900:0)+(isLockedOff(b,n.id)?100:0)+b/100);
        });
        for(const d of days){
          const key=makeDateKey(y,m,d);
          if(!isOff(schedule[key]?.[n.id]||'')) continue;
          if(!emergencyCanTakeNight(n,d,{maxConsecutiveNight:3})) continue;
          // 1) N 최대인원 여유가 있으면 바로 추가
          if(dailyCount(key,'N') < maxForDay(d,'N')){
            schedule[key][n.id]='N'; changed=true; placed=true; break;
          }
          // 2) 여유가 없으면 기존 N 근무자 중 N이 많은 사람을 OFF로 빼고 신규를 N으로 교환
          const donors=nurses
            .filter(x=>x.id!==n.id && schedule[key]?.[x.id]==='N')
            .filter(x=>!isNightOnlyNurse(x))
            .sort((a,b)=>Number((statNow()[b.id]||{}).nights||0)-Number((statNow()[a.id]||{}).nights||0));
          if(donors.length){
            schedule[key][donors[0].id]='OF';
            schedule[key][n.id]='N';
            changed=true; placed=true; break;
          }
        }
        if(!placed) break;
      }
    }
    return changed;
  }

  function finalNightShortageZeroRepair(){
    // N 회복 OFF를 다시 잠근 뒤 N 부족이 생기는 문제를 막기 위해, 검증 직전 마지막으로 실행합니다.
    // 여기서는 N 부족 해소가 최우선이며, 회복 OFF/텀은 로그상 완화된 것으로 간주합니다.
    let changed=false;
    changed = enforceNewNurseConfiguredNightMinimum() || changed;
    changed = forceNightMinimumByRemovingOff() || changed;
    return changed;
  }

  function validateSchedule(){
    const issues=[];
    for(let d=1; d<=last; d++){
      const key=makeDateKey(y,m,d), dtype=getDateType(y,m,d);
      ['D','E','N'].forEach(shift=>{
        const cnt=dailyCount(key,shift);
        const minCnt=staffingCount(key,shift);
        if(minCnt < minForDay(d,shift)) issues.push(`${key} ${shift} 필수 인원 미충족 - 가능한 후보 부족 (${cnt}/${minForDay(d,shift)})`);
        if(maxForDay(d,shift)!==Infinity && cnt > maxForDay(d,shift)) issues.push(`${key} ${shift} 최대인원 초과 (${cnt}/${maxForDay(d,shift)})`);
      });
      nurses.forEach(n=>{
        const code=schedule[key]?.[n.id]||'';
        const c=getNurseConstraints(n);
        if(workCodes.includes(code) && isRestricted(n,dtype)) issues.push(`${key} ${n.name} 배치기준 위반 (${code})`);
        if(workCodes.includes(code) && !allAllowedCodes(n).includes(code)) issues.push(`${key} ${n.name} 근무유형 위반 (${code})`);
        if(c.isNew && ['D','E','N'].includes(code) && experiencedCount(key,code)===0) issues.push(`${key} ${n.name} 신규 단독근무 위험 (${code})`);
        if(opt.enforcePreviousMonthTransition && d===1){
          const prev=getPreviousMonthLastCode(ward,n.id,y,m);
          if(violatesWorkTypeTransition(n,prev,code)) issues.push(`${key} ${n.name} 전달 마지막 근무 연속성 위반 (${prev}→${code})`);
        }
      });
    }
    nurses.forEach(n=>{
      const minNs=getNurseNumberSetting(n,'minConsecutiveNight',data.commonScheduleSettings?.defaultMinConsecutiveNight ?? 0);
      const maxNs=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3);
      let streak=previousNightStreakBeforeMonth(n), start=streak>0 ? '전월말' : 0;
      for(let d=1; d<=last+1; d++){
        const c=d<=last ? String(codeAt(d,n.id)||'').toUpperCase() : '';
        if(c==='N'){
          if(streak===0) start=d;
          streak++;
        } else if(streak>0){
          const label = start==='전월말' ? `${n.name} 전월 말부터 이어진 연속 N` : `${makeDateKey(y,m,start)} ${n.name} 연속 N`;
          if(minNs>0 && streak<minNs) issues.push(`${label} 최소 미달 (${streak}/${minNs})`);
          if(maxNs>0 && streak>maxNs) issues.push(`${label} 최대 초과 (${streak}/${maxNs})`);
          streak=0; start=0;
        }
      }
    });
    nurses.forEach(n=>{
      for(let d=1; d<=last; d++){
        const c=String(codeAt(d,n.id)||'').toUpperCase();
        if(c==='N' && isWithinNightRestGap(n,d)){
          const gap=nurseNightReentryGapDays(n);
          issues.push(`${makeDateKey(y,m,d)} ${n.name} N 재배치 텀 부족${gap?` (설정 ${gap}일)`:''}`);
        }
        if(c==='N' && d<last){
          const next=String(codeAt(d+1,n.id)||'').toUpperCase();
          if(next==='D' || next==='E') issues.push(`${makeDateKey(y,m,d+1)} ${n.name} N 다음날 ${next} 배정 금지`);
        }
      }
      // N 묶음 종료 후에는 월 위치와 무관하게 설정된 보호 OFF 개수를 반드시 확인합니다.
      const rest=nightRestDaysAfterBlock();
      let streak=previousNightStreakBeforeMonth(n);
      for(let d=1; d<=last+1; d++){
        const c=d<=last ? String(codeAt(d,n.id)||'').toUpperCase() : '';
        if(c==='N'){ streak++; continue; }
        if(streak>0){
          const blockEnd=d-1;
          for(let r=1; r<=rest; r++){
            const checkDay=blockEnd+r;
            if(checkDay>=1 && checkDay<=last){
              const after=String(codeAt(checkDay,n.id)||'').toUpperCase();
              if(!isOff(after)){
                issues.push(`${makeDateKey(y,m,checkDay)} ${n.name} N 종료 후 보호 OFF 부족 (${r}/${rest})`);
              }
            }
          }
          streak=0;
        }
      }
    });
    nurses.forEach(n=>{
      const minOff=getNurseNumberSetting(n,'minConsecutiveOff',data.commonScheduleSettings?.defaultMinConsecutiveOff ?? 1);
      const maxOff=getNurseNumberSetting(n,'maxConsecutiveOff',data.commonScheduleSettings?.defaultMaxConsecutiveOff ?? 3);
      let streak=0, start=0;
      for(let d=1; d<=last+1; d++){
        const c=d<=last ? String(codeAt(d,n.id)||'').toUpperCase() : '';
        if(d<=last && isOff(c)){
          if(streak===0) start=d;
          streak++;
        } else if(streak>0){
          if(minOff>1 && streak<minOff) issues.push(`${makeDateKey(y,m,start)} ${n.name} 연속 OFF 최소 미달 (${streak}/${minOff})`);
          if(maxOff>0 && streak>maxOff) issues.push(`${makeDateKey(y,m,start)} ${n.name} 연속 OFF 최대 초과 (${streak}/${maxOff})`);
          streak=0; start=0;
        }
      }
    });
    if(opt.balanceDEN){
      const stats=statNow();
      ['D','E','N'].forEach(shift=>{
        const vals=nurses.filter(n=>allAllowedCodes(n).includes(shift)&&!getNurseConstraints(n).reduceNight).map(n=> shift==='D' ? (stats[n.id]?.days||0) : shift==='E' ? (stats[n.id]?.evenings||0) : (stats[n.id]?.nights||0));
        if(vals.length>1 && Math.max(...vals)-Math.min(...vals)>2) issues.push(`${shift} 균등 분배 확인 필요 (${Math.min(...vals)}~${Math.max(...vals)})`);
      });
    }
    issues.push(...collectSkillMixIssues(schedule,nurses,y,m,ward));
    return issues;
  }
  // 최종 대원칙 보정: 나이트킵 월간 목표와 D/E/N 최소인원을 마지막에 다시 맞춥니다.
  enforceNightKeepMonthlyTargetFinal();
  enforceAbsoluteMinimumStaffingFinal();
  repairNightRotationByBlockSwaps();
  enforceNurseConfiguredHardRules();
  enforceAbsoluteMinimumStaffingFinal();
  repairNightRotationByBlockSwaps();
  finalNightShortageZeroRepair();
  const preceptorMirrorResult = applyPreceptorMirroring(schedule, ward, y, m);
  const finalOffBalanceResult = applyStrictOffBalance(schedule, ward, y, m, {skipTraineeMirror:false});
  const preceptorMirrorResult2 = applyPreceptorMirroring(schedule, ward, y, m);
  if(preceptorMirrorResult.trainees.length || preceptorMirrorResult2.trainees.length){ warnings.push(`프리셉터 동반배치 반영: ${[...(preceptorMirrorResult.trainees||[]), ...(preceptorMirrorResult2.trainees||[])].filter((v,i,a)=>a.indexOf(v)===i).join(', ')}`); }
  if(finalOffBalanceResult.unresolved && finalOffBalanceResult.unresolved.length){ warnings.push(`OFF 균형 추가 확인: ${finalOffBalanceResult.unresolved.slice(0,8).join(' / ')}`); }
  warnings.push(...validateSchedule());
  const stats=statNow();
  return {schedule,warnings:[...new Set(warnings)],stats,targetOff,baseOff,addOff};
}

async function login(){
  const id=document.getElementById('loginId').value.trim();
  const pw=document.getElementById('loginPw').value;
  const err=document.getElementById('loginError');
  const status=document.getElementById('loginStatus');
  const btn=document.querySelector('#loginScreen button.primary');
  if(btn){ btn.disabled=true; btn.textContent='로그인 중...'; }
  if(err) err.classList.add('hidden');
  if(status){
    status.textContent='로그인 중입니다. 저장된 병동 데이터를 불러오고 있어요.';
    status.classList.remove('hidden');
  }

  try{
    setLoginStatusMessage('저장된 병동 데이터를 불러오는 중입니다. 잠시만 기다려 주세요.');
    const firebaseOk = await ensureFirebaseReady();
    if(!firebaseOk){
      console.warn('Firebase 연결 실패: localStorage 백업 데이터로 로그인 검사를 계속합니다.', window.nurseFirebaseError || 'unknown');
      if(err){
        err.textContent='Firebase 연결이 지연되어 이 PC의 임시저장 데이터로 먼저 로그인합니다. 원격 공동 사용은 Firebase 연결 후 저장됩니다.';
        err.classList.remove('hidden');
      }
    } else if(err) {
      err.classList.add('hidden');
    }
    ensureDataDefaults();
    ensureShiftCodeWorkTypeConsistency();

    const idLower=id.toLowerCase();
    const user=(data.users||[]).find(u=>
      String(u.loginId||'').toLowerCase()===idLower &&
      String(u.password||'')===pw
    );

    if(!user){
      if(status) status.classList.add('hidden');
      if(err){
        err.textContent='아이디 또는 비밀번호가 올바르지 않습니다.';
        err.classList.remove('hidden');
      } else {
        alert('아이디 또는 비밀번호가 올바르지 않습니다.');
      }
      return;
    }

    if(user.role==='ward' && !getWardById(user.wardId)){
      if(status) status.classList.add('hidden');
      if(err){
        err.textContent='계정에 연결된 부서를 찾을 수 없습니다. 전체 관리자에서 병동/계정 연결을 확인하세요.';
        err.classList.remove('hidden');
      }
      return;
    }

    currentUser=user;
    nurseDraftState={};
    scheduleDraftState={};
    activeTab = (user.role==='admin' ? 'admin-calendar' : 'ward-calendar');
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    renderApp();
  }catch(e){
    console.error(e);
    if(status) status.classList.add('hidden');
    if(err){
      err.textContent='로그인 중 오류가 발생했습니다. Firebase 연결과 DB 권한을 확인하세요.';
      err.classList.remove('hidden');
    }
  }finally{
    if(status && !document.getElementById('loginScreen').classList.contains('hidden')) status.classList.add('hidden');
    if(btn){ btn.disabled=false; btn.textContent='로그인'; }
  }
}

function renderApp(){
  ensureHolidaySeedsForVisibleYear();
  (data.wards||[]).forEach(w=>syncAdditionalOffCountFromHolidayEntries(w, uiYear, uiMonth));
  const isAdmin=currentUser.role==='admin';
  document.getElementById('appTitle').textContent=isAdmin?'전체 관리자 페이지':'병동 관리자 페이지';
  document.getElementById('appSubtitle').textContent=isAdmin?`${currentUser.name} · 병동/계정/근무코드/공유일정/요청승인 관리`:`${currentUser.name} · ${(getCurrentWard()?.name || '연결 부서 없음')} 전용`;
  renderTopStats();
  renderTabs();
  hideSections();

  if(isAdmin){
    if(!activeTab || activeTab.startsWith('ward-') || activeTab==='admin-generate') activeTab='admin-calendar';
    const sec=document.getElementById('tab-'+activeTab);
    if(sec) sec.classList.remove('hidden');
    renderAdminOverview();
    renderAdminWards();
    renderAdminCodes();

    renderWardCalendar();
    renderWardSchedule();
    renderWardScheduleArchive();
    renderWardLeave();
    renderWardNurses();
    renderWardChange();
    if(typeof attachTimeSelectBehavior==='function') attachTimeSelectBehavior();
  }
}

function renderMonthCalendar(containerId, y, m, wardId=null, mode='view'){
  const last=daysInMonth(y,m), firstDow=new Date(y,m-1,1).getDay();
  let cells=[];
  for(let i=0;i<firstDow;i++) cells.push('<div class="daycell"></div>');
  for(let d=1;d<=last;d++){
    const key=makeDateKey(y,m,d);
    const holidayMemo=getHolidayMemoByDate(key);
    let tags=`<div class="daymeta">${holidayMemo ? `<span class="holiday-note">${escapeHtml(holidayMemo)}</span>` : ''}</div>`;
    const systemEvents=(data.systemEvents||[]).filter(e=>e.date===key);
    const sharedWardEvents=getSharedWardEvents().filter(e=>e.date===key);
    const wardObj=wardId?getWardById(wardId):null;
    const ownWardPrivateEvents=wardObj ? (wardObj.calendarEvents||[]).filter(e=>e.date===key && !e.shareAll) : [];
    const eventHtml=[
      ...systemEvents.map(e=>`<div class="event hospital" onclick="manageEvent('system','${e.id}')" title="클릭하여 수정/삭제">${escapeHtml(formatEventLabel(e))}</div>`),
      ...sharedWardEvents.map(e=>`<div class="event shared" onclick="${currentUser && currentUser.role==='admin' ? `manageEvent('ward','${e.id}','${e.sourceWardId}')` : (wardId===e.sourceWardId ? `manageEvent('ward','${e.id}','${e.sourceWardId}')` : 'return false')}" title="${currentUser && currentUser.role==='admin' ? '클릭하여 수정/삭제' : (wardId===e.sourceWardId ? '클릭하여 수정/삭제' : '공유 일정')}">${escapeHtml(formatEventLabel(e))}</div>`),
      ...ownWardPrivateEvents.map(e=>`<div class="event" onclick="manageEvent('ward','${e.id}','${wardId||''}')" title="클릭하여 수정/삭제">${escapeHtml(formatEventLabel(e))}</div>`)
    ].join('');
    let addBox='';
    if(mode==='edit'){
      addBox=`<button aria-label="일정 추가" title="클릭하여 일정 추가" style="width:100%;height:18px;opacity:0;border:0;background:transparent;padding:0;margin:0" onclick="openEventPrompt('${key}','${wardId||''}','${containerId.includes('admin')?'admin':'ward'}')"></button>`;
    }
    cells.push(`<div class="daycell" ${mode==='edit' ? `onclick="if(event.target===this||event.target.tagName==='DIV'){openEventPrompt('${key}','${wardId||''}','${containerId.includes('admin')?'admin':'ward'})}"` : ''}><div class="daynum ${getDayNumberClass(y,m,d)}">${d}</div>${tags}${eventHtml}${addBox}</div>`);
  }
  document.getElementById(containerId).innerHTML=`
    <div class="calendar">
      <div class="calendar-head">
        <div class="date-sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="date-sat">토</div>
      </div>
      <div class="calendar-grid">${cells.join('')}</div>
    </div>`;
  attachTimeSelectBehavior();
}

function openModal(title, bodyHtml, buttons){
  const root=document.getElementById('modalRoot');
  root.className='';
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal-card" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}">
        <div class="modal-header">
          <div class="modal-title">${title}</div>
          <button type="button" class="modal-close" onclick="closeModal()" aria-label="닫기">×</button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-actions" id="modalActions"></div>
      </div>
    </div>`;
  const actions=root.querySelector('#modalActions');
  (buttons||[]).forEach((btn, idx)=>{
    const b=document.createElement('button');
    b.textContent=btn.label;
    if(btn.primary) b.className='primary';
    b.onclick=()=>{
      if(btn.action==='close') closeModal();
      else if(typeof btn.action==='function') btn.action();
    };
    actions.appendChild(b);
  });
  document.onkeydown=function(ev){
    if(ev.key==='Escape') closeModal();
  };
}
function closeModal(){
  const root=document.getElementById('modalRoot');
  root.className='hidden';
  root.innerHTML='';
  document.onkeydown=null;
}



function normalizeTimeInput(v){
  const s = String(v||'').trim();
  if(!s) return '';
  const m = s.match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  let h = Number(m[1]), mm = Number(m[2]);
  if(h<0 || h>23 || mm<0 || mm>59) return null;
  return `${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}

  return [...systemEvents, ...wardShared];

function onGenerationRuleDrop(targetId, ev){
  ev.preventDefault();
  const dropEl = ev.currentTarget;
  if(dropEl) dropEl.classList.remove('drag-over');
  const sourceId = draggedGenerationRuleId || (function(){ try { return ev.dataTransfer.getData('text/plain'); } catch(e){ return ''; } })();
  if(!sourceId || sourceId===targetId) return;
  const list = getSortedGenerationRules().map(r=>r.id);
  const from = list.indexOf(sourceId);
  const to = list.indexOf(targetId);
  if(from===-1 || to===-1) return;

  list.splice(to,0,moved);
  persistGenerationRuleOrderFromList(list);
  draggedGenerationRuleId = null;

  popup('공통 생성 원칙 순서가 변경되었습니다.');

function normalizeRuleTextForCode(text){
  return String(text||'').toLowerCase().replace(/[\s,./·ㆍ()\[\]{}_:;~!@#$%^&*+=|\\?"'<>-]/g,'');
}
function getGenerationRuleCommand(rule){
  const name=normalizeRuleTextForCode((rule&&rule.name)||'');
  const key=String((rule&&rule.key)||'');
  if(key && !key.startsWith('customRule_')) return key;
  if(name.includes('전달마지막근무') || name.includes('전달') || name.includes('e→d') || name.includes('n→d') || name.includes('n→e')) return 'enforcePreviousMonthTransition';
  if(name.includes('근무유형') || name.includes('배치기준') || name.includes('절대위반') || name.includes('절대위반하지')) return 'hardConstraints';
  if(name.includes('원티드') || name.includes('wanted')) return 'wantedOffFirst';
  if(name.includes('신규') && name.includes('최소인원') && (name.includes('제외') || name.includes('포함시키지'))) return 'excludeNewFromMinimum';
  if(name.includes('신규') && (name.includes('단독') || name.includes('혼자'))) return 'enforceNewNotAlone';
  if(name.includes('기준off') || name.includes('기준오프') || name.includes('남은일자') || name.includes('남는인원') || name.includes('근무로채우기')) return 'fillRemainingWithWork';
  if(name.includes('최소인원') || name.includes('근무shift') || name.includes('shift최소')) return 'enforceMinStaffing';
  if(name.includes('3교대') || name.includes('den') || name.includes('d/e/n') || name.includes('균등')) return 'balanceDEN';
  if(name.includes('팀별')) return 'balanceTeams';
  if(name.includes('off초과') || name.includes('오프초과') || name.includes('초과허용')) return 'allowWantedOffOverTarget';
  return key || 'customRule';
}
function getActiveGenerationRuleCommands(){
  const result={};
  (getSortedGenerationRules()||[]).filter(r=>r.enabled!==false).forEach(r=>{
    const cmd=getGenerationRuleCommand(r);
    if(cmd && cmd!=='customRule') result[cmd]=true;
  });
  const css=data.commonScheduleSettings||{};
  Object.keys(css).forEach(k=>{ if(css[k]!==false) result[k]=true; });
  return result;
}

function getSortedGenerationRules(){

function moveGenerationRule(id, direction){

function normalizeNurseSkillProfile(n){
  if(!n) return n;
  const legacyNew = !!(n.isNewNurse || (Array.isArray(n.placementRuleIds) && n.placementRuleIds.includes('pl-new')) || (Array.isArray(n.selectedPlacementRules) && n.selectedPlacementRules.includes('pl-new')));
  if(!n.skillLevel) n.skillLevel = legacyNew ? 'LV1' : 'LV3';
  n.skillLevel = String(n.skillLevel||'LV3').toUpperCase();
  if(!['LV1','LV2','LV3','LV4','LV5'].includes(n.skillLevel)) n.skillLevel='LV3';
  if(!Array.isArray(n.skillTags)){
    n.skillTags = String(n.skillTags||'').split(',').map(x=>x.trim()).filter(Boolean);
  }
  n.skillTags = n.skillTags.filter(t=>!['특수파트가능','나이트숙련'].includes(String(t||'')));

  // v14.1.22: 신규 여부는 체크박스가 아니라 레벨 LV1 하나로만 판단합니다.
  // 예전 pl-new 배치기준/신규 체크값은 LV1로 이관하고, 이후 생성 로직은 skillLevel만 봅니다.
  n.isNewNurse = (n.skillLevel === 'LV1');
  if(n.isNewNurse){
    if(!n.skillTags.includes('신규교육중')) n.skillTags.push('신규교육중');
  } else {
    n.skillTags = n.skillTags.filter(t=>t !== '신규교육중');
  }
  if(Array.isArray(n.placementRuleIds)) n.placementRuleIds = n.placementRuleIds.filter(id=>id !== 'pl-new');
  if(Array.isArray(n.selectedPlacementRules)) n.selectedPlacementRules = n.selectedPlacementRules.filter(id=>id !== 'pl-new');
  return n;
}
function isUnifiedNewNurse(n){
  return String((n&&n.skillLevel)||'').toUpperCase()==='LV1';
}

function getNurseSkillRank(n){
  const lv=String((n&&n.skillLevel)||'LV3').toUpperCase();
  const m=lv.match(/LV(\d)/);
  return m ? Number(m[1]) : 3;
}
function hasNurseSkillTag(n, tag){
  return Array.isArray(n&&n.skillTags) && n.skillTags.map(String).includes(tag);
}
function isNurseSeniorSupport(n){
  // v14.1.28: 주니어(LV1/LV2)는 일반(LV3)만으로는 안전 짝으로 보지 않습니다.
  // LV4 이상 또는 차지가능/프리셉터/교육담당 태그가 있을 때 시니어 보조 인력으로 봅니다.
  return getNurseSkillRank(n)>=4 || hasNurseSkillTag(n,'차지가능') || hasNurseSkillTag(n,'프리셉터') || hasNurseSkillTag(n,'교육담당');
}
function hasSeniorSupportPoolForShift(nurses, shift){
  const code=String(shift||'').toUpperCase();
  return (nurses||[]).some(n=>
    n && n.employmentStatus!=='leave' && n.employmentStatus!=='inactive' &&
    getAllowedCodes(n).map(c=>String(c).toUpperCase()).includes(code) &&
    (!['D','E','N','MD','SD6'].includes(code) || !isUnifiedNewNurse(n)) &&
    isNurseSeniorSupport(n)
  );
}
function shouldEnforceSeniorSupportForShift(nurses, shift){
  // 실제 병동이 LV/차지/프리셉터/교육담당 태그를 아직 입력하지 않은 상태라면
  // test3와 달리 모든 N 조합이 하드 차단됩니다. 이 경우 생성은 진행하고 점검 경고로 안내합니다.
  if(String(shift||'').toUpperCase()!=='N') return true;
  return hasSeniorSupportPoolForShift(nurses, shift);
}
function collectSkillMixIssues(schedule,nurses,y,m,ward){
  const issues=[];
  const active=(nurses||[]).filter(n=>n && n.employmentStatus!=='leave' && n.employmentStatus!=='inactive');
  const last=daysInMonth(y,m);
  const enforceNightSenior=shouldEnforceSeniorSupportForShift(active,'N');
  let hasNightAssignment=false;
  for(let d=1; d<=last; d++){
    const key=makeDateKey(y,m,d);
    ['D','E','N'].forEach(shift=>{
      const assigned=active.filter(n=>String(schedule[key]?.[n.id]||'').toUpperCase()===shift);
      if(!assigned.length) return;
      if(shift==='N') hasNightAssignment=true;
      // D/E 책임자 배치는 운영상 참고사항이지만 하드 오류로 두면
      // 최소인원/OFF 보정 자체가 멈춥니다. 불변 조건은 N 안전조합에 집중합니다.
      if(shift!=='N') return;
      const hasSenior=assigned.some(n=>isNurseSeniorSupport(n));
      const hasPreceptor=assigned.some(n=>hasNurseSkillTag(n,'프리셉터') || hasNurseSkillTag(n,'교육담당'));
      const hasNew=assigned.some(n=>getNurseSkillRank(n)===1);
      const hasJunior=assigned.some(n=>getNurseSkillRank(n)<=2);
      const juniorOnly=assigned.length>=2 && assigned.every(n=>getNurseSkillRank(n)<=2);
      if(shift==='N' && !enforceNightSenior){
        if(hasNew){
          issues.push(`${key} N 신규 교육조합 확인: 병동 근무자 명단에 시니어/프리셉터/차지가능/교육담당 태그 인원이 아직 없음`);
        }
        return;
      }
      if(juniorOnly){
        issues.push(`${key} ${shift} 위험조합: LV1/LV2 주니어끼리만 배치됨`);
        return;
      }
      if(hasJunior && !hasSenior){
        issues.push(`${key} ${shift} 위험조합: 주니어가 LV4 이상 시니어/차지가능/프리셉터/교육담당 없이 배치됨`);
      }
      if(hasNew && !hasSenior && !hasPreceptor){
        issues.push(`${key} ${shift} 신규 교육조합 확인: LV1 근무에 시니어/프리셉터 태그 인원이 없음`);
      }
      if(assigned.length>=2 && !hasSenior){
        issues.push(`${key} ${shift} 책임자 확인: LV4 이상 또는 차지가능 태그 인원이 없음`);
      }
    });
  }
  if(hasNightAssignment && !enforceNightSenior){
    issues.unshift('N 안전조합 참고: 이 병동은 시니어/차지가능/프리셉터/교육담당 태그가 없어 3단계 N 시니어 포함 조건을 경고로만 적용했습니다. 근무자 명단에서 태그를 입력하면 자동으로 하드 점검됩니다.');
  }
  return [...new Set(issues)];
}

function createWardAndUser(){

  if(!password) return alert('비밀번호를 입력하세요.');

  const wardNameNorm = wardName.toLowerCase();
  const loginNorm = loginId.toLowerCase();

  if((data.wards||[]).some(w => String(w.name||'').toLowerCase() === wardNameNorm)){
    return alert('이미 존재하는 병동명입니다.');

    nurses: [],
    calendarEvents: [],
    additionalOffByMonth: {},
    requests: [],
    leaveRequests: [],

    schedulesByMonth: {},

    staffingRules: { weekday:{D:{min:0,max:0},E:{min:0,max:0},N:{min:0,max:0}}, saturday:{D:{min:0,max:0},E:{min:0,max:0},N:{min:0,max:0}}, holiday:{D:{min:0,max:0},E:{min:0,max:0},N:{min:0,max:0}} }
  };
  const newUser = {
    id: 'user-' + Date.now(),
    role: 'ward',
    wardId: wardId,
    name: nurseName,
    loginId: loginId,
    password: password

function changeAdminPassword(){
  const current = String(document.getElementById('adminCurrentPassword')?.value || '');
  const nextPw = String(document.getElementById('adminNewPassword')?.value || '');
  const confirmPw = String(document.getElementById('adminNewPasswordConfirm')?.value || '');
  const adminUser = (data.users||[]).find(u=>u.role==='admin');
  if(!adminUser) return alert('관리자 계정을 찾을 수 없습니다.');
  if(!current) return alert('현재 비밀번호를 입력하세요.');
  if(String(adminUser.password||'') !== current) return alert('현재 비밀번호가 올바르지 않습니다.');
  if(!nextPw) return alert('새 비밀번호를 입력하세요.');
  if(nextPw !== confirmPw) return alert('새 비밀번호 확인이 일치하지 않습니다.');
  adminUser.password = nextPw;

  if(currentUser && currentUser.role==='admin'){
    currentUser.password = nextPw;
  }

  saveData(true);
  ['adminCurrentPassword','adminNewPassword','adminNewPasswordConfirm'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.value='';
  });
  popup('관리자 비밀번호가 변경되었습니다.');
  renderAdminWards();
}


function saveAdminWardsTab(){

  const newEl = document.getElementById('adminNewPassword');

  const current = String(currentEl?.value || '').trim();

  const confirmPw = String(confirmEl?.value || '').trim();

  if(current || nextPw || confirmPw){
    const adminUser = (data.users||[]).find(u=>u.role==='admin');
    if(!adminUser) return alert('관리자 계정을 찾을 수 없습니다.');
    if(String(adminUser.password||'') !== current) return alert('현재 비밀번호가 올바르지 않습니다.');
    if(!nextPw) return alert('새 비밀번호를 입력하세요.');
    if(nextPw !== confirmPw) return alert('새 비밀번호 확인이 일치하지 않습니다.');
    adminUser.password = nextPw;
    if(currentUser && currentUser.role==='admin'){

    if(currentEl) currentEl.value='';
    if(newEl) newEl.value='';
    if(confirmEl) confirmEl.value='';

function addShiftCode(){
  var codeEl=document.getElementById('newShiftCodeCode');
  var nameEl=document.getElementById('newShiftCodeName');
  var startEl=document.getElementById('newShiftCodeStart');
  var endEl=document.getElementById('newShiftCodeEnd');
  var descEl=document.getElementById('newShiftCodeDesc');
  var code=codeEl ? String(codeEl.value||'').trim() : '';
  var name=nameEl ? String(nameEl.value||'').trim() : '';
  var startTime=startEl ? String(startEl.value||'').trim() : '';
  var endTime=endEl ? String(endEl.value||'').trim() : '';
  var desc=descEl ? String(descEl.value||'').trim() : '';
  if(!code){ alert('근무코드를 입력하세요.'); return; }
  if(!name){ alert('근무코드 이름을 입력하세요.'); return; }
  if((data.shiftCodes||[]).find(s=>String(s.code||'').toLowerCase()===code.toLowerCase())){
    alert('이미 존재하는 근무코드입니다.');
    return;
  }
  if(!Array.isArray(data.shiftCodes)) data.shiftCodes=[];
  const newId='sc-'+Date.now();
  data.shiftCodes.push({id:newId, code, name, startTime, endTime, desc});
  preselectNewWorkTypeShiftCodeId=newId;
  if(codeEl) codeEl.value='';
  if(nameEl) nameEl.value='';
  if(startEl) startEl.value='';
  if(endEl) endEl.value='';
  if(descEl) descEl.value='';
  saveData(true);
  renderAdminCodes();
  popup('근무코드가 추가되었습니다.');
}
function updateShiftCodeField(id,key,value){
  const item=(data.shiftCodes||[]).find(s=>s.id===id);
  if(!item) return;
  item[key]=value;
  saveData(true);
}
function deleteShiftCode(id){
  if(!confirm('근무코드를 삭제할까요?')) return;
  data.shiftCodes=(data.shiftCodes||[]).filter(s=>s.id!==id);
  (data.workTypes||[]).forEach(w=>{
    w.allowedShiftCodeIds=(w.allowedShiftCodeIds||[]).filter(x=>x!==id);
  });
  saveData(true);
  renderAdminCodes();
  popup('근무코드가 삭제되었습니다.');
}
function addWorkType(){
  var nameEl=document.getElementById('newWorkTypeName');
  var codeEl=document.getElementById('newWorkTypeCode');
  var name=nameEl ? String(nameEl.value||'').trim() : '';
  var code=codeEl ? String(codeEl.value||'').trim() : '';
  if(!name){ alert('근무유형 이름을 입력하세요.'); return; }
  if(!code){ alert('근무유형 코드를 입력하세요.'); return; }
  const allowedShiftCodeIds=(data.shiftCodes||[])
    .filter(sc=>document.getElementById('newWT_'+sc.id)?.checked)
    .map(sc=>sc.id);
  if(allowedShiftCodeIds.length===0){ alert('포함할 근무코드를 하나 이상 선택하세요.'); return; }
  if(!Array.isArray(data.workTypes)) data.workTypes=[];
  data.workTypes.push({id:'wt-'+Date.now(), name, code, allowedShiftCodeIds, rule:{allowedShiftCodes:(data.shiftCodes||[]).filter(sc=>allowedShiftCodeIds.includes(sc.id)).map(sc=>String(sc.code||'').toUpperCase())}}); ensureWorkTypeCodesAndRules();
  if(nameEl) nameEl.value='';
  if(codeEl) codeEl.value='';
  (data.shiftCodes||[]).forEach(sc=>{ const el=document.getElementById('newWT_'+sc.id); if(el) el.checked=false; });
  preselectNewWorkTypeShiftCodeId='';
  saveData(true);
  renderAdminCodes();
  popup('근무유형이 추가되었습니다.');

function editWorkType(id){
  const item=(data.workTypes||[]).find(w=>w.id===id);
  if(!item) return;

  const options = (data.shiftCodes||[])
    .map(sc=>`<label class="check-item" style="padding:6px 10px">
      <input type="checkbox" class="editWorkTypeShift" value="${sc.id}" ${(item.allowedShiftCodeIds||[]).includes(sc.id)?'checked':''}>
      <span>${escapeHtml(sc.code)}</span>
    </label>`).join('');

  const body = `
    <div class="grid2">
      <div class="field"><div class="label">이름</div><input id="editWorkTypeName" value="${escapeHtml(item.name||'')}"></div>
      <div class="field"><div class="label">코드</div><input id="editWorkTypeCode" value="${escapeHtml(item.code||'')}"></div>
    </div>
    <div style="margin-top:12px" class="small muted">포함할 근무코드 선택</div>
    <div class="row" style="gap:8px; margin-top:8px; flex-wrap:wrap">
      ${options}
    </div>
  `;

  openModal('근무유형 수정', body, [
    {label:'닫기', action:'close'},
    {label:'저장', primary:true, action:function(){
      const name = String(document.getElementById('editWorkTypeName')?.value || '').trim();
      const code = String(document.getElementById('editWorkTypeCode')?.value || '').trim();
      const allowedShiftCodeIds = Array.from(document.querySelectorAll('.editWorkTypeShift:checked')).map(el=>el.value);
      if(!name){ alert('근무유형 이름을 입력하세요.'); return; }
      if(!code){ alert('근무유형 코드를 입력하세요.'); return; }
      if(allowedShiftCodeIds.length===0){ alert('포함할 근무코드를 하나 이상 선택하세요.'); return; }
      item.name = name;
      item.code = code;
      item.allowedShiftCodeIds = allowedShiftCodeIds;
      item.rule = Object.assign({}, normalizeWorkTypeRule(item), {allowedShiftCodes:(data.shiftCodes||[]).filter(sc=>allowedShiftCodeIds.includes(sc.id)).map(sc=>String(sc.code||'').toUpperCase())});
      ensureWorkTypeCodesAndRules();
      saveData(true);
      renderAdminCodes();
      closeModal();
      popup('근무유형이 수정되었습니다.');
    }}
  ]);
}

function defaultTeamOptions(){
  return ['A','B','C','D','E','F','G','H','I','J'];
}
function normalizeTeamOptionsInput(raw){
  const parts=String(raw||'').split(/[\s,\/]+/).map(x=>x.trim().toUpperCase()).filter(Boolean);
  const seen=[];
  parts.forEach(x=>{ if(!seen.includes(x)) seen.push(x); });
  return seen.length ? seen : defaultTeamOptions();
}
function getWardTeamOptions(ward){
  if(!ward) return defaultTeamOptions();
  if(!Array.isArray(ward.teamOptions) || ward.teamOptions.length===0) ward.teamOptions=defaultTeamOptions();
  const opts=ward.teamOptions.map(x=>String(x||'').trim().toUpperCase()).filter(Boolean);
  (ward.nurses||[]).forEach(n=>{
    const t=String(n.team||'').trim().toUpperCase();
    if(t && !opts.includes(t)) opts.push(t);
  });
  if(!opts.length) opts.push(...defaultTeamOptions());
  ward.teamOptions=opts;
  return opts;
}
function updateWardTeamOptions(raw){
  const ward=getCurrentWard();
  if(!ward) return;
  ward.teamOptions=normalizeTeamOptionsInput(raw);
  const valid=getWardTeamOptions(ward);
  (ward.nurses||[]).forEach(n=>{
    if(!valid.includes(String(n.team||'').toUpperCase())) n.team=valid[0] || 'A';
  });
  if(nurseDraftState[ward.id]){
    nurseDraftState[ward.id].forEach(n=>{
      if(!valid.includes(String(n.team||'').toUpperCase())) n.team=valid[0] || 'A';
    });
  }
  saveData(true);
  renderWardNurses();
  popup('팀 목록이 저장되었습니다.');
}
function setDefaultWardTeamOptions(){
  updateWardTeamOptions(defaultTeamOptions().join(','));
}

}

function queueNurseDraftAutoSave(){
  // 근무자 명단 입력 중에는 화면을 다시 그리지 않고 드래프트만 유지합니다.
  // DB 저장은 저장 버튼 클릭 시(saveWardNurseTable)에만 실행됩니다.
  const ward=getCurrentWard();
  clearTimeout(nurseAutoSaveTimer);
  if(ward){
    persistNurseDraftForWard(ward.id);
    nurseAutoSaveTimer=setTimeout(()=>{
      if(!nurseDraftState[ward.id]) return;
      (nurseDraftState[ward.id]||[]).forEach(n=>{ normalizeNurseSkillProfile(n); normalizeNurseWorkTypeState(n); normalizePersonalShiftDayRules(n); forceNightFieldsZeroIfNotAllowed(n); });
      // 메모리상 ward.nurses는 최신 상태로 유지하되, DB 저장은 하지 않습니다.
      ward.nurses = JSON.parse(JSON.stringify(nurseDraftState[ward.id]||[]));
    },500);
  }
}

function normalizeNurseWorkTypeState(n){
  if(!n) return n;
  normalizeNurseSkillProfile(n);
  normalizePersonalShiftDayRules(n);
  if(Array.isArray(n.workTypeIds) && n.workTypeIds.length){
    n.selectedWorkTypes=[...n.workTypeIds];
  } else if(Array.isArray(n.selectedWorkTypes) && n.selectedWorkTypes.length){
    n.workTypeIds=[...n.selectedWorkTypes];
  } else {
    n.workTypeIds=[];
    n.selectedWorkTypes=[];
  }
  if(Array.isArray(n.placementRuleIds) && n.placementRuleIds.length){
    n.selectedPlacementRules=[...n.placementRuleIds];
  } else if(Array.isArray(n.selectedPlacementRules) && n.selectedPlacementRules.length){
    n.placementRuleIds=[...n.selectedPlacementRules];
  } else {
    n.placementRuleIds=[];
    n.selectedPlacementRules=[];
  }
  return n;
}
function ensureWardDraftState(){
  const ward=getCurrentWard();
  if(!ward) return;
  (ward.nurses||[]).forEach(normalizeNurseWorkTypeState);
  if(!nurseDraftState[ward.id]){
    const stored=readNurseDraftStorage()[ward.id];
    const source=stored && Array.isArray(stored.rows) && stored.rows.length ? stored.rows : (ward.nurses||[]);
    nurseDraftState[ward.id]=source.map(n=>normalizeNurseWorkTypeState(JSON.parse(JSON.stringify(n))));
  }
}
function getWardDraftRows(){
  ensureWardDraftState();
  const ward=getCurrentWard();
  return nurseDraftState[ward.id] || [];
}
function updateNurseDraft(id,key,val){
  const ward=getCurrentWard();
  ensureWardDraftState();
  const rows=nurseDraftState[ward.id]||[];
  const n=rows.find(x=>x.id===id);
  if(!n) return;
  n[key]=val;
  if(key==='skillLevel'){
    n.skillLevel=String(val||'LV3').toUpperCase();
  }
  // 신규 여부는 skillLevel === LV1 로 통일합니다. 예전 isNewNurse 직접 수정은 더 이상 사용하지 않습니다.
  normalizeNurseSkillProfile(n);
  normalizeNurseWorkTypeState(n);
  forceNightFieldsZeroIfNotAllowed(n);
  queueNurseDraftAutoSave();
}

      ${['D','E','N'].map(shift=>`
        <div class="personal-rule-shift">${shift}</div>
        <label class="personal-rule-check ${shiftAllowedByWorkType(shift)?'':'disabled'}">
          <input type="checkbox" data-personal-shift-enabled="${shift}" ${enabled(shift)?'checked':''} ${shiftAllowedByWorkType(shift)?'':'disabled'} onchange="updatePersonalShiftModalEnabled('${shift}')">
          <span>${shiftAllowedByWorkType(shift)?'사용':'미허용'}</span>
        </label>
        ${dateTypes.map(t=>`
          <label class="personal-rule-check ${shiftAllowedByWorkType(shift)?'':'disabled'}" data-personal-day-label="${shift}">
            <input type="checkbox" data-personal-shift="${shift}" data-personal-day="${t}" ${checked(shift,t)} ${enabled(shift)?'':'disabled'}>
            <span>${labels[t]}</span>
          </label>
        `).join('')}
      `).join('')}
    </div>
    <div class="alert" style="margin-top:12px">예: 상근직은 D만 조건 적용을 선택한 뒤 평일만 체크합니다. D-N keep 직원이 토요일/일요일만 N 가능하면 N만 조건 적용을 선택하고 토요일, 일요일만 체크합니다.</div>`;
  openModal(`${escapeHtml(n.name||'직원')} 개인별 배치조건`, body, [
    {label:'취소', action:'close'},
    {label:'적용', primary:true, action:()=>savePersonalShiftRuleModal(nurseId)}
  ]);
  ['D','E','N'].forEach(updatePersonalShiftModalEnabled);
  const allToggle=document.getElementById('personalShiftAllToggle');
  if(allToggle){
    const allowedShifts=['D','E','N'].filter(shiftAllowedByWorkType);
    allToggle.checked=allowedShifts.length>0 && allowedShifts.every(shift=>document.querySelector(`input[data-personal-shift-enabled="${shift}"]`)?.checked);
  }
}

function updatePersonalShiftModalEnabled(shift){
  const en=document.querySelector(`input[data-personal-shift-enabled="${shift}"]`);
  const active=!!(en && en.checked && !en.disabled);
  ['weekday','sat','sun','holiday'].forEach(t=>{
    const el=document.querySelector(`input[data-personal-shift="${shift}"][data-personal-day="${t}"]`);
    if(el) el.disabled=!active;
  });
  document.querySelectorAll(`[data-personal-day-label="${shift}"]`).forEach(label=>{
    if(active) label.classList.remove('disabled');
    else label.classList.add('disabled');
  });
}

function setPersonalShiftModalAll(checked){
  ['D','E','N'].forEach(shift=>{
    const en=document.querySelector(`input[data-personal-shift-enabled="${shift}"]`);
    if(en && !en.disabled){
      en.checked=!!checked;
      updatePersonalShiftModalEnabled(shift);
      ['weekday','sat','sun','holiday'].forEach(t=>{
        const el=document.querySelector(`input[data-personal-shift="${shift}"][data-personal-day="${t}"]`);
        if(el && !el.disabled) el.checked=!!checked;
      });
    }
  });
}

  const scrollState=getWardNurseScrollState();
  const dateTypes=['weekday','sat','sun','holiday'];

  for(const shift of ['D','E','N']){
    const enabled=document.querySelector(`input[data-personal-shift-enabled="${shift}"]`)?.checked;
    if(!enabled) continue;
    enabledRules[shift]=true;
    const selected=dateTypes.filter(t=>document.querySelector(`input[data-personal-shift="${shift}"][data-personal-day="${t}"]`)?.checked);

      alert(`${shift} 가능 요일을 최소 1개 이상 선택해주세요.`);
      return;
    }
    if(selected.length<dateTypes.length) next[shift]=selected;
  }
  n.personalShiftDayRules=next;
  n.personalShiftRuleEnabled=enabledRules;
  normalizeNurseWorkTypeState(n);
  (nurseDraftState[ward.id]||[]).forEach(row=>{ normalizeNurseSkillProfile(row); normalizeNurseWorkTypeState(row); normalizePersonalShiftDayRules(row); forceNightFieldsZeroIfNotAllowed(row); });
  // DB 저장은 저장 버튼 클릭 시(saveWardNurseTable)에만 실행합니다.

function workTypeAllowsNightById(workTypeId){
  const wt=(data.workTypes||[]).find(w=>w.id===workTypeId);
  if(!wt) return false;
  const codes=getWorkTypeBaseCodes(wt);
  return codes.includes('N');
}
function nurseDraftAllowsNight(n){
  const ids=getSelectedWorkTypeIdsForNurse(n);
  return ids.some(id=>workTypeAllowsNightById(id));
}
function nurseDraftIsNightKeep(n){
  const ids=getSelectedWorkTypeIdsForNurse(n);
  return ids.some(id=>{
    const wt=(data.workTypes||[]).find(w=>w.id===id);
    const code=String((wt&&wt.code) || inferWorkTypeCodeByName(wt&&wt.name,'') || '').toUpperCase();
    const allowed=getWorkTypeBaseCodes(wt).filter(c=>!['O','OF','WO','AL','SL','HA','HP'].includes(String(c).toUpperCase()));
    return code==='NK' || (allowed.length===1 && allowed[0]==='N');
  });
}
function forceNightFieldsZeroIfNotAllowed(n){
  if(!nurseDraftAllowsNight(n)){
    n.maxNightPerMonth=0;
    n.minConsecutiveNight=0;
    n.maxConsecutiveNight=0;
  }
  return n;
}

function toggleNurseDraftSelection(id,bucket,itemId,checked){
  const ward=getCurrentWard();
  ensureWardDraftState();
  const rows=nurseDraftState[ward.id]||[];
  const n=rows.find(x=>x.id===id);
  if(!n) return;
  if(!Array.isArray(n[bucket])) n[bucket]=[];
  if(checked){
    if(!n[bucket].includes(itemId)) n[bucket].push(itemId);
  } else {
    n[bucket]=n[bucket].filter(v=>v!==itemId);
  }
  if(bucket==='workTypeIds') n.selectedWorkTypes=[...n.workTypeIds];
  if(bucket==='placementRuleIds') n.selectedPlacementRules=[...n.placementRuleIds];
  normalizeNurseWorkTypeState(n);
  queueNurseDraftAutoSave();
}

function saveWardNurseTable(){
  const ward=getCurrentWard();
  ensureWardDraftState();
  (nurseDraftState[ward.id]||[]).forEach(n=>{ normalizeNurseSkillProfile(n); normalizeNurseWorkTypeState(n); normalizePersonalShiftDayRules(n); forceNightFieldsZeroIfNotAllowed(n); });
  ward.nurses = JSON.parse(JSON.stringify(nurseDraftState[ward.id]||[]));
  clearNurseDraftStorageForWard(ward.id);
  saveData(true);

function buildUploadedScheduleForWardMonth(ward,y,m){

  });
  return result;
}

function normalizeUploadedDutyCode(value){
  let s=String(value ?? '').trim().toUpperCase();
  if(!s) return '';
  s=s.replace(/\s+/g,'').replace(/[()\[\]{}]/g,'');
  const map={DAY:'D',D:'D',데이:'D',주간:'D',EVENING:'E',EVE:'E',EV:'E',E:'E',이브닝:'E',이브:'E',저녁:'E',NIGHT:'N',N:'N',나이트:'N',야간:'N',OFF:'O',OF:'O',O:'O',오프:'O',휴무:'O',휴:'O',WO:'WO',원티드:'WO',희망:'WO',AL:'AL',연차:'AL',SL:'SL',병가:'SL',HA:'HA',오전반차:'HA',반차오전:'HA',HP:'HP',오후반차:'HP',반차오후:'HP'};
  if(map[s]) return map[s];
  if(s.includes('DAY') || s.includes('데이')) return 'D';
  if(s.includes('EVE') || s.includes('이브')) return 'E';
  if(s.includes('NIGHT') || s.includes('나이트')) return 'N';
  if(s.includes('OFF') || s.includes('오프') || s==='휴') return 'O';
  if(s.includes('연차')) return 'AL';
  if(s.includes('병가')) return 'SL';
  if(['D','E','N','O','OF','WO','AL','SL','HA','HP','MD','SD6'].includes(s)) return s==='OF'?'O':s;
  return '';
}
function isUploadedDateCell(v){
  if(v===null || v===undefined || v==='') return false;
  if(typeof v==='number') return v>=1 && v<=31;
  const s=String(v).trim();
  if(/^\d{1,2}$/.test(s)) return Number(s)>=1 && Number(s)<=31;
  if(/^\d{4}[-/.]\d{1,2}[-/.]\d{1,2}/.test(s)) return true;
  if(/^\d{1,2}[-/.]\d{1,2}/.test(s)) return true;
  return false;
}
function extractDayNumberFromCell(v){
  if(typeof v==='number') return Math.max(1,Math.min(31,Math.floor(v)));
  const s=String(v||'').trim();
  let m=s.match(/^\d{4}[-/.](\d{1,2})[-/.](\d{1,2})/); if(m) return Number(m[2]);
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})/); if(m) return Number(m[2]);
  m=s.match(/^(\d{1,2})$/); if(m) return Number(m[1]);
  return null;
}
function analyzeScheduleRows(rows, sheetName){
  let best={row:-1, count:0, cols:[]};
  const limit=Math.min(12, rows.length);
  for(let r=0;r<limit;r++){
    const cols=[];
    (rows[r]||[]).forEach((v,c)=>{ if(isUploadedDateCell(v)) cols.push(c); });
    if(cols.length>best.count) best={row:r,count:cols.length,cols};
  }
  if(best.count<5) return null;
  const dayByCol={};
  best.cols.forEach(c=>{ const d=extractDayNumberFromCell(rows[best.row][c]); if(d) dayByCol[c]=d; });
  const firstDateCol=Math.min(...Object.keys(dayByCol).map(Number));
  const records=[];
  for(let r=best.row+1; r<rows.length; r++){
    const row=rows[r]||[];
    let name='';
    for(let c=0;c<firstDateCol;c++){
      const val=String(row[c]||'').trim();
      if(val && !/^\d+$/.test(val) && !['간호사','성명','이름','직원명','직원 명단','팀'].includes(val)){ name=val; break; }
    }
    if(!name) continue;
    let hasDuty=false;
    Object.keys(dayByCol).forEach(c=>{ if(normalizeUploadedDutyCode(row[Number(c)])) hasDuty=true; });
    if(!hasDuty) continue;
    Object.keys(dayByCol).forEach(c=>{
      const code=normalizeUploadedDutyCode(row[Number(c)]);
      if(code) records.push({sheetName,row:r,name,day:dayByCol[c],code});
    });
  }
  return records.length ? {sheetName,dateHeaderRow:best.row,dayByCol,records} : null;
}
function getDatePeriodFromDayNumber(day){
  const dtype=getDateType(uiYear,uiMonth,day);
  if(dtype==='sat') return 'saturday';
  if(dtype==='sun' || dtype==='holiday') return 'holiday';
  return 'weekday';
}
function buildPatternAnalysis(records, fileName){
  const byDay={}; const byNurse={}; const notes=[];
  records.forEach(r=>{
    if(!byDay[r.day]) byDay[r.day]={D:0,E:0,N:0,O:0,WO:0,AL:0,SL:0,HA:0,HP:0,MD:0,SD6:0};
    byDay[r.day][r.code]=(byDay[r.day][r.code]||0)+1;
    if(!byNurse[r.name]) byNurse[r.name]={};
    byNurse[r.name][r.day]=r.code;
  });
  const rules={weekday:{},saturday:{},holiday:{}};
  ['weekday','saturday','holiday'].forEach(p=>['D','E','N'].forEach(s=>rules[p][s]={min:0,max:0}));
  ['weekday','saturday','holiday'].forEach(period=>{
    ['D','E','N'].forEach(shift=>{
      const vals=Object.keys(byDay).map(Number).filter(d=>getDatePeriodFromDayNumber(d)===period).map(d=>Number(byDay[d][shift]||0));
      rules[period][shift]={min: vals.length?Math.min(...vals):0, max: vals.length?Math.max(...vals):0};
    });
  });
  const nightBlocks=[]; const offAfter=[]; const workStreaks=[]; const offStreaks=[]; const nCounts=[];
  Object.keys(byNurse).forEach(name=>{
    const days=Object.keys(byNurse[name]).map(Number).sort((a,b)=>a-b);
    let i=0;
    while(i<days.length){
      const d=days[i], code=byNurse[name][d];
      if(code==='N'){
        let len=1; let j=i+1;
        while(j<days.length && days[j]===days[j-1]+1 && byNurse[name][days[j]]==='N'){ len++; j++; }
        nightBlocks.push(len);
        let offLen=0; let k=j;
        while(k<days.length && days[k]===days[k-1]+1 && ['O','WO','AL','SL','HA','HP'].includes(byNurse[name][days[k]])){ offLen++; k++; }
        offAfter.push(offLen); i=j; continue;
      }
      i++;
    }
    let work=0, off=0, nightCount=0;
    days.forEach((d,idx)=>{
      const c=byNurse[name][d];
      if(c==='N') nightCount++;
      const isWork=['D','E','N','MD','SD6'].includes(c);
      const isOff=['O','WO','AL','SL','HA','HP'].includes(c);
      if(isWork){ work++; if(off>0){offStreaks.push(off); off=0;} }
      else if(isOff){ off++; if(work>0){workStreaks.push(work); work=0;} }
      else { if(work>0){workStreaks.push(work); work=0;} if(off>0){offStreaks.push(off); off=0;} }
      if(idx===days.length-1){ if(work>0) workStreaks.push(work); if(off>0) offStreaks.push(off); }
    });
    nCounts.push(nightCount);
  });
  function mode(arr, fallback=0){
    const freq={}; arr.filter(v=>Number.isFinite(v)).forEach(v=>freq[v]=(freq[v]||0)+1);
    const keys=Object.keys(freq).map(Number); if(!keys.length) return fallback;
    keys.sort((a,b)=>freq[b]-freq[a] || a-b); return keys[0];
  }
  function minNonzero(arr, fallback=0){ const vals=arr.filter(v=>v>0); return vals.length?Math.min(...vals):fallback; }
  const analysis={
    fileName, createdAt:new Date().toLocaleString(), recordCount:records.length, nurseCount:Object.keys(byNurse).length,
    suggestedStaffingRules:rules,
    suggestedMinConsecutiveNight:minNonzero(nightBlocks,0),
    suggestedMaxConsecutiveNight:nightBlocks.length?Math.max(...nightBlocks):0,
    suggestedNightRestDaysAfterBlock:Math.max(2, mode(offAfter.filter(v=>v>0), 2)),
    suggestedMinConsecutiveOff:minNonzero(offStreaks,1),
    suggestedMaxConsecutiveOff:offStreaks.length?Math.max(...offStreaks):3,
    suggestedMaxConsecutiveDays:workStreaks.length?Math.max(...workStreaks):5,
    monthlyNightCounts:nCounts,
    uploadedRecords:records.map(r=>({sheetName:r.sheetName,name:r.name,day:r.day,code:r.code})),
    nightBlockSamples:nightBlocks.slice(0,100), offAfterNightSamples:offAfter.slice(0,100),
    notes
  };
  if(records.length<20) analysis.notes.push('인식된 근무코드가 적습니다. 날짜 행과 간호사 이름 열이 포함된 실제 근무표인지 확인하세요.');
  if(Object.values(rules.weekday).every(x=>x.max===0)) analysis.notes.push('D/E/N 인원 패턴을 충분히 찾지 못했습니다. 근무코드가 D/E/N 또는 데이/이브닝/나이트 형태인지 확인하세요.');
  return analysis;
}
function handleScheduleExcelUpload(file){
  const ward=getCurrentWard();
  if(!file || !ward) return;
  const resultBox=document.getElementById('excelPatternResult');
  if(resultBox) resultBox.innerHTML='엑셀 파일을 읽는 중입니다...';
  if(typeof XLSX==='undefined'){
    alert('엑셀 분석 라이브러리를 불러오지 못했습니다. 인터넷 연결 후 다시 시도하세요.');
    return;
  }
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      let allRecords=[];
      wb.SheetNames.forEach(name=>{
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:false, blankrows:false});
        const parsed=analyzeScheduleRows(rows, name);
        if(parsed) allRecords=allRecords.concat(parsed.records);
      });
      const analysis=buildPatternAnalysis(allRecords, file.name);
      ward.excelPatternAnalysis=analysis;
      ward.useUploadedScheduleInGeneration = true;
      saveData(true);
      renderWardNurses();
      popup('엑셀 근무표 분석이 완료되었습니다.');
    }catch(err){
      console.error(err);
      alert('엑셀 파일 분석 중 오류가 발생했습니다. 근무표 형식 또는 파일 손상 여부를 확인하세요.');
      if(resultBox) resultBox.textContent='분석 실패';
    }
  };
  reader.readAsArrayBuffer(file);
}
function applyUploadedSchedulePattern(){
  const ward=getCurrentWard();
  const analysis=ward?.excelPatternAnalysis;

  if(m) return {year:Number(m[1]), month:Number(m[2]), day:Number(m[3])};
  m=s.match(/(1[0-2]|0?[1-9])\s*[월\-_.\/]\s*(3[01]|[12]?\d)\s*(?:일)?/);

function renderLeaveBasketCalendar(y,m){
  const firstDow=new Date(y,m-1,1).getDay();
  const last=daysInMonth(y,m);
  const prevLast=daysInMonth(m===1?y-1:y,m===1?12:m-1);
  const cells=[];
  ['일','월','화','수','목','금','토'].forEach((d,idx)=>cells.push(`<div class="leave-dow ${idx===0?'date-sun':idx===6?'date-sat':''}">${d}</div>`));
  for(let i=0;i<firstDow;i++) cells.push(`<div class="leave-day muted">${prevLast-firstDow+i+1}</div>`);
  for(let d=1; d<=last; d++){
    const date=makeDateKey(y,m,d);
    const selected=leaveBasketState.includes(date);
    const cls=getDayNumberClass(y,m,d);
    cells.push(`<div class="leave-day ${selected?'selected':''} ${cls}" onclick="toggleLeaveBasketDate('${date}')">${d}</div>`);
  }
  const remain=(7-(cells.length%7))%7;

function collectNightLimitIssues(schedule, ward, y, m){

  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const last=daysInMonth(y,m);
  nurses.forEach(n=>{
    if(isUnifiedNewNurse(n) || !stepAllowed(n,'N')) return;
    const maxN=stepIsNightKeep(n)
      ? nightKeepMonthlyTargetByDays(last)
      : getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth ?? 6);
    const nCnt=scheduleShiftCountForNurse(schedule,n,y,m,'N');
    if(maxN>=0 && nCnt>maxN) issues.push(`${n.name} 월 N 최대 초과 (${nCnt}/${maxN})`);

    const maxNs=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3);
    const prevTail=getPreviousMonthTailCodesSinceLastOff(ward,n.id,y,m);
    let streak=countTrailingFromArray(prevTail, c=>String(c||'').toUpperCase()==='N');
    let start=streak>0 ? '전월말' : 0;
    for(let d=1; d<=last+1; d++){
      const key=d<=last ? makeDateKey(y,m,d) : '';
      const code=d<=last ? String(schedule[key]?.[n.id]||'').toUpperCase() : '';
      if(d<=last && code==='N'){
        if(streak===0) start=d;
        streak++;
      }else if(streak>0){
        const label=start==='전월말' ? `${n.name} 전월 말부터 이어진 연속 N` : `${makeDateKey(y,m,start)} ${n.name} 연속 N`;
        if(maxNs>0 && streak>maxNs) issues.push(`${label} 최대 초과 (${streak}/${maxNs})`);
        streak=0; start=0;
      }
    }

    let lastNightForRecovery=null;
    const requiredOff=Math.max(1, typeof stepNightOffCount==='function' ? stepNightOffCount(n) : 2);
    for(let d=1; d<=last; d++){
      const key=makeDateKey(y,m,d);
      const code=String(schedule[key]?.[n.id]||'').toUpperCase();
      if(code!=='N') continue;
      const prevCode=d>1 ? String(schedule[makeDateKey(y,m,d-1)]?.[n.id]||'').toUpperCase() : String(getPreviousMonthLastCode(ward,n.id,y,m)||'').toUpperCase();
      if(prevCode==='N'){
        lastNightForRecovery=d;

      }

        issues.push(`${makeDateKey(y,m,d)} ${n.name} N후 ${requiredOff}OFF 미준수`);
      }
      lastNightForRecovery=d;
    }

    const gap=typeof stepNightReentryGapDays==='function' ? stepNightReentryGapDays(n) : 0;

      let lastNightDay=null;
      const offset=typeof getPreviousMonthLastNightOffset==='function' ? getPreviousMonthLastNightOffset(ward,n.id,y,m) : -999;
      if(offset!==-999) lastNightDay=offset;
      for(let d=1; d<=last; d++){
        const key=makeDateKey(y,m,d);
        if(String(schedule[key]?.[n.id]||'').toUpperCase()!=='N') continue;
        const prevKey=d>1 ? makeDateKey(y,m,d-1) : '';
        const prevCode=d>1 ? String(schedule[prevKey]?.[n.id]||'').toUpperCase() : String(getPreviousMonthLastCode(ward,n.id,y,m)||'').toUpperCase();
        if(prevCode==='N'){
          lastNightDay=d;
          continue;
        }
        if(lastNightDay!==null && (d-lastNightDay)<=gap){
          issues.push(`${makeDateKey(y,m,d)} ${n.name} N 재진입 텀 부족 (${d-lastNightDay}/${gap+1}일 간격 필요)`);
        }
        lastNightDay=d;
      }
    }
  });
  return [...new Set(issues)];
}

function applyPreceptorMirroring(schedule, ward, y, m){

  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');

function stepPlaceNightBlock(n,start,reason,opts={}){

function stepRunWantedOff(){

function stepBuildNightKeepPlan(target, minN, maxN, offCnt, days, seed=0){
  target=Math.max(0,Number(target||0));
  minN=Math.max(1,Number(minN||2));
  maxN=Math.max(minN,Number(maxN||3));
  offCnt=Math.max(0,Number(offCnt||2));
  days=Math.max(1,Number(days||30));
  if(!target) return [];

  // 월 전체 흐름을 보고 2N/3N을 섞는 패턴 엔진입니다.
  // 목표 N 개수는 넘지 않고, 특정 길이만 계속 반복하지 않도록 extra N을 월 전반/중반/후반에 분산합니다.
  let bestBlocks=1;
  for(let b=1; b<=target; b++){
    if(b*minN<=target && b*maxN>=target && target+(offCnt*b)<=days+offCnt){
      bestBlocks=b;
    }
  }
  const blocks=Array(bestBlocks).fill(minN);
  let extra=target-(bestBlocks*minN);
  if(extra<=0) return blocks;

  const capacity=blocks.map(v=>Math.max(0,maxN-v));
  // 균등 분산 후보 순서: seed로 시작점을 바꾸고, 한쪽으로 몰리지 않게 건너뛰며 배치
  const order=[];
  const step=Math.max(1, Math.floor(bestBlocks/2));
  let idx=seed % bestBlocks;
  for(let k=0;k<bestBlocks*2 && order.length<bestBlocks;k++){
    if(!order.includes(idx)) order.push(idx);
    idx=(idx+step)%bestBlocks;
  }
  for(let k=0;k<bestBlocks && order.length<bestBlocks;k++){ if(!order.includes(k)) order.push(k); }

  let guard=0;
  while(extra>0 && guard<100){
    let changed=false;
    for(const i of order){
      if(extra<=0) break;
      if(capacity[i]>0){ blocks[i]++; capacity[i]--; extra--; changed=true; }
    }
    if(!changed) break;
    guard++;
  }

  // 2,3이 모두 가능한데 우연히 같은 숫자만 반복되면 중간 블록을 바꾸어 단조로움을 줄입니다.
  if(minN<maxN && blocks.length>=3 && new Set(blocks).size===1 && target>minN*blocks.length){
    for(let i=1;i<blocks.length-1;i+=2){
      if(blocks[i]<maxN && blocks[0]>minN){ blocks[i]++; blocks[0]--; }
    }
  }
  return blocks.filter(v=>v>0);
}

function stepIsConditionedNightLockReason(reason){

function stepHasPersonalNightDayCondition(n){

function stepRunConditionedNightBeforeNightKeep(){
  const ward=getCurrentWard(), st=stepEnsureState(); if(!ward||!st) return {placed:0, blocks:0, days:0};
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const y=st.y, m=st.m, last=daysInMonth(y,m);

  function nCount(n){ return Number((summarizeSchedule(st.schedule,nurses,y,m)[n.id]||{}).nights||0); }
  function maxN(n){ return getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6); }

  function targetMax(day){ return getStaffingMaxForDate(ward,y,m,day,'N'); }

      const range=stepNightBlockRange(n);
      const maxLen=Math.min(range.max||1, Math.max(1,maxN(n)-before));
      const minLen=Math.min(Math.max(1,range.min||1), maxLen);

        changed=true;
      }
    }
    if(!changed) break;

function stepRunNightKeep(){
  const ward=getCurrentWard(), st=stepEnsureState(); if(!ward||!st) return;
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave'&&n.employmentStatus!=='inactive');
  const conditioned=stepRunConditionedNightBeforeNightKeep();
  let placed=0; const last=daysInMonth(st.y,st.m); const nightKeeps=nurses.filter(stepIsNightKeep);
  nightKeeps.forEach((n,nkIdx)=>{

    const range=stepNightBlockRange(n);

    let d=stepProtectRestFromPreviousNight(n);

function stepGeneralNightFairContext(nurses){
  const ward=getCurrentWard(), st=stepEnsureState();
  if(!ward||!st) return {eligible:[], lower:0, upper:0, remainingNeed:0};
  const last=daysInMonth(st.y,st.m);
  const eligible=nurses.filter(n=>stepIsCountedStaff(n)&&!stepIsNightKeep(n)&&stepAllowed(n,'N')&&getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6)>0);

  for(let d=1; d<=last; d++){

  }
  const capacity=eligible.reduce((sum,n)=>sum+Math.max(0,getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6)-(summarizeSchedule(st.schedule,nurses,st.y,st.m)[n.id]?.nights||0)),0);

function stepNightFairLimit(n,nurses){

  // 일반 3교대 N은 개인별 최대값 안에서 가능한 한 1개 차이 이내가 되도록 upper를 우선 제한값으로 사용합니다.

function stepChooseNightBlockLenFair(n,d,nurses){

function stepNightShortages(){

function stepGeneralNightRotationQueue(nurses){
  const eligible=(nurses||[])
    .filter(n=>stepIsCountedStaff(n)&&!stepIsNightKeep(n)&&stepAllowed(n,'N')&&getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth??6)>0);
  const byName=(a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko') || String(a.id||'').localeCompare(String(b.id||''));
  const senior=eligible.filter(n=>isNurseSeniorSupport(n)).sort(byName);
  const other=eligible.filter(n=>!isNurseSeniorSupport(n)).sort(byName);
  // v14.1.29: N 순번 자체를 처음부터 시니어지원자 + 일반/주니어가 번갈아 오도록 만듭니다.
  // 사후 교환만으로는 1주차에 시니어끼리 뭉친 패턴이 월말까지 반복되어 교정이 어려우므로,

  const out=[];

  for(let i=0;i<maxLen;i++){

    if(other[i]) out.push(other[i]);

function stepNightQueueState(nurses){

    st.nightQueue={ids:[...ids], skipped:[], cycleUsed:[], skipLog:{}};

  st.nightQueue.ids=(st.nightQueue.ids||[]).filter(id=>ids.includes(id));
  ids.forEach(id=>{ if(!st.nightQueue.ids.includes(id)) st.nightQueue.ids.push(id); });
  st.nightQueue.skipped=(st.nightQueue.skipped||[]).filter(id=>ids.includes(id));
  st.nightQueue.cycleUsed=(st.nightQueue.cycleUsed||[]).filter(id=>ids.includes(id));
  st.nightQueue.skipLog=st.nightQueue.skipLog||{};

}
function stepNightQueueCandidateOrder(nurses){
  const q=stepNightQueueState(nurses);
  const eligible=stepGeneralNightRotationQueue(nurses);
  const byId=Object.fromEntries(eligible.map(n=>[n.id,n]));
  const unused=q.ids.filter(id=>!q.cycleUsed.includes(id));
  const basePool=unused.length ? unused : q.ids;
  if(!unused.length && q.cycleUsed.length){
    q.cycleUsed=[];
  }
  const skippedFirst=(q.skipped||[]).filter(id=>basePool.includes(id));
  const rest=basePool.filter(id=>!skippedFirst.includes(id));
  return [...skippedFirst,...rest].map(id=>byId[id]).filter(Boolean);
}
function stepNightQueueMarkSkipped(n, d, reason){

  const q=stepNightQueueState((getCurrentWard()?.nurses||[]).filter(x=>x.employmentStatus!=='leave'&&x.employmentStatus!=='inactive'));
  if(!q.skipped.includes(n.id)) q.skipped.push(n.id);
  q.skipLog[n.id]=`${d}일 ${reason||'배치불가'}`;

function stepNightQueueMarkPlaced(n){

function stepTryQueueNightBlockForDate(d, mode, opts={}){

  const last=daysInMonth(st.y,st.m);
  const baseOrder=stepNightQueueCandidateOrder(nurses);

    const bWeekendOnly=!isPersonalShiftAllowedForDateType(b,'N','weekday')&&isPersonalShiftAllowedForDateType(b,'N',dtype);
