<script>
function addNurse(){
  const ward=getCurrentWard();
  ensureWardDraftState();
  const rows=nurseDraftState[ward.id] || [];
  const id='n-'+Date.now();
  rows.push({
    id,
    name:'',
    team:(getWardTeamOptions(ward)[0] || 'A'),
    workTypeIds:[],
    placementRuleIds:[],
    maxNightPerMonth:data.commonScheduleSettings?.defaultMaxNightPerMonth ?? 6,
    maxConsecutiveDays:data.commonScheduleSettings?.defaultMaxConsecutiveDays ?? 5,
    minConsecutiveNight:data.commonScheduleSettings?.defaultMinConsecutiveNight ?? 0,
    maxConsecutiveNight:data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3,
    minConsecutiveOff:data.commonScheduleSettings?.defaultMinConsecutiveOff ?? 1,

    skillTags:[],
    employmentStatus:'active',
    isNewNurse:false
  });
  nurseDraftState[ward.id]=rows;
  queueNurseDraftAutoSave();
  renderWardNurses();
}

const STORAGE_KEY='nurse-shift-scheduler-v4-html';
const NURSE_DRAFT_STORAGE_KEY='nurse-shift-scheduler-v4-nurse-drafts';
const legacyKeys=['nurse-shift-scheduler-v3-html','nurse-shift-scheduler-v2-html','nurse-shift-scheduler-v1-html'];
let currentUser=null, activeTab='', uiYear=new Date().getFullYear(), uiMonth=new Date().getMonth()+1, resultCache=null;
let nurseDraftState={};
let leaveBasketState=[];
let nurseAutoSaveTimer=null;
let scheduleDraftState={};
let preselectNewWorkTypeShiftCodeId='';
let data=loadData();
ensureShiftCodeWorkTypeConsistency();
ensureWorkTypeCodesAndRules();
let lastSavedSnapshot = JSON.stringify(data);
let firebaseLoaded = false;
let firebaseWatchStarted = false;
let firebaseLoadPromise = Promise.resolve(false);
let firebaseSaveTimer = null;
ensureKoreanFixedHolidays(new Date().getFullYear());

function readNurseDraftStorage(){
  try{ return JSON.parse(localStorage.getItem(NURSE_DRAFT_STORAGE_KEY)||'{}') || {}; }
  catch(e){ return {}; }
}
function persistNurseDraftForWard(wardId){
  if(!wardId || !nurseDraftState[wardId]) return;
  const store=readNurseDraftStorage();
  store[wardId]={updatedAt:new Date().toISOString(), rows:JSON.parse(JSON.stringify(nurseDraftState[wardId]||[]))};
  localStorage.setItem(NURSE_DRAFT_STORAGE_KEY, JSON.stringify(store));
}
function clearNurseDraftStorageForWard(wardId){
  const store=readNurseDraftStorage();
  if(store[wardId]){
    delete store[wardId];
    localStorage.setItem(NURSE_DRAFT_STORAGE_KEY, JSON.stringify(store));
  }
}


function ensureShiftCodeWorkTypeConsistency(){
  if(!Array.isArray(data.shiftCodes)) data.shiftCodes=[];
  if(!Array.isArray(data.workTypes)) data.workTypes=[];

  const defaults = [
    {code:'D',name:'Day',startTime:'07:00',endTime:'15:00',desc:'주간근무'},
    {code:'E',name:'Evening',startTime:'15:00',endTime:'23:00',desc:'저녁근무'},
    {code:'N',name:'Night',startTime:'23:00',endTime:'07:00',desc:'야간근무'},
    {code:'O',name:'Off',startTime:'',endTime:'',desc:'휴무'},
    {code:'AL',name:'Annual Leave',startTime:'',endTime:'',desc:'연차'},
    {code:'SL',name:'Sick Leave',startTime:'',endTime:'',desc:'병가'},
    {code:'WO',name:'Wanted Off',startTime:'',endTime:'',desc:'희망휴무'},
    {code:'HA',name:'Half Annual AM',startTime:'',endTime:'',desc:'오전반차'},
    {code:'HP',name:'Half Annual PM',startTime:'',endTime:'',desc:'오후반차'}
  ];

  defaults.forEach(d=>{
    const existing = data.shiftCodes.find(s=>String(s.code||'').toUpperCase()===d.code);
    if(existing){
      existing.id = existing.id || ('sc-'+d.code.toLowerCase());
      existing.name = existing.name || d.name;
      existing.startTime = existing.startTime || d.startTime;
      existing.endTime = existing.endTime || d.endTime;
      existing.desc = existing.desc || d.desc;
    } else {
      data.shiftCodes.push({id:'sc-'+d.code.toLowerCase(), ...d});
    }
  });

  const codeToId = Object.fromEntries((data.shiftCodes||[]).filter(s=>s.code).map(s=>[String(s.code).toUpperCase(), s.id]));
  ensureWorkTypeCodesAndRules();
  (data.workTypes||[]).forEach(w=>{
    if(!Array.isArray(w.allowedShiftCodeIds)){
      w.allowedShiftCodeIds = String(w.allowedCodes || '').split(',').map(c=>c.trim().toUpperCase()).filter(Boolean).map(c=>codeToId[c]).filter(Boolean);
    }
    // 휴무/휴가 코드는 모든 근무유형에서 근무표 입력에 필요하므로 누락되어 있으면 자동 포함
    ['O','AL','SL','WO','HA','HP'].forEach(code=>{
      const id=codeToId[code];
      if(id && !w.allowedShiftCodeIds.includes(id)) w.allowedShiftCodeIds.push(id);
    });
  });
}


function normalizeWorkTypeText(text){
  return String(text||'').toLowerCase().replace(/[\s,./·ㆍ()\[\]{}_:;~!@#$%^&*+=|\\?"'<>-]/g,'');
}
function inferWorkTypeCodeByName(name, currentCode=''){
  const n=normalizeWorkTypeText(name+' '+currentCode);
  if(n.includes('3교대') || n.includes('threeshift') || n==='3s') return '3S';
  if(n.includes('데이이브닝') || n.includes('dayevening') || n.includes('dekeep') || n.includes('dek')) return 'DEK';
  if(n.includes('데이나이트') || n.includes('daynight') || n.includes('dnkeep') || n.includes('dnk')) return 'DNK';
  if(n.includes('이브닝나이트') || n.includes('eveningnight') || n.includes('enkeep') || n.includes('enk')) return 'ENK';
  if(n.includes('daygeneral') || n.includes('데이일반') || n.includes('일반데이') || n==='dg') return 'DG';
  if(n.includes('데이킵') || n.includes('daykeep') || n==='dk') return 'DK';
  if(n.includes('이브닝킵') || n.includes('eveningkeep') || n==='ek') return 'EK';
  if(n.includes('나이트킵') || n.includes('nightkeep') || n==='nk') return 'NK';
  if(n.includes('상근') || n.includes('office') || n.includes('fulltime') || n==='sg' || n==='ft') return 'SG';
  if(n.includes('임신') || n.includes('pregnant') || n.includes('pregnancy') || n==='pg') return 'PG';
  if(n.includes('6시간') || n.includes('단축') || n.includes('sd6') || n.includes('midday') || n.includes('미드')) return 'SD6';
  return String(currentCode||'').trim().toUpperCase();
}
function defaultAllowedCodesForWorkTypeCode(code){
  const c=String(code||'').toUpperCase();
  const baseOff=['O','OF','WO','AL','SL','HA','HP'];
  if(c==='3S') return ['D','E','N',...baseOff];
  if(c==='DK' || c==='DG') return ['D',...baseOff];
  if(c==='EK') return ['E',...baseOff];
  if(c==='NK') return ['N',...baseOff];
  if(c==='DEK') return ['D','E',...baseOff];
  if(c==='DNK') return ['D','N',...baseOff];
  if(c==='ENK') return ['E','N',...baseOff];
  if(c==='SG') return ['D',...baseOff];
  if(c==='PG') return ['D','SD6',...baseOff];
  if(c==='SD6') return ['SD6',...baseOff];
  return [];
}

function defaultWorkTypeRuleForCode(code){
  const c=String(code||'').toUpperCase();
  const base={
    allowedShiftCodes: defaultAllowedCodesForWorkTypeCode(c),
    offSaturday:false,
    offSunday:false,
    offHoliday:false,
    preventEveningToDay:false,
    preventNightToDayEvening:false,
    minConsecutiveNight:0,
    maxConsecutiveNight:0,
    nightOffAfter:0,
    nightReentryGap:0,
    monthlyTargetMode:'none',
    monthlyNightRatio:0,
    monthlyNightFixed:''
  };
  if(c==='3S') Object.assign(base,{preventEveningToDay:true,preventNightToDayEvening:true,minConsecutiveNight:2,maxConsecutiveNight:3,nightOffAfter:2,nightReentryGap:2,monthlyTargetMode:'manual'});
  if(c==='NK') Object.assign(base,{minConsecutiveNight:2,maxConsecutiveNight:3,nightOffAfter:2,nightReentryGap:0,monthlyTargetMode:'nightkeepHalfUp',monthlyNightRatio:50});
  if(c==='DNK') Object.assign(base,{preventNightToDayEvening:true,minConsecutiveNight:2,maxConsecutiveNight:3,nightOffAfter:2,nightReentryGap:2,monthlyTargetMode:'manual'});
  if(c==='ENK') Object.assign(base,{minConsecutiveNight:2,maxConsecutiveNight:3,nightOffAfter:2,nightReentryGap:2,monthlyTargetMode:'manual'});
  if(c==='DEK') Object.assign(base,{preventEveningToDay:true});
  return base;
}
function normalizeWorkTypeRule(w){
  const code=String(w?.code || inferWorkTypeCodeByName(w?.name,'')).toUpperCase();
  const def=defaultWorkTypeRuleForCode(code);
  if(!w.rule || typeof w.rule!=='object') w.rule={};
  w.rule=Object.assign({}, def, w.rule || {});
  if(!Array.isArray(w.rule.allowedShiftCodes) || w.rule.allowedShiftCodes.length===0){
    w.rule.allowedShiftCodes=[...(def.allowedShiftCodes||[])];
  }
  w.rule.allowedShiftCodes=normalizeShiftCodeList(w.rule.allowedShiftCodes);
  // 요일별 OFF는 개인별 배치조건에서 직원별로 설정합니다.
  // 중앙 근무유형에는 법적/필수 전환 금지 조건만 남깁니다.
  w.rule.offSaturday=false;
  w.rule.offSunday=false;
  w.rule.offHoliday=false;

  // 실제 발생하지 않거나 해당 근무유형에서 의미가 없는 규칙은 저장값이 남아 있어도 비활성화합니다.
  const allowed=w.rule.allowedShiftCodes||[];
  const hasN=allowed.includes('N');
  if(!hasN){
    w.rule.minConsecutiveNight=0;
    w.rule.maxConsecutiveNight=0;
    w.rule.nightOffAfter=0;
    w.rule.nightReentryGap=0;
    w.rule.monthlyTargetMode='none';
    w.rule.monthlyNightRatio=0;
    w.rule.monthlyNightFixed='';
    w.rule.preventNightToDayEvening=false;
  }
  if(code==='NK'){
    w.rule.monthlyTargetMode='nightkeepHalfUp';
    w.rule.monthlyNightRatio=50;
    w.rule.nightReentryGap=0;
  }
  // E→D 금지, N→D/E 금지는 근무유형별 옵션이 아니라 시스템 전역 법적조건입니다.
  w.rule.preventEveningToDay=false;
  w.rule.preventNightToDayEvening=false;
  return w.rule;
}
function getWorkTypeFixedRuleSummary(w){
  const rule=normalizeWorkTypeRule(w);
  const vis=getWorkTypeUiRuleVisibility(w, rule);
  const allowed=(rule.allowedShiftCodes||[]).join(', ') || '없음';
  const parts=[`허용근무: ${allowed}`];
  const offs=[];
  if(vis.showAutoOff && rule.offSaturday) offs.push('토요일 OFF');
  if(vis.showAutoOff && rule.offSunday) offs.push('일요일 OFF');
  if(vis.showAutoOff && rule.offHoliday) offs.push('공휴일 OFF');
  if(offs.length) parts.push(offs.join(' / '));
  if(vis.showEveningToDay && rule.preventEveningToDay) parts.push('E→D 금지');
  if(vis.showNightToDayEvening && rule.preventNightToDayEvening) parts.push('N→D/E 금지');
  if(vis.showNightRules){
    const ns=[];
    if(Number(rule.minConsecutiveNight||0)>0 || Number(rule.maxConsecutiveNight||0)>0) ns.push(`연속N ${rule.minConsecutiveNight||0}~${rule.maxConsecutiveNight||0}`);
    if(Number(rule.nightOffAfter||0)>0) ns.push(`N 후 OFF ${rule.nightOffAfter}`);
    if(vis.showNightReentryGap && Number(rule.nightReentryGap||0)>0) ns.push(`N 재진입 텀 ${rule.nightReentryGap}`);
    if(vis.isNightKeep) ns.push('월간 N 목표: 30일 N15/OFF15, 31일 N16/OFF15');
    else if(vis.showMonthlyNightRatio && rule.monthlyTargetMode==='ratio') ns.push(`월간 N ${rule.monthlyNightRatio||50}%`);
    if(vis.showMonthlyNightRatio && rule.monthlyTargetMode==='fixed') ns.push(`월간 N ${rule.monthlyNightFixed||0}개`);
    if(ns.length) parts.push(ns.join(' · '));
  }
  return parts.join(' · ');
}

function getWorkTypeUiRuleVisibility(w, rule){
  const code=String((w&&w.code) || inferWorkTypeCodeByName(w&&w.name,'') || '').toUpperCase();
  const allowed=(rule&&Array.isArray(rule.allowedShiftCodes)) ? rule.allowedShiftCodes.map(x=>String(x).toUpperCase()) : [];
  const hasN=allowed.includes('N');
  return {
    // 요일 OFF는 직원별 개인조건에서 설정합니다.
    showAutoOff: false,
    showEveningToDay: false,
    showNightToDayEvening: false,
    // 나이트 규칙은 N 허용 유형에서만 표시합니다.
    showNightRules: hasN,
    // 월간 N 목표는 NK에서만 표시합니다. NK는 30일 N15/OFF15, 31일 N16/OFF15 방식입니다.
    showMonthlyNightRatio: code==='NK' && hasN,
    showNightReentryGap: code!=='NK' && hasN,
    isNightKeep: code==='NK'
  };
}

function ensureWorkTypeCodesAndRules(){
  if(!Array.isArray(data.workTypes)) return;
  const codeToId = Object.fromEntries((data.shiftCodes||[]).filter(s=>s.code).map(s=>[String(s.code).toUpperCase(), s.id]));
  (data.workTypes||[]).forEach(w=>{
    const inferred=inferWorkTypeCodeByName(w.name,w.code);
    if(inferred && !w.code) w.code=inferred;
    const rule=normalizeWorkTypeRule(w);
    // 관리자 화면에서 설정한 허용근무가 자동생성의 기준입니다. 기존 allowedCodes/allowedShiftCodeIds도 동기화합니다.
    const ids=(rule.allowedShiftCodes||[]).map(c=>codeToId[c]).filter(Boolean);
    if(ids.length) w.allowedShiftCodeIds=ids;
    w.allowedCodes=(rule.allowedShiftCodes||[]).join(',');
    // 요일 OFF는 중앙 근무유형이 아니라 병동별 개인조건에서만 적용합니다.
    w.satRestricted=false;
    w.holidayRestricted=false;
    w.weekendRestricted=false;
    w.fixedRuleSummary=getWorkTypeFixedRuleSummary(w);
  });
}
function getPrimaryWorkType(n){
  const ids=getSelectedWorkTypeIdsForNurse(n);
  if(!ids.length) return null;
  return (data.workTypes||[]).find(w=>w.id===ids[0]) || null;
}
function getPrimaryWorkTypeRule(n){
  const wt=getPrimaryWorkType(n);
  return wt ? normalizeWorkTypeRule(wt) : null;
}
function toggleWorkTypeRuleAllowed(workTypeId, code, checked){
  const w=(data.workTypes||[]).find(x=>x.id===workTypeId);
  if(!w) return;
  const rule=normalizeWorkTypeRule(w);
  const c=String(code||'').toUpperCase();
  if(checked){ if(!rule.allowedShiftCodes.includes(c)) rule.allowedShiftCodes.push(c); }
  else { rule.allowedShiftCodes=rule.allowedShiftCodes.filter(x=>x!==c); }
  ensureWorkTypeCodesAndRules();
  saveData(true);
  renderAdminCodes();
}
function updateWorkTypeRule(workTypeId, key, value){
  const w=(data.workTypes||[]).find(x=>x.id===workTypeId);
  if(!w) return;
  const rule=normalizeWorkTypeRule(w);
  if(['offSaturday','offSunday','offHoliday','preventEveningToDay','preventNightToDayEvening'].includes(key)) rule[key]=!!value;
  else if(['minConsecutiveNight','maxConsecutiveNight','nightOffAfter','nightReentryGap','monthlyNightRatio'].includes(key)) rule[key]=Number(value||0);
  else rule[key]=value;
  ensureWorkTypeCodesAndRules();
  saveData(true);
}

function ensureCoreGenerationRules(){

  } else {
    existing.name='전월 마지막 OFF 이후 근무흐름 연속성 최우선 적용 (연속근무/연속N 이어서 계산, N→D/E 금지)';
    existing.key='enforcePreviousMonthTransition';
    existing.enabled = existing.enabled !== false;
    existing.priority = 1;
  }
  data.commonScheduleSettings.enforcePreviousMonthTransition = data.commonScheduleSettings.enforcePreviousMonthTransition !== false;
  data.generationRules.sort((a,b)=>Number(a.priority||999)-Number(b.priority||999));
  data.generationRules.forEach((r,idx)=>{ r.priority=idx+1; if(r.key) data.commonScheduleSettings[r.key]=r.enabled!==false; });
}

async function loadFirebaseDataOnStart(){
  if(!window.nurseDb){
    firebaseLoaded = false;
    return false;
  }
  try{
    const snap = await window.nurseDb.ref(window.NURSE_DB_PATH).get();
    if(snap.exists()){
      const remote = snap.val();
      if(remote && typeof remote === 'object'){
        data = remote;
        ensureDataDefaults();
        ensureShiftCodeWorkTypeConsistency();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); // 오프라인 임시 백업
        lastSavedSnapshot = JSON.stringify(data);
        ensureKoreanFixedHolidays(new Date().getFullYear());
      }
    } else {
      data = defaultData();
      ensureDataDefaults();
      ensureShiftCodeWorkTypeConsistency();
      ensureKoreanFixedHolidays(new Date().getFullYear());
      await window.nurseDb.ref(window.NURSE_DB_PATH).set(data);
      lastSavedSnapshot = JSON.stringify(data);
      localStorage.setItem(STORAGE_KEY, lastSavedSnapshot);
    }
    firebaseLoaded = true;
    return true;
  }catch(e){
    firebaseLoaded = false;
    console.warn('Firebase 데이터 불러오기 실패:', e);
    return false;
  }
}

async function ensureFirebaseReady(){
  // v14.1.12: Firebase가 늦거나 실패해도 로그인 버튼이 멈추지 않도록 안정화합니다.
  // Firebase 성공 시 원격 데이터를 우선 사용하고, 실패 시 이 PC의 임시저장 데이터를 사용합니다.
  if(firebaseLoaded && window.nurseDb && window.NURSE_DB_PATH) return true;

  try{
    if(window.nurseFirebaseReady && typeof window.nurseFirebaseReady.then === 'function'){
      await Promise.race([
        window.nurseFirebaseReady,
        new Promise((_, reject)=>setTimeout(()=>reject(new Error('Firebase 초기화 시간 초과')), 15000))
      ]);
    }
  }catch(e){
    console.warn('Firebase 초기화 대기 실패:', e);
  }

  const maxWaitMs = 15000;
  const started = Date.now();
  while(!(window.nurseDb && window.NURSE_DB_PATH)){
    if(window.nurseFirebaseError) break;
    if(Date.now() - started > maxWaitMs) break;
    await sleep(200);
  }

  if(window.nurseDb && window.NURSE_DB_PATH){
    const ok = await loadFirebaseDataOnStart();
    if(ok && !firebaseWatchStarted){
      firebaseWatchStarted = true;
      watchFirebaseData();
    }
    return !!ok;
  }

  firebaseLoaded = false;
  return false;
}

function watchFirebaseData(){
  if(!window.nurseDb) return;
  try{
    window.nurseDb.ref(window.NURSE_DB_PATH).on('value', function(snapshot){
      if(!snapshot.exists()) return;
      const incoming = snapshot.val();
      if(!incoming || typeof incoming !== 'object') return;
      const incomingText = JSON.stringify(incoming);
      if(incomingText === lastSavedSnapshot) return;
      data = incoming;
      ensureDataDefaults();
      const fixedText = JSON.stringify(data);
      localStorage.setItem(STORAGE_KEY, fixedText);
      lastSavedSnapshot = fixedText;
      if(currentUser){
        nurseDraftState={};
        scheduleDraftState={};
        const refreshed = (data.users||[]).find(u => u.loginId === currentUser.loginId && u.role === currentUser.role);
        if(refreshed) currentUser = refreshed;
        renderApp();
        popup('Firebase 데이터가 반영되었습니다.');
      }
    });
  }catch(e){
    console.warn('Firebase 실시간 동기화 실패:', e);
  }
}




function getLunarMonthDay(dateObj){
  try{
    const fmt = new Intl.DateTimeFormat('en-u-ca-chinese', { month:'numeric', day:'numeric' });
    const parts = fmt.formatToParts(dateObj);
    const month = parts.find(p=>p.type==='month')?.value || '';
    const day = parts.find(p=>p.type==='day')?.value || '';
    const m = String(month).replace(/[^0-9]/g,'');
    const d = String(day).replace(/[^0-9]/g,'');
    if(!m || !d) return null;
    return { month:Number(m), day:Number(d) };
  }catch(e){
    return null;
  }
}
function ensureKoreanFixedHolidays(year){
  if(!Array.isArray(data.globalHolidays)) data.globalHolidays = [];

  // remove previously auto-seeded holidays for this year only, keep manual additions intact
  data.globalHolidays = data.globalHolidays.filter(h => !(h.auto && String(h.date||'').startsWith(`${year}-`)));

  const fixed = [
    {md:'01-01', type:'법정공휴일', note:'신정'},
    {md:'03-01', type:'법정공휴일', note:'삼일절'},
    {md:'05-01', type:'법정휴일', note:'근로자의 날'},
    {md:'05-05', type:'법정공휴일', note:'어린이날'},
    {md:'06-06', type:'법정공휴일', note:'현충일'},
    {md:'08-15', type:'법정공휴일', note:'광복절'},
    {md:'10-03', type:'법정공휴일', note:'개천절'},
    {md:'10-09', type:'법정공휴일', note:'한글날'},
    {md:'12-25', type:'법정공휴일', note:'기독탄신일'}
  ];

  fixed.forEach(h => {
    const date = `${year}-${h.md}`;
    const exists = data.globalHolidays.find(x => x.date === date);
    if(!exists){
      data.globalHolidays.push({date, type:h.type, note:h.note, auto:true});
    }
  });

  // Automatically seed lunar-based official holidays:
  // Seollal eve/day/day after, Buddha's Birthday, Chuseok eve/day/day after
  for(let month=1; month<=12; month++){
    const lastDay = new Date(year, month, 0).getDate();
    for(let day=1; day<=lastDay; day++){
      const dt = new Date(year, month-1, day);
      const next = new Date(year, month-1, day+1);
      const lunar = getLunarMonthDay(dt);
      const lunarNext = getLunarMonthDay(next);
      if(!lunar) continue;

      const date = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      let holidayMeta = null;

      // 설날 전날: 음력 12월 말일 -> 다음날이 음력 1월 1일
      if(lunar.month === 12 && lunarNext && lunarNext.month === 1 && lunarNext.day === 1){
        holidayMeta = { type:'법정공휴일', note:'설날 전날' };
      }
      // 설날 / 다음날
      else if(lunar.month === 1 && lunar.day === 1){
        holidayMeta = { type:'법정공휴일', note:'설날' };
      }
      else if(lunar.month === 1 && lunar.day === 2){
        holidayMeta = { type:'법정공휴일', note:'설날 다음날' };
      }
      // 부처님오신날
      else if(lunar.month === 4 && lunar.day === 8){
        holidayMeta = { type:'법정공휴일', note:'부처님오신날' };
      }
      // 추석 전날/당일/다음날
      else if(lunar.month === 8 && lunar.day === 14){
        holidayMeta = { type:'법정공휴일', note:'추석 전날' };
      }
      else if(lunar.month === 8 && lunar.day === 15){
        holidayMeta = { type:'법정공휴일', note:'추석' };
      }
      else if(lunar.month === 8 && lunar.day === 16){
        holidayMeta = { type:'법정공휴일', note:'추석 다음날' };
      }

      if(holidayMeta){
        const exists = data.globalHolidays.find(x => x.date === date);
        if(!exists){
          data.globalHolidays.push({ date, ...holidayMeta, auto:true });
        }
      }
    }
  }
}

function holidayCountForMonth(y,m){
  let count=0; const last=daysInMonth(y,m);
  for(let d=1;d<=last;d++){ const t=getDateType(y,m,d); if(t!=='weekday') count++; }
  return count;
}
function getBaseOffTargetForMonth(ward,y,m){
  return holidayCountForMonth(y,m);
}
function getRegularMonthlyOffTarget(ward,y,m){
  return Math.max(0, getBaseOffTargetForMonth(ward,y,m));
}
function getAdditionalOff(ward,y,m){ return additionalOffHolidayCountForMonth(y,m); }
function getWorkTypeById(id){ return (data.workTypes||[]).find(x=>x.id===id); }
function getPlacementRuleById(id){ return (data.placementRules||[]).find(x=>x.id===id); }
function hasWorkType(n, name){
  return (n.workTypeIds||[]).some(id => {
    const w=(data.workTypes||[]).find(x=>x.id===id);
    return w && String(w.name||'').trim()===name;
  });
}
function hasPlacementRule(n, name){
  return (n.placementRuleIds||[]).some(id => {
    const w=(data.placementRules||[]).find(x=>x.id===id);
    return w && String(w.name||'').trim()===name;
  });
}
function nurseHasKeywordInWorkType(n, keywords){
  return (n.workTypeIds||[]).some(id => {
    const w=(data.workTypes||[]).find(x=>x.id===id);
    const t=`${w?.name||''} ${w?.code||''}`.toLowerCase();
    return keywords.some(k=>t.includes(k));
  });
}
function getSelectedWorkTypeIdsForNurse(n){
  // 현재 근무자 명단 화면의 workTypeIds를 기준으로 사용합니다.
  // 예전 데이터(selectedWorkTypes)에 3교대가 남아 있으면 데이킵/상근 직원에게 E가 배정될 수 있으므로,
  // workTypeIds가 존재할 때는 legacy selectedWorkTypes를 섞지 않습니다.
  if(Array.isArray(n.workTypeIds) && n.workTypeIds.length) return [...new Set(n.workTypeIds)];
  if(Array.isArray(n.selectedWorkTypes) && n.selectedWorkTypes.length) return [...new Set(n.selectedWorkTypes)];
  return [];
}
function normalizeShiftCodeList(list){
  return [...new Set((list||[]).map(c=>String(c||'').trim().toUpperCase()).filter(Boolean))];
}
function getWorkTypeBaseCodes(w){
  let codes=[];
  if(Array.isArray(w?.allowedShiftCodeIds) && w.allowedShiftCodeIds.length){
    w.allowedShiftCodeIds.forEach(id=>{ const sc=getShiftCodeById(id); if(sc && sc.code) codes.push(String(sc.code).toUpperCase()); });
  }
  if(w?.allowedCodes){
    String(w.allowedCodes).split(',').map(c=>c.trim().toUpperCase()).filter(Boolean).forEach(c=>codes.push(c));
  }
  return normalizeShiftCodeList(codes);
}
function getAllowedCodes(n){
  if(n.employmentStatus && n.employmentStatus!=='active') return ['O','OF'];
  const ids=getSelectedWorkTypeIdsForNurse(n);
  const selected=ids.map(id=>(data.workTypes||[]).find(w=>w.id===id)).filter(Boolean);
  const offCodesAlways=['O','OF','AL','SL','WO','HA','HP'];

  if(selected.length){
    const workSets=[];
    selected.forEach(w=>{
      const base=getWorkTypeBaseCodes(w).filter(c=>!offCodesAlways.includes(c));
      const text=`${w.name||''} ${w.code||''}`.toLowerCase();
      let forced=null;
      // 이름/코드 기반 근무유형은 하드 제한으로 해석합니다.
      // 데이킵/상근은 D만 가능, 나이트킵은 N만 가능, D/N keep은 D,N만 가능 등.
      if(text.includes('d/n') || text.includes('dnk') || text.includes('d-n')) forced=['D','N'];
      else if(text.includes('e/n') || text.includes('enk') || text.includes('e-n')) forced=['E','N'];
      else if(text.includes('d/e') || text.includes('dek') || text.includes('d-e')) forced=['D','E'];
      else if(text.includes('나이트킵') || text.includes('nightkeep') || text.includes('night keep') || text==='nk') forced=['N'];
      else if(text.includes('데이 킵') || text.includes('데이킵') || text.includes('daykeep') || text.includes('day keep') || text.includes('day general') || /\bdg\b/.test(text) || text.includes('상근') || text.includes('office') || text==='dk') forced=['D'];
      else if(text.includes('이브닝 킵') || text.includes('이브닝킵') || text.includes('eveningkeep') || text.includes('evening keep') || text==='ek') forced=['E'];
      else if(text.includes('6시간') || text.includes('sd6') || text.includes('6h')) forced=['SD6'];
      workSets.push(normalizeShiftCodeList(forced || base));
    });

    let working=[];
    const nonEmpty=workSets.filter(a=>a.length);
    if(nonEmpty.length){
      // 여러 근무유형이 선택되면 가장 제한적인 교집합을 우선 적용합니다.
      // 예: 데이킵 + 상근 => D만 가능, 3교대 + 데이킵 => D만 가능.
      working=nonEmpty.reduce((acc,set)=>acc.filter(c=>set.includes(c)));
      // 임신근로+6시간 단축 등 교집합이 없는 조합은 입력 가능한 근무코드의 합집합을 사용하되,
      // 데이킵/상근처럼 특정 keep 제한이 있으면 해당 제한을 우선합니다.
      if(!working.length){
        const hardKeep=nonEmpty.filter(set=>set.length<3);
        working = hardKeep.length ? hardKeep.reduce((acc,set)=>acc.filter(c=>set.includes(c)), hardKeep[0]) : normalizeShiftCodeList(nonEmpty.flat());
        if(!working.length) working=normalizeShiftCodeList(nonEmpty.flat());
      }
    }
    return normalizeShiftCodeList([...working, ...offCodesAlways]);
  }

  let codes=[];
  if(nurseHasKeywordInWorkType(n,['night','나이트','nk'])) codes=['N'];
  else if(nurseHasKeywordInWorkType(n,['day keep','daykeep','데이','상근','dk'])) codes=['D'];
  else if(nurseHasKeywordInWorkType(n,['6시간','sd6','6h'])) codes=['SD6'];
  else if(ids.length>0) codes=['D','E','N'];
  else codes=['D'];
  return normalizeShiftCodeList([...codes, ...offCodesAlways]);
}
function getNurseConstraints(n){
  const workIds=[...new Set([...(Array.isArray(n.workTypeIds)?n.workTypeIds:[]), ...(Array.isArray(n.selectedWorkTypes)?n.selectedWorkTypes:[])])];
  const placeIds=[...new Set([...(Array.isArray(n.placementRuleIds)?n.placementRuleIds:[]), ...(Array.isArray(n.selectedPlacementRules)?n.selectedPlacementRules:[])])];
  const workObjs=workIds.map(getWorkTypeById).filter(Boolean);
  const placeObjs=placeIds.map(getPlacementRuleById).filter(Boolean);

  function deepText(v, seen=new Set()){
    if(v==null) return '';
    if(typeof v==='string' || typeof v==='number' || typeof v==='boolean') return String(v);
    if(typeof v!=='object') return '';
    if(seen.has(v)) return '';
    seen.add(v);
    if(Array.isArray(v)) return v.map(x=>deepText(x,seen)).join(' ');
    return Object.keys(v).map(k=>`${k} ${deepText(v[k],seen)}`).join(' ');
  }
  const rawText=[deepText(n), ...workObjs.map(x=>deepText(x)), ...placeObjs.map(x=>deepText(x))].join(' ').toLowerCase();
  const norm=rawText.replace(/[\s,./·ㆍ()\[\]{}_:;~!@#$%^&*+=|\\?"'<>-]/g,'');
  const has=(words)=>words.some(w=>norm.includes(String(w).toLowerCase().replace(/[\s,./·ㆍ()\[\]{}_:;~!@#$%^&*+=|\\?"'<>-]/g,'')));
  const hasLimitWord=has(['제한','금지','불가','안됨','근무제한']);

  // 요일 관련 제한은 중앙/배치기준의 문구나 예전 플래그로 추론하지 않습니다.
  // 병동 관리자 > 근무자 명단 > 개인 조건이 단일 기준입니다.
  const explicitNewText=[
    n.name,
    n.notes,
    ...(Array.isArray(n.skillTags) ? n.skillTags : []),
    ...placeObjs.map(x=>x.name),
    ...placeIds
  ].join(' ').toLowerCase();
  const explicitNewNorm=explicitNewText.replace(/[\s,./·ㆍ()\[\]{}_:;~!@#$%^&*+=|\\?"'<>-]/g,'');
  const newByName=explicitNewNorm.includes('신규') || explicitNewNorm.includes('신입') || explicitNewNorm.includes('plnew') || explicitNewNorm.includes('trainee');
  const reduceNightByName=(has(['나이트','야간','night']) && has(['적게','감소','줄임','제한']));

  return {
    weekendRestricted: false,
    satRestricted: false,
    holidayRestricted: false,
    isNew: !!(isUnifiedNewNurse(n) || newByName),
    reduceNight: !!reduceNightByName,
    rawText
  };
}

function nurseProfile(n){
  const arr=[];
  (n.workTypeIds||[]).forEach(id=>{ const item=(data.workTypes||[]).find(w=>w.id===id); if(item) arr.push(item.name); });
  (n.placementRuleIds||[]).forEach(id=>{ const item=(data.placementRules||[]).find(w=>w.id===id); if(item) arr.push(item.name); });
  if(arr.length===0) arr.push('미지정');
  return arr.join(' / ');
}
function summarizeSchedule(schedule,nurses,y,m){
  const stats={}; 
  nurses.forEach(n=>stats[n.id]={totalOff:0,weekendHolidayOff:0,nights:0,days:0,evenings:0,midDays:0,workDays:0});
  for(let d=1;d<=daysInMonth(y,m);d++){
    const key=makeDateKey(y,m,d), dateType=getDateType(y,m,d);
    nurses.forEach(n=>{
      const code=schedule[key]?.[n.id]||'';
      if(['O','OF','AL','SL','WO','HA','HP'].includes(code)){ stats[n.id].totalOff++; if(dateType!=='weekday') stats[n.id].weekendHolidayOff++; }
      if(code==='D') stats[n.id].days++;
      if(code==='E') stats[n.id].evenings++;
      if(code==='N') stats[n.id].nights++;
      if(['MD','SD6'].includes(code)) stats[n.id].midDays++;
      if(['D','E','N','MD','SD6'].includes(code)) stats[n.id].workDays++;
    });
  }
  return stats;
}
function generateSchedule(ward,y,m){
  ensureKoreanFixedHolidays(y);
  normalizeWardStructure(ward);
  const nurses=(ward.nurses||[]).filter(n=>n.employmentStatus!=='leave' && n.employmentStatus!=='inactive');
  const last=daysInMonth(y,m), schedule={}, warnings=[];
  const baseOff=getBaseOffTargetForMonth(ward,y,m), addOff=0, targetOff=getRegularMonthlyOffTarget(ward,y,m);
  const workCodes=['D','E','N','MD','SD6'];
  const offCodes=['O','OF','AL','SL','WO','HA','HP'];
  // v10.1: 전체관리자 '스케줄 생성 원칙'은 자동생성 엔진에서 완전히 제외합니다.
  // 자동생성은 아래 고정 흐름으로만 동작합니다:
  // 1) 병동별 12~18개월 분석 프로필/수간호사 설정값  2) 개인별 하드제약  3) 나이트-우선 생성 순서.
  const activeRules=[];
  const opt={
    wantedOffFirst:true,
    enforceMinStaffing:true,
    balanceDEN:true,
    fillRemainingWithWork:true,
    allowWantedOffOverTarget:false,
    balanceTeams:true,
    enforceNewNotAlone:true,
    excludeNewFromMinimum:false,
    enforcePreviousMonthTransition:true
  };
  function minForDay(day,shift){ return getStaffingMinForDate(ward,y,m,day,shift); }
  function maxForDay(day,shift){ return getStaffingMaxForDate(ward,y,m,day,shift); }
  function dayFromKey(key){ return Number(String(key).slice(-2)); }

  const reqMap={};
  [...(ward.requests||[]), ...(ward.leaveRequests||[])].forEach(r=>{
    if(!r || !r.date || !r.nurseId) return;
    if(!reqMap[r.date]) reqMap[r.date]={};
    reqMap[r.date][r.nurseId]=r;
  });

  // Night 회복 OFF 보호구간: N 묶음 뒤 배정된 OFF는 이후 D/E/N 재배정으로 깨지지 않게 잠급니다.
  const lockedOff = new Set();
  function offLockKey(day,nurseId){ return `${makeDateKey(y,m,day)}|${nurseId}`; }
  function lockOff(day,nurseId){ if(day>=1 && day<=last) lockedOff.add(offLockKey(day,nurseId)); }
  function isLockedOff(day,nurseId){ return lockedOff.has(offLockKey(day,nurseId)); }

  function allAllowedCodes(n){ return [...new Set(getAllowedCodes(n).map(c=>String(c).toUpperCase()))]; }
  function allowedWorkCodes(n){ return allAllowedCodes(n).filter(c=>workCodes.includes(c)); }
  function isNightOnlyNurse(n){
    const aw=allowedWorkCodes(n).filter(c=>!['MD','SD6'].includes(c));
    return aw.length===1 && aw[0]==='N';
  }
  function effectiveMonthlyMaxNight(n){
    const configured=getNurseNumberSetting(n,'maxNightPerMonth',data.commonScheduleSettings?.defaultMaxNightPerMonth ?? 6);
    if(isNightOnlyNurse(n) && (!Object.prototype.hasOwnProperty.call(n,'maxNightPerMonth') || n.maxNightPerMonth===null || n.maxNightPerMonth==='')){
      return nightKeepMonthlyTargetByDays(last);
    }
    return configured;
  }
  function isThreeShiftEligible(n){
    const codes=allAllowedCodes(n);
    return ['D','E','N'].every(c=>codes.includes(c));
  }
  function isRestricted(n,dtype){
    const c=getNurseConstraints(n);
    return (dtype==='sat' && c.satRestricted) || ((dtype==='holiday'||dtype==='sun') && c.holidayRestricted) || ((dtype==='sat'||dtype==='sun'||dtype==='holiday') && c.weekendRestricted);
  }
  function dailyCount(date, shift){ return nurses.filter(n=>schedule[date]?.[n.id]===shift).length; }
  function staffingCount(date, shift){ return nurses.filter(n=>schedule[date]?.[n.id]===shift && !getNurseConstraints(n).isNew).length; }
  function experiencedCount(date, shift){ return nurses.filter(n=>schedule[date]?.[n.id]===shift && !getNurseConstraints(n).isNew).length; }
  function codeAt(day,nid){ return schedule[makeDateKey(y,m,day)]?.[nid]||''; }
  function prevCodeAt(day,nid){ return day>1 ? String(codeAt(day-1,nid)||'').toUpperCase() : getPreviousMonthLastCode(ward,nid,y,m); }
  function isOff(code){ return !code || offCodes.includes(code); }
  function statNow(){ return summarizeSchedule(schedule,nurses,y,m); }
  function stableNurseTie(n){
    const text=String((n&&n.id)||'') + '|' + String((n&&n.name)||'');
    let h=0;
    for(let i=0; i<text.length; i++){ h=(h*31 + text.charCodeAt(i)) % 100000; }
    return h / 100000000;
  }

  function previousTailCodes(n){ return getPreviousMonthTailCodesSinceLastOff(ward,n.id,y,m); }
  function previousWorkStreakBeforeMonth(n){ return countTrailingFromArray(previousTailCodes(n), c=>workCodes.includes(String(c||'').toUpperCase())); }
  function previousNightStreakBeforeMonth(n){ return countTrailingFromArray(previousTailCodes(n), c=>String(c||'').toUpperCase()==='N'); }
  function consecutiveWorkBefore(n, day){
    let count=0;
    for(let d=day-1; d>=1; d--){
      const c=String(codeAt(d,n.id)||'').toUpperCase();
      if(workCodes.includes(c)) count++; else return count;
    }
    return count + previousWorkStreakBeforeMonth(n);
  }
  function consecutiveIf(n, day, shift){
    if(!workCodes.includes(String(shift||'').toUpperCase())) return 0;
    let count=consecutiveWorkBefore(n, day)+1;
    for(let d=day+1; d<=last; d++){ const c=String(codeAt(d,n.id)||'').toUpperCase(); if(workCodes.includes(c)) count++; else break; }
    return count;
  }
  function previousNightStreak(n, day){
    let count=0;
    for(let d=day-1; d>=1; d--){
      const c=String(codeAt(d,n.id)||'').toUpperCase();
      if(c==='N') count++; else return count;
    }
    return count + previousNightStreakBeforeMonth(n);
  }
  function previousOffStreak(n, day){
    let count=0;
    for(let d=day-1; d>=1; d--){
      const c=String(codeAt(d,n.id)||'').toUpperCase();
      if(isOff(c)) count++; else return count;
    }
    return count;
  }
  function offStreakIf(n, day, code){
    if(!isOff(String(code||'').toUpperCase())) return 0;
    let count=previousOffStreak(n, day)+1;
    for(let d=day+1; d<=last; d++){ const c=String(codeAt(d,n.id)||'').toUpperCase(); if(isOff(c)) count++; else break; }
    return count;
  }
  function nightStreakIf(n, day, shift){
    if(String(shift||'').toUpperCase()!=='N') return 0;
    let count=previousNightStreak(n, day)+1;
    for(let d=day+1; d<=last; d++){ const c=String(codeAt(d,n.id)||'').toUpperCase(); if(c==='N') count++; else break; }
    return count;
  }
  function nightRestDaysAfterBlock(){
    // N 묶음 종료 후 반드시 보호해야 하는 OFF 개수입니다. 전월 말/이번 달 초·중·후반 모두 동일 적용합니다.
    // 병동 운영 원칙상 N 묶음 뒤에는 최소 2개의 OFF가 필요하므로 설정값이 0/1이어도 2로 보정합니다.
    return Math.max(2, Number(ward.nightRestDaysAfterBlock ?? data.commonScheduleSettings?.defaultNightRestDaysAfterBlock ?? 2));
  }
  function lastNightDistanceBefore(n, day){
    for(let d=day-1; d>=1; d--){
      const c=String(codeAt(d,n.id)||'').toUpperCase();
      if(c==='N') return day-d;
    }
    // 전월 마지막 OFF 이후 말일까지 N이 이어졌다면, 전월 말일을 0일로 보고 이번 달 초 재N 텀을 계산합니다.
    if(previousNightStreakBeforeMonth(n)>0) return day;
    return Infinity;
  }
  function nurseNightReentryGapDays(n){
    // 전체관리자 > 근무유형의 'N 텀 최소' 값을 실제 자동생성 하드제약으로 적용합니다.
    // 값 7은 이전 N 묶음 종료 후 N이 아닌 날이 7일 이상 지난 뒤에만 다음 N을 시작한다는 뜻입니다.
    const rule=getPrimaryWorkTypeRule(n)||{};
    return Math.max(0, Number(rule.nightReentryGap||0));
  }
  function isWithinNightRestGap(n, day){
    // 전날까지 N이 이어지는 중이면 같은 N 묶음이므로 재N 텀이 아니라 연속 N 규칙으로 판단합니다.
    if(previousNightStreak(n,day)>0) return false;
    const requiredGap=Math.max(nightRestDaysAfterBlock(), nurseNightReentryGapDays(n));
    // lastNightDistanceBefore = 새 N 시작일 - 직전 N일.
    // 따라서 'N 텀 7일'이면 직전 N 이후 비N 날짜가 7일 필요하므로 distance <= 7은 금지, distance >= 8부터 허용합니다.
    return lastNightDistanceBefore(n,day) <= requiredGap;
  }
  function desiredNightBlockLength(n){
    const minNs=getNurseNumberSetting(n,'minConsecutiveNight',data.commonScheduleSettings?.defaultMinConsecutiveNight ?? 0);
    const maxNs=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3);
    if(maxNs===0) return 0;
    // v14.1.15: N 최소/최대는 처음부터 고정 루틴으로 강제하는 값이 아니라 우선 배치 범위입니다.
    // 기본 생성은 가능한 한 2~3연속 N을 우선하고, 1개 N은 부족 교정 단계의 예외로만 허용합니다.
    const hardMax=maxNs>0 ? maxNs : 3;
    const preferred = hardMax>=3 ? 3 : (hardMax>=2 ? 2 : 1);
    const lower = minNs>0 ? Math.min(minNs, hardMax) : 1;
    return Math.max(1, Math.max(Math.min(preferred, hardMax), Math.min(lower, hardMax)));
  }
  function remainingNightQuota(n){
    const stats=statNow();
    const maxN=effectiveMonthlyMaxNight(n);
    return Math.max(0, maxN - Number(stats[n.id]?.nights||0));
  }
  function requiredNightLengthFromDay(n,startDay){
    const minNs=getNurseNumberSetting(n,'minConsecutiveNight',data.commonScheduleSettings?.defaultMinConsecutiveNight ?? 0);
    const maxNs=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3);
    const carried=previousNightStreak(n,startDay);
    if(maxNs===0) return 0;
    if(maxNs>0 && carried>=maxNs) return 0;
    if(carried>0){
      const need=Math.max(0, minNs-carried);
      if(need===0) return 0;
      return maxNs>0 ? Math.min(need, maxNs-carried) : need;
    }
    return desiredNightBlockLength(n);
  }
  function tryPlaceNightBlock(n, startDay, phase='nightFirst'){
    // 병동 수간호사가 근무자별로 지정한 허용 근무코드와 N 최소/최대 연속 조건을 하드 제약으로 적용합니다.
    if(!allAllowedCodes(n).includes('N')) return false;
    const carried=previousNightStreak(n,startDay);
    const minNs=getNurseNumberSetting(n,'minConsecutiveNight',data.commonScheduleSettings?.defaultMinConsecutiveNight ?? 0);
    const maxNs=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3);
    if(maxNs===0) return false;
    if(maxNs>0 && carried>=maxNs) return false;
    let len;
    if(carried>0){
      len=Math.max(0,minNs-carried);
      if(len<=0) return false;
      if(maxNs>0) len=Math.min(len,maxNs-carried);
    } else {
      len=desiredNightBlockLength(n);
    }
    const quota=remainingNightQuota(n);
    // N 최소가 2인데 월간 잔여 N quota가 1개뿐이면 단독 N을 만들지 않습니다.
    if(len<=0 || quota < len) return false;
    const touched=[];
    for(let i=0; i<len; i++){
      const day=startDay+i;
      if(day>last){ touched.forEach(([k,old])=>{ if(old) schedule[k][n.id]=old; else delete schedule[k][n.id]; }); return false; }
      const key=makeDateKey(y,m,day);
      if(dailyCount(key,'N') >= maxForDay(day,'N')){ touched.forEach(([k,old])=>{ if(old) schedule[k][n.id]=old; else delete schedule[k][n.id]; }); return false; }
      if(!canPlace(n,'N',day,phase,(phase==='staffingMin' || phase==='absoluteStaffing'))){
        touched.forEach(([k,old])=>{ if(old) schedule[k][n.id]=old; else delete schedule[k][n.id]; });
        return false;
      }
      touched.push([key,schedule[key]?.[n.id]||'']);
      schedule[key][n.id]='N';
    }
    // N 묶음 직후 회복 OFF를 먼저 확보합니다. 이미 D/E가 들어가 있어도 보호 OFF가 우선입니다.
    // AL/SL/WO 같은 신청 휴가는 유지하고, 보호 OFF 기간에는 이후 보정 단계에서 다시 근무로 바뀌지 않도록 잠급니다.
    for(let r=1; r<=nightRestDaysAfterBlock(); r++){
      const day=startDay+len-1+r;
      if(day>last) break;
      setProtectedOff(n, day);
    }
    return true;
  }
  function nightCycleScore(n, day){
    const stats=statNow();
    const c=getNurseConstraints(n);
    let s=0;
    // v14.1.17: N은 개인별 랜덤 배치가 아니라 순환 큐를 우선합니다.
    // 순번이 맞는 사람은 크게 우대하고, 원티드OFF/제약으로 건너뛴 순번은 다음 블록에서 다시 보정합니다.
    s += nightRotationQueueScore(n, day);
    s += Number(stats[n.id]?.nights||0)*250; // 월간 N 개수 균등
    if(isNightOnlyNurse(n)) s -= 500; // N 전담은 N 최소 인원 충족 시 우선 후보
    if(c.reduceNight) s += 2000;
    const dist=lastNightDistanceBefore(n,day);
    if(dist===Infinity) s -= 600; else s -= Math.min(dist,30)*25; // 오래 쉬고 온 사람 우선
    s += nurses.filter(x=>x.team===n.team && schedule[makeDateKey(y,m,day)]?.[x.id]==='N').length*40;
    s += stableNurseTie(n);
    return s;
  }

  function getNightRotationNurses(){
    // N 순환 큐 대상: 일반 3교대/D-N/E-N 가능자만 포함합니다. 나이트킵은 N/OFF 전담 사이클로 별도 처리합니다.
    return nurses
      .filter(n=>allAllowedCodes(n).includes('N') && !isNightOnlyNurse(n))
      .sort((a,b)=>{
        const ta=String(a.team||'').localeCompare(String(b.team||''),'ko');
        if(ta) return ta;
        const na=String(a.name||'').localeCompare(String(b.name||''),'ko');
        if(na) return na;
        return String(a.id||'').localeCompare(String(b.id||''));
      });
  }
  function countNightBlocksBeforeDay(day){
    let count=0;
    let prevByNurse={};
    for(let d=1; d<day; d++){
      nurses.forEach(n=>{
        const c=String(codeAt(d,n.id)||'').toUpperCase();
        const prev=String(prevByNurse[n.id]||'').toUpperCase();
        if(c==='N' && prev!=='N') count++;
        prevByNurse[n.id]=c;
      });
    }
    return count;
  }
  function nightRotationExpectedNurse(day){
    const q=getNightRotationNurses();
    if(!q.length) return null;
    const idx=countNightBlocksBeforeDay(day) % q.length;
    return q[idx] || q[0];
  }
  function nightRotationQueueScore(n, day){
    const q=getNightRotationNurses();
    if(!q.length) return 0;
    const expected=nightRotationExpectedNurse(day);
    const idx=q.findIndex(x=>x.id===n.id);
    const expIdx=q.findIndex(x=>expected && x.id===expected.id);
    if(idx<0 || expIdx<0) return 0;
    const forward=(idx-expIdx+q.length)%q.length;
    let s=forward*180;
    if(forward===0) s-=900;
    // 너무 최근에 N을 한 직원은 순번이 맞아도 후순위로 밀어 텀을 맞춥니다.
    const gap=nurseNightReentryGapDays(n);
    const dist=lastNightDistanceBefore(n,day);
    if(gap>0 && dist!==Infinity && dist<gap) s += (gap-dist)*450;
    return s;
  }
  function collectNightBlocks(){
    const blocks=[];
    nurses.forEach(n=>{
      let start=0;
      for(let d=1; d<=last+1; d++){
        const c=d<=last ? String(codeAt(d,n.id)||'').toUpperCase() : '';
        if(c==='N' && start===0) start=d;
        if((c!=='N' || d>last) && start>0){
          blocks.push({nurse:n,start,end:d-1,len:d-start});
          start=0;
        }
      }
    });
    return blocks.sort((a,b)=>a.start-b.start || String(a.nurse.name||'').localeCompare(String(b.nurse.name||''),'ko'));
  }
  function canTakeNightBlock(n, start, end, allowWantedOff=false){
    // 계약규칙: 근무유형 N 허용 여부 먼저 확인
    if(!allAllowedCodes(n).includes('N')) return false;
    const maxN=effectiveMonthlyMaxNight(n);
    if(maxN<=0) return false; // 야간면제
    const maxNs=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3);
    if(maxNs===0) return false;
    for(let d=start; d<=end; d++){
      const key=makeDateKey(y,m,d), dtype=getDateType(y,m,d);
      const cur=String(schedule[key]?.[n.id]||'').toUpperCase();
      if(['AL','SL','HA','HP'].includes(cur)) return false;
      if(!allowWantedOff && cur==='WO') return false;
      if(!isOff(cur)) return false;
      // 계약규칙: 개인조건 — 배치제한·특정 듀티 제한
      if(isRestricted(n,dtype)) return false;
      if(!isPersonalShiftAllowedForDateType(n,'N',dtype)) return false;
      if(!emergencyCanTakeNight(n,d,{maxConsecutiveNight:3})) return false;
    }
    return true;
  }
  function moveNightBlock(fromNurse, toNurse, start, end){
    if(!toNurse || fromNurse.id===toNurse.id) return false;
    if(!canTakeNightBlock(toNurse,start,end,false)) return false;
    for(let d=start; d<=end; d++){
      const key=makeDateKey(y,m,d);
      if(schedule[key]?.[fromNurse.id] !== 'N') return false;
    }
    for(let d=start; d<=end; d++){
      const key=makeDateKey(y,m,d);
      schedule[key][toNurse.id]='N';
      schedule[key][fromNurse.id]='OF';
    }
    return true;
  }
  function repairNightRotationByBlockSwaps(){
    // v14.1.17: 생성된 N 블록을 순환 큐 관점에서 다시 보며, 텀이 짧은 블록은 통째로 다른 후보에게 넘깁니다.
    // 통교환이 안 될 때만 1~2일 부분교환을 시도합니다. 고정휴가/WO/근무유형 제한은 유지합니다.
    let changed=false;
    for(let pass=0; pass<5; pass++){
      let passChanged=false;
      const blocks=collectNightBlocks();
      for(const block of blocks){
        const n=block.nurse;
        const gap=nurseNightReentryGapDays(n);
        const dist=lastNightDistanceBefore(n,block.start);
        const expected=nightRotationExpectedNurse(block.start);
        const shortGap=gap>0 && dist!==Infinity && dist<gap;
        const offTargetOver=(statNow()[n.id]?.totalOff||0) < targetOff ? false : false;
        if(!shortGap && expected && expected.id===n.id) continue;
        const q=getNightRotationNurses();
        const candidates=q
          .filter(x=>x.id!==n.id)
          .filter(x=>!isNightOnlyNurse(x) || isNightOnlyNurse(n))
          .filter(x=>canTakeNightBlock(x,block.start,block.end,false))
          .sort((a,b)=>{
            const ea=(expected && a.id===expected.id)?-2000:0;
            const eb=(expected && b.id===expected.id)?-2000:0;
            const da=lastNightDistanceBefore(a,block.start);
            const db=lastNightDistanceBefore(b,block.start);
            const ga=nurseNightReentryGapDays(a), gb=nurseNightReentryGapDays(b);
            const pa=(da===Infinity?-800:Math.max(0,ga-da)*500) + Number((statNow()[a.id]||{}).nights||0)*80 + ea + stableNurseTie(a);
            const pb=(db===Infinity?-800:Math.max(0,gb-db)*500) + Number((statNow()[b.id]||{}).nights||0)*80 + eb + stableNurseTie(b);
            return pa-pb;
          });
        if(candidates.length && moveNightBlock(n,candidates[0],block.start,block.end)){
          passChanged=true; changed=true; break;
        }
        // 부분교환: 블록 전체가 안 되면 뒤쪽 1~2개 N만 옮겨 텀 충돌을 완화합니다.
        for(let d=block.end; d>=block.start && !passChanged; d--){
          const candidates2=q
            .filter(x=>x.id!==n.id)
            .filter(x=>canTakeNightBlock(x,d,d,false))
            .sort((a,b)=>nightRotationQueueScore(a,d)-nightRotationQueueScore(b,d));
          if(candidates2.length && moveNightBlock(n,candidates2[0],d,d)){
            passChanged=true; changed=true; break;
          }
        }
        if(passChanged) break;
      }
      if(!passChanged) break;
    }
    return changed;
  }

  function fillNightFirst(){
    // 수간호사 실무 흐름처럼 Night 라인을 먼저 만들고, Night 후 OFF를 먼저 확보합니다.
    for(let d=1; d<=last; d++){
      const key=makeDateKey(y,m,d);
      while(staffingCount(key,'N') < minForDay(d,'N')){
        const candidates=nurses
          .filter(n=>isContractEligible(n,'N',d))
          .filter(n=>remainingNightQuota(n)>0)
          .filter(n=>isOff(schedule[key]?.[n.id]||''))
          .sort((a,b)=>nightCycleScore(a,d)-nightCycleScore(b,d));
        let placed=false;
        for(const cand of candidates){
          if(tryPlaceNightBlock(cand,d,'nightFirst')){ placed=true; break; }
        }
        if(!placed) break;
      }
    }
  }
  // ══════════════════════════════════════════════════════════════════
  // 계약규칙 (Contract Rules) — 최상위 절대불가침 계층
  // ──────────────────────────────────────────────────────────────────
  // 근무유형·개인조건·개인별 설정값은 근로계약·인사명령·법적 제한에 해당합니다.
  // "이 간호사에게 이 듀티를 넣을 권한이 있는가?"를 먼저 판단합니다.
  // NO이면 어떤 phase(최소인원 강제 포함)에서도 후보에 올리지 않습니다.
  // ══════════════════════════════════════════════════════════════════
  function isContractEligible(n, shift, day){
    const key=makeDateKey(y,m,day), dtype=getDateType(y,m,day);
    const existing=String(schedule[key]?.[n.id]||'').toUpperCase();

    // [계약규칙 1] AL/SL 고정 휴가 — 절대 보호
    if(['AL','SL'].includes(existing)) return false;

    // [계약규칙 2] 근무유형 — 허용되지 않은 듀티 배정 절대 금지
    if(!allAllowedCodes(n).includes(shift)) return false;

    // [계약규칙 3] 개인조건 — 배치제한일 (주말/공휴일/토요일)
    if(isRestricted(n,dtype)) return false;

    // [계약규칙 4] 개인조건 — 특정 듀티 제한 (야간면제, 요일별 듀티 불가 등)
    if(!isPersonalShiftAllowedForDateType(n,shift,dtype)) return false;

    // [계약규칙 5] 개인별 설정값 — N 배정 불가 조건 (야간면제·월쿼터·연속한도)
    if(shift==='N'){
      const maxN=effectiveMonthlyMaxNight(n);
      const maxNs=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3);
      if(maxN<=0) return false;   // 월 최대N=0 → 야간면제
      if(maxNs===0) return false; // 연속N 최대=0 → N 배정 불가
      const stats=statNow();
      if((stats[n.id]?.nights||0)>=maxN && existing!=='N') return false; // 월간 N 쿼터 초과
      if(maxNs>0 && nightStreakIf(n,day,shift)>maxNs) return false;      // 최대 연속N 초과
    }

    // [계약규칙 6] 개인조건 — 신규 간호사 단독 배치 절대 금지
    const c=getNurseConstraints(n);
    if(c.isNew && ['D','E','N'].includes(shift) && experiencedCount(key,shift)===0) return false;

    return true;
  }

  // ══════════════════════════════════════════════════════════════════
  // canPlace — 절대규칙·운영규칙 게이트
  // ──────────────────────────────────────────────────────────────────
  // 계층:  계약규칙 > 절대규칙 > 운영규칙 > 최적화규칙
  // 계약규칙은 isContractEligible()이 담당하며, 어떤 phase도 무시 불가.
  // 절대규칙 중 일부(N 회복 OFF, 최소 연속 OFF)는 staffingMin 단계에서 풀립니다.
  // ══════════════════════════════════════════════════════════════════
  function canPlace(n, shift, day, phase='extra', allowReplace=false){
    const key=makeDateKey(y,m,day);
    const existing=schedule[key]?.[n.id]||'';

    // ── 계약규칙: 후보 자격 심사 (phase 무관, 절대불가침) ──
    if(!isContractEligible(n,shift,day)) return false;

    // ── 운영규칙: WO는 wantedOffFirst 설정에 따라 보호 ──
    if(existing==='WO' && opt.wantedOffFirst) return false;

    // ── 절대규칙: staffingMin 단계에서는 아래 제약을 풀 수 있음 ──
    const staffingMinimumPhase = (phase==='staffingMin' || phase==='absoluteStaffing');
    if(!staffingMinimumPhase && isLockedOff(day,n.id) && ['D','E','N','MD','SD6'].includes(String(shift||'').toUpperCase())) return false;
    if(existing && !allowReplace) return false;

    // D/E/N 최대 인원
    if(phase!=='newSupport' && ['D','E','N'].includes(shift) && dailyCount(key,shift) >= maxForDay(day,shift) && existing!==shift) return false;

    const c=getNurseConstraints(n);
    const maxC=getNurseNumberSetting(n,'maxConsecutiveDays',data.commonScheduleSettings?.defaultMaxConsecutiveDays ?? 5);
    const minNightStreak=getNurseNumberSetting(n,'minConsecutiveNight',data.commonScheduleSettings?.defaultMinConsecutiveNight ?? 0);
    const maxNightStreak=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3);

    // N 재진입 텀 — staffingMin에서 풀 수 있음
    if(shift==='N' && isWithinNightRestGap(n,day) && !staffingMinimumPhase) return false;

    // 최소 연속 OFF 보호 — staffingMin에서 풀 수 있음
    const minOffStreak=getNurseNumberSetting(n,'minConsecutiveOff',data.commonScheduleSettings?.defaultMinConsecutiveOff ?? 1);
    if(workCodes.includes(String(shift||'').toUpperCase()) && minOffStreak>0 && previousOffStreak(n,day)>0 && previousOffStreak(n,day)<minOffStreak && !staffingMinimumPhase) return false;

    // N 연속 최소 진행 중 끊기 금지
    if(shift!=='N' && minNightStreak>0 && previousNightStreak(n,day)>0 && previousNightStreak(n,day)<minNightStreak) return false;

    if(maxC>0 && consecutiveIf(n,day,shift)>maxC) return false;

    // 전월 연속성 (절대규칙)
    const prevCode = prevCodeAt(day,n.id);
    if(opt.enforcePreviousMonthTransition && violatesWorkTypeTransition(n, prevCode, shift)) return false;
    if(shift==='N' && day<last && codeAt(day+1,n.id)==='D') return false;

    // 신규 간호사 최소인원 후보 제외 (운영규칙 — 단독 배치 금지는 이미 계약규칙에서 처리)
    if(phase==='minimum' && c.isNew) return false;

    return true;
  }
  function score(n,shift,key,dtype,phase){
    const stats=statNow();
    const own=stats[n.id]||{};
    const c=getNurseConstraints(n);
    let s=0;
    if(shift==='N') s += (own.nights||0)*80;
    if(shift==='D') s += (own.days||0)*24;
    if(shift==='E') s += (own.evenings||0)*24;
    if(c.reduceNight && shift==='N') s += 800;
    if(opt.balanceDEN && ['D','E','N'].includes(shift)){
      const eligible=nurses.filter(x=>isThreeShiftEligible(x) && allAllowedCodes(x).includes(shift) && !isRestricted(x,dtype) && !getNurseConstraints(x).reduceNight);
      const vals=eligible.map(x=> shift==='D' ? (stats[x.id]?.days||0) : shift==='E' ? (stats[x.id]?.evenings||0) : (stats[x.id]?.nights||0));
      const avg=vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
      const current=shift==='D' ? (own.days||0) : shift==='E' ? (own.evenings||0) : (own.nights||0);
      s += Math.max(0,current-avg)*70;
    }
    if(opt.balanceTeams && ['D','E','N'].includes(shift)) s += nurses.filter(x=>x.team===n.team && schedule[key]?.[x.id]===shift).length*30;
    s += consecutiveIf(n,Number(key.slice(-2)),shift)*6;
    return s + stableNurseTie(n);
  }

  // 0) 날짜별 빈 표 생성 + 고정 휴가/원티드오프 + 근무유형/배치기준 절대 제한 선반영
  for(let d=1; d<=last; d++){
    const key=makeDateKey(y,m,d), dtype=getDateType(y,m,d);
    schedule[key]={};
    nurses.forEach(n=>{
      const req=reqMap[key]?.[n.id];
      if(req && ['AL','SL'].includes(req.type)) schedule[key][n.id]=req.type;
      else if(req && req.type==='WO' && opt.wantedOffFirst) schedule[key][n.id]='WO';
    });
    nurses.forEach(n=>{
      if(schedule[key][n.id]) return;
      if(isRestricted(n,dtype)) schedule[key][n.id]='OF';
      else {
        const aw=allowedWorkCodes(n);
        if(aw.length===1 && ['SD6','MD'].includes(aw[0])) schedule[key][n.id]=aw[0];
      }
    });
  }

  function setProtectedOff(n, day){
    if(day<1 || day>last) return false;
    const key=makeDateKey(y,m,day);
    const cur=String(schedule[key]?.[n.id]||'').toUpperCase();
    if(['AL','SL','WO','HA','HP'].includes(cur)) return false;
    if(cur==='N') return false;
    if(!schedule[key]) schedule[key]={};
    if(schedule[key][n.id]!=='OF') schedule[key][n.id]='OF';
    lockOff(day,n.id);
    return true;
  }

  function lockRecoveryOffAfterNightBlock(n, blockEndDay){
    let changed=false;
    const rest=nightRestDaysAfterBlock();
    for(let r=1; r<=rest; r++){
      const day=blockEndDay+r;
      if(day>=1 && day<=last){
        if(setProtectedOff(n,day)) changed=true;
      }
    }
    return changed;
  }

  function enforceCarriedNightContinuity(){
    // 전월 마지막 OFF 이후 이어진 N 흐름을 이번 달 1일부터 우선 확정합니다.
    // 예: 5/30 N, 5/31 N이고 연속 N 최대 2 / N 후 OFF 2이면 6/1, 6/2는 보호 OFF로 잠급니다.
    nurses.forEach(n=>{
      const carriedBefore=previousNightStreakBeforeMonth(n);
      if(carriedBefore<=0) return;
      const minNs=getNurseNumberSetting(n,'minConsecutiveNight',data.commonScheduleSettings?.defaultMinConsecutiveNight ?? 0);
      const maxNs=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3);
      if(maxNs===0){
        lockRecoveryOffAfterNightBlock(n,0);
        return;
      }

      // 전월에서 이미 최소 연속 N을 충족했거나 최대치에 도달했다면, 이번 달 초는 N 회복 OFF로 잠급니다.
      if((minNs>0 && carriedBefore>=minNs) || (maxNs>0 && carriedBefore>=maxNs)){
        lockRecoveryOffAfterNightBlock(n,0);
        return;
      }

      // 최소 연속 N에 못 미친 채 월이 넘어온 경우, 부족한 N을 먼저 연장하고 이후 회복 OFF를 잠급니다.
      let need=Math.max(0, minNs-carriedBefore);
      if(maxNs>0) need=Math.min(need, Math.max(0,maxNs-carriedBefore));
      let lastNightDay=0;
      for(let d=1; d<=need && d<=last; d++){
        const key=makeDateKey(y,m,d);
        if(!schedule[key]) schedule[key]={};
        if(!schedule[key][n.id] && canPlace(n,'N',d,'continuity',false)){
          schedule[key][n.id]='N';
          lastNightDay=d;
        } else {
          // N 연장이 불가능한 경우에도 D/E로 넘어가지 않도록 OFF 보호합니다.
          setProtectedOff(n,d);
          break;
        }
      }
      lockRecoveryOffAfterNightBlock(n,lastNightDay);
    });
  }

  function enforceNightRecoveryOffBlocks(){
    // 전월에서 이어진 N 블록과 이번 달 안에서 끝난 모든 N 블록 뒤에는 설정된 개수만큼 OFF를 보호합니다.
    let changed=false;
    nurses.forEach(n=>{
      let streak=previousNightStreakBeforeMonth(n);
      for(let d=1; d<=last+1; d++){
        const code=d<=last ? String(codeAt(d,n.id)||'').toUpperCase() : '';
        if(code==='N'){
          streak++;
          continue;
        }
        if(streak>0){
          const blockEndDay=d-1; // 0이면 전월 말일에서 N 블록이 끝난 것
          if(lockRecoveryOffAfterNightBlock(n,blockEndDay)) changed=true;
          streak=0;
        }
      }
    });
    return changed;
  }

  function fillMinimumStaffing(){
    for(let d=1; d<=last; d++){
      const key=makeDateKey(y,m,d), dtype=getDateType(y,m,d);
      ['D','E'].forEach(shift=>{
        while(staffingCount(key,shift) < minForDay(d,shift)){
          const candidates=nurses.filter(n=>canPlace(n,shift,d,'minimum')).sort((a,b)=>score(a,shift,key,dtype,'minimum')-score(b,shift,key,dtype,'minimum'));
          if(!candidates.length) break;
          schedule[key][candidates[0].id]=shift;
        }
      });
    }
  }
  function fillRemainingWithWork(){
    // 최소인원을 먼저 맞춘 뒤, 개인별 기준 OFF가 부족한 직원은 먼저 OFF로 둡니다.
    // 즉 D 최소 2 / 최대 3이면 항상 3명을 채우는 것이 아니라,
    // OFF 부족자가 있으면 D는 2명으로 유지될 수 있습니다.
    for(let d=1; d<=last; d++){
      const key=makeDateKey(y,m,d), dtype=getDateType(y,m,d);
      nurses.forEach(n=>{
        if(schedule[key][n.id]) return;
        const currentOff=statNow()[n.id]?.totalOff||0;
        if(currentOff < targetOff){
          schedule[key][n.id]='OF';
          return;
        }
        const possible=allowedWorkCodes(n).filter(shift=>shift!=='N').filter(shift=>canPlace(n,shift,d,'extra')).sort((a,b)=>score(n,a,key,dtype,'extra')-score(n,b,key,dtype,'extra'));
        schedule[key][n.id]=possible.length ? possible[0] : 'OF';
      });
    }
  }
  function canGiveUp(n,day,shift){
    const key=makeDateKey(y,m,day);
    // 같은 shift를 다른 직원에게 넘기는 swap에서는 일별 인원수가 유지되므로
    // 최소인원 여부와 상관없이 현재 shift 보유자이면 교환 후보가 될 수 있습니다.
    return schedule[key]?.[n.id]===shift;
  }
  function balanceShiftCounts(shift){
    if(!opt.balanceDEN) return;
    for(let iter=0; iter<500; iter++){
      const stats=statNow();
      const eligible=nurses.filter(n=>isThreeShiftEligible(n) && allAllowedCodes(n).includes(shift) && !getNurseConstraints(n).reduceNight);
      if(eligible.length<2) return;
      const countOf=n=> shift==='D' ? (stats[n.id]?.days||0) : shift==='E' ? (stats[n.id]?.evenings||0) : (stats[n.id]?.nights||0);
      eligible.sort((a,b)=>countOf(a)-countOf(b));
      const low=eligible[0], high=eligible[eligible.length-1];
      if(countOf(high)-countOf(low)<=1) return;
      let changed=false;
      for(let d=1; d<=last && !changed; d++){
        const key=makeDateKey(y,m,d);
        if(!canGiveUp(high,d,shift)) continue;
        const lowCode=schedule[key]?.[low.id]||'';
        if(!isOff(lowCode)) continue;
        if(!canPlace(low,shift,d,'extra',true)) continue;
        if(getNurseConstraints(low).isNew && ['D','E','N'].includes(shift)){
          const expAfter = experiencedCount(key,shift) - (!getNurseConstraints(high).isNew ? 1 : 0);
          if(expAfter<=0) continue;
        }
        schedule[key][low.id]=shift;
        schedule[key][high.id]='OF';
        changed=true;
      }
      if(!changed) return;
    }
  }
  function balanceDEN(){ ['N','D','E'].forEach(balanceShiftCounts); }

  function repairNewNotAlone(){
    if(!opt.enforceNewNotAlone) return;
    for(let pass=0; pass<4; pass++){
      let changed=false;
      for(let d=1; d<=last; d++){
        const key=makeDateKey(y,m,d), dtype=getDateType(y,m,d);
        ['D','E','N'].forEach(shift=>{
          const newWorkers=nurses.filter(n=>getNurseConstraints(n).isNew && schedule[key]?.[n.id]===shift);
          if(!newWorkers.length) return;
          if(experiencedCount(key,shift)>0) return;
          const stats=statNow();
          const candidates=nurses
            .filter(n=>!getNurseConstraints(n).isNew)
            .filter(n=>['','O','OF'].includes(schedule[key]?.[n.id]||''))
            .filter(n=>canPlace(n,shift,d,'newSupport',true))
            .sort((a,b)=>{
              const ao=stats[a.id]?.totalOff||0, bo=stats[b.id]?.totalOff||0;
              if(bo!==ao) return bo-ao;
              return score(a,shift,key,dtype,'newSupport')-score(b,shift,key,dtype,'newSupport');
            });
          if(candidates.length){
            schedule[key][candidates[0].id]=shift;
            changed=true;
          }
        });
      }
      if(!changed) break;
    }
  }

  function balanceOffBySwaps(){
    // OFF가 너무 많은 직원과 OFF가 부족한 직원을 같은 날짜/같은 shift로 교환합니다.
    // 일별 D/E/N 인원은 그대로 유지하고, 근무유형/배치기준/신규 단독근무 금지는 계속 지킵니다.
    for(let iter=0; iter<800; iter++){
      const stats=statNow();
      const overOff=nurses.filter(n=>(stats[n.id]?.totalOff||0)>targetOff).sort((a,b)=>(stats[b.id]?.totalOff||0)-(stats[a.id]?.totalOff||0));
      const underOff=nurses.filter(n=>(stats[n.id]?.totalOff||0)<targetOff).sort((a,b)=>(stats[a.id]?.totalOff||0)-(stats[b.id]?.totalOff||0));
      if(!overOff.length || !underOff.length) return;
      let changed=false;
      for(const needsWork of overOff){
        for(const needsOff of underOff){
          if(needsWork.id===needsOff.id) continue;
          for(let d=1; d<=last && !changed; d++){
            const key=makeDateKey(y,m,d);
            const workCode=schedule[key]?.[needsOff.id]||'';
            const offCode=schedule[key]?.[needsWork.id]||'';
            if(!['D','E','N'].includes(workCode)) continue;
            if(!isOff(offCode)) continue;
            if(isLockedOff(d,needsWork.id)) continue;
            if(!canPlace(needsWork,workCode,d,'extra',true)) continue;
            const c=getNurseConstraints(needsWork);
            if(c.isNew && experiencedCount(key,workCode) - (schedule[key]?.[needsOff.id]===workCode ? 1 : 0) <= 0) continue;
            if(['AL','SL','WO','HA','HP'].includes(offCode)) continue;
            schedule[key][needsWork.id]=workCode;
            schedule[key][needsOff.id]='OF';
            changed=true;
          }
          if(changed) break;
        }
        if(changed) break;
      }
      if(!changed) return;
    }
  }


  function balanceOffByChainSwaps(){
    // v14.1.7: OFF 과다자와 OFF 부족자가 같은 코드를 직접 교환할 수 없을 때,
    // 2단계/3단계 연쇄교환을 시도합니다.
    // 예) OFF 과다자(D/N 가능)가 D를 가져감 → 기존 D 근무자가 E로 이동 → E 근무자는 OFF 확보.
    // 일별 D/E/N 총 인원은 그대로 유지하고, 개인별 가능 근무코드/휴가/나이트 회복 OFF/신규 단독금지는 보호합니다.
    const movableCodes=['D','E','N'];
    function isFixedOffCode(code){ return ['AL','SL','WO','HA','HP'].includes(String(code||'').toUpperCase()); }
    function cloneDay(day){ const key=makeDateKey(y,m,day); return Object.assign({}, schedule[key]||{}); }
    function restoreDay(day,snap){ const key=makeDateKey(y,m,day); schedule[key]=Object.assign({}, snap||{}); }
    function safeOffCandidate(n, day){
      const key=makeDateKey(y,m,day);
      const code=String(schedule[key]?.[n.id]||'').toUpperCase();
      return isOff(code) && !isFixedOffCode(code) && !isLockedOff(day,n.id);
    }
    function canMoveInto(n, shift, day){
      const key=makeDateKey(y,m,day);
      const cur=String(schedule[key]?.[n.id]||'').toUpperCase();
      if(isFixedOffCode(cur)) return false;
      if(!movableCodes.includes(String(shift||'').toUpperCase())) return false;
      return canPlace(n,shift,day,'chainSwap',true);
    }
    function newSafetyOk(day){
      const key=makeDateKey(y,m,day);
      for(const shift of movableCodes){
        const hasNew=nurses.some(n=>getNurseConstraints(n).isNew && schedule[key]?.[n.id]===shift);
        if(hasNew && experiencedCount(key,shift)<=0) return false;
      }
      return true;
    }
    function staffingOk(day){
      const key=makeDateKey(y,m,day);
      for(const shift of movableCodes){
        if(staffingCount(key,shift) < minForDay(day,shift)) return false;
        if(maxForDay(day,shift)!==Infinity && dailyCount(key,shift) > maxForDay(day,shift)) return false;
      }
      return true;
    }
    function commitTwoStep(over, relay, under, day, overShift, underShift){
      const key=makeDateKey(y,m,day);
      const snap=cloneDay(day);
      schedule[key][under.id]='OF';
      schedule[key][relay.id]=underShift;
      schedule[key][over.id]=overShift;
      if(!canMoveInto(relay,underShift,day) || !canMoveInto(over,overShift,day) || !newSafetyOk(day) || !staffingOk(day)){
        restoreDay(day,snap); return false;
      }
      return true;
    }
    function commitThreeStep(over, relay1, relay2, under, day, overShift, relay1Shift, underShift){
      const key=makeDateKey(y,m,day);
      const snap=cloneDay(day);
      schedule[key][under.id]='OF';
      schedule[key][relay2.id]=underShift;
      schedule[key][relay1.id]=relay1Shift;
      schedule[key][over.id]=overShift;
      if(!canMoveInto(relay2,underShift,day) || !canMoveInto(relay1,relay1Shift,day) || !canMoveInto(over,overShift,day) || !newSafetyOk(day) || !staffingOk(day)){
        restoreDay(day,snap); return false;
      }
      return true;
    }

    for(let iter=0; iter<1200; iter++){
      const stats=statNow();
      const overOff=nurses.filter(n=>(stats[n.id]?.totalOff||0)>targetOff).sort((a,b)=>(stats[b.id]?.totalOff||0)-(stats[a.id]?.totalOff||0));
      const underOff=nurses.filter(n=>(stats[n.id]?.totalOff||0)<targetOff).sort((a,b)=>(stats[a.id]?.totalOff||0)-(stats[b.id]?.totalOff||0));
      if(!overOff.length || !underOff.length) return;
      let changed=false;

      for(const over of overOff){
        for(const under of underOff){
          if(over.id===under.id) continue;
          for(let d=1; d<=last && !changed; d++){
            const key=makeDateKey(y,m,d);
            const underShift=String(schedule[key]?.[under.id]||'').toUpperCase();
            if(!movableCodes.includes(underShift)) continue;
            if(!safeOffCandidate(over,d)) continue;

            // 1) 직접교환은 기존 함수가 대부분 처리하지만, 남은 케이스를 한 번 더 시도합니다.
            if(canMoveInto(over,underShift,d)){
              const snap=cloneDay(d);
              schedule[key][under.id]='OF';
              schedule[key][over.id]=underShift;
              if(newSafetyOk(d) && staffingOk(d)){ changed=true; break; }
              restoreDay(d,snap);
            }

            // 2) 2단계: over가 relay의 근무를 받고, relay가 under의 근무를 받습니다.
            const relays=nurses.filter(r=>r.id!==over.id && r.id!==under.id)
              .filter(r=>movableCodes.includes(String(schedule[key]?.[r.id]||'').toUpperCase()))
              .sort((a,b)=>{
                const ao=stats[a.id]?.totalOff||0, bo=stats[b.id]?.totalOff||0;
                if(ao!==bo) return ao-bo; // OFF가 부족한 사람은 가능하면 relay에서 제외되도록 뒤쪽 교환을 줄임
                return stableNurseTie(a)-stableNurseTie(b);
              });
            for(const relay of relays){
              const relayShift=String(schedule[key]?.[relay.id]||'').toUpperCase();
              if(relayShift===underShift) continue;
              if(commitTwoStep(over,relay,under,d,relayShift,underShift)){ changed=true; break; }
            }
            if(changed) break;

            // 3) 3단계: over <- relay1Shift, relay1 <- relay2Shift, relay2 <- underShift.
            for(const relay1 of relays){
              const relay1Shift=String(schedule[key]?.[relay1.id]||'').toUpperCase();
              if(!movableCodes.includes(relay1Shift)) continue;
              for(const relay2 of relays){
                if(relay2.id===relay1.id) continue;
                const relay2Shift=String(schedule[key]?.[relay2.id]||'').toUpperCase();
                if(!movableCodes.includes(relay2Shift)) continue;
                if(relay1Shift===relay2Shift && relay2Shift===underShift) continue;
                if(commitThreeStep(over,relay1,relay2,under,d,relay1Shift,relay2Shift,underShift)){ changed=true; break; }
              }
              if(changed) break;
            }
          }
          if(changed) break;
        }
        if(changed) break;
      }
      if(!changed) return;
    }
  }

  function addWorkForOverOffUpToMax(){
    // 기준 OFF를 이미 초과한 직원은, 일별 최대 인원 범위 안에서 OF를 근무로 되돌립니다.
    // 이렇게 해야 '기준 OFF가 채워지면 남은 일자는 근무 배치' 원칙이 실제로 작동합니다.
    for(let iter=0; iter<800; iter++){
      const stats=statNow();
      const overOff=nurses.filter(n=>(stats[n.id]?.totalOff||0)>targetOff).sort((a,b)=>(stats[b.id]?.totalOff||0)-(stats[a.id]?.totalOff||0));
      if(!overOff.length) return;
      let changed=false;
      for(const n of overOff){
        for(let d=1; d<=last && !changed; d++){
          const key=makeDateKey(y,m,d);
          const existing=schedule[key]?.[n.id]||'';
          if(!['','O','OF'].includes(existing)) continue;
          if(isLockedOff(d,n.id)) continue;
          const possible=allowedWorkCodes(n)
            .filter(shift=>['D','E','MD','SD6'].includes(shift))
            .filter(shift=>!['D','E','N'].includes(shift) || dailyCount(key,shift) < maxForDay(d,shift))
            .filter(shift=>canPlace(n,shift,d,'extra',true))
            .sort((a,b)=>score(n,a,key,getDateType(y,m,d),'extra')-score(n,b,key,getDateType(y,m,d),'extra'));
          if(!possible.length) continue;
          schedule[key][n.id]=possible[0];
          changed=true;
        }
        if(changed) break;
      }
      if(!changed) return;
    }
  }

  function reduceAboveMinimumForOffTarget(){
    // 기준 OFF가 부족한 직원이 있을 때, 최소인원을 넘겨 배치된 근무는 OFF로 줄입니다.
    // 예: D 최소 2 / 최대 3일 때 D가 3명이고 누군가 OFF 부족이면 D 1명을 OFF로 전환 가능.
    for(let iter=0; iter<500; iter++){
      const stats=statNow();
      const underOff=nurses.filter(n=>(stats[n.id]?.totalOff||0)<targetOff).sort((a,b)=>(stats[a.id]?.totalOff||0)-(stats[b.id]?.totalOff||0));
      if(!underOff.length) return;
      let changed=false;
      for(const n of underOff){
        for(let d=1; d<=last && !changed; d++){
          const key=makeDateKey(y,m,d);
          const code=schedule[key]?.[n.id]||'';
          if(!['D','E','N'].includes(code)) continue;
          if(staffingCount(key,code) <= minForDay(d,code)) continue;
          const hasNewSameShift=nurses.some(x=>getNurseConstraints(x).isNew && schedule[key]?.[x.id]===code);
          const expAfter=experiencedCount(key,code) - (!getNurseConstraints(n).isNew ? 1 : 0);
          if(hasNewSameShift && expAfter<=0) continue;
          schedule[key][n.id]='OF';
          changed=true;
        }
        if(changed) break;
      }
      if(!changed) return;
    }
  }

  function enforceNurseConfiguredHardRules(){
    // 병동 수간호사 페이지의 근무자별 설정값을 최종 하드 제약으로 다시 확인합니다.
    // 1) 개인 허용 근무코드 외 배정 제거  2) N=0/연속N 최대 0 제거  3) N 최소/최대 연속 위반 제거
    let changed=false;
    for(let d=1; d<=last; d++){
      const key=makeDateKey(y,m,d), dtype=getDateType(y,m,d);
      nurses.forEach(n=>{
        const code=String(schedule[key]?.[n.id]||'').toUpperCase();
        if(!code) return;
        if(workCodes.includes(code) && !allAllowedCodes(n).includes(code)){
          schedule[key][n.id]='OF'; changed=true; return;
        }
        if(workCodes.includes(code) && isRestricted(n,dtype)){
          schedule[key][n.id]='OF'; changed=true; return;
        }
        if(code==='N'){
          const maxN=effectiveMonthlyMaxNight(n);
          const maxNs=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3);
          if(maxN<=0 || maxNs===0){ schedule[key][n.id]='OF'; changed=true; }
        }
      });
    }

    nurses.forEach(n=>{
      const minNs=getNurseNumberSetting(n,'minConsecutiveNight',data.commonScheduleSettings?.defaultMinConsecutiveNight ?? 0);
      const maxNs=getNurseNumberSetting(n,'maxConsecutiveNight',data.commonScheduleSettings?.defaultMaxConsecutiveNight ?? 3);
      let carried=previousNightStreakBeforeMonth(n);
      let blockStart=carried>0 ? 1-carried : 0;
      for(let d=1; d<=last+1; d++){
        const code=d<=last ? String(codeAt(d,n.id)||'').toUpperCase() : '';
        if(code==='N'){
          if(carried===0) blockStart=d;
          carried++;
          if(maxNs>0 && carried>maxNs && d<=last){
            schedule[makeDateKey(y,m,d)][n.id]='OF';
            carried=maxNs;
            changed=true;
          }
        } else if(carried>0){
          const blockEnd=d-1;
          if(minNs>0 && carried<minNs){
            // 현재 월 안에 있는 짧은 N 묶음은 단독 N이 되지 않도록 OFF로 되돌립니다.
            const first=Math.max(1,blockStart);
            for(let x=first; x<=blockEnd && x<=last; x++){
              const k=makeDateKey(y,m,x);
              if(schedule[k]?.[n.id]==='N'){
                schedule[k][n.id]='OF';
                changed=true;
              }
            }
          }
          carried=0; blockStart=0;
        }
      }
    });
    return changed;
  }

  function enforceStaffingBounds(){
    // v14 핵심 원칙: 병동 수간호사 페이지의 D/E/N 최소 인원은 최종 절대 기준입니다.
    // 부족하면 월 기준OFF/보호 OFF/WO 순서로 풀어서라도 근무 인원을 먼저 맞춥니다.
    // 단, 개인별 가능 근무코드, 상근/데이킵/E불가/N불가, AL/SL 같은 고정휴가는 절대 깨지 않습니다.
    let changed=false;
    function mandatoryCanPlace(n, shift, day){
      // ── 계약규칙: 최소인원 강제 단계에서도 절대 위반 불가 ──
      // isContractEligible()이 근무유형·개인조건·개인설정값 전체를 담당합니다.
      // (이전 버전에서 isPersonalShiftAllowedForDateType, 신규 단독 금지가 누락되어 있었음)
      if(!isContractEligible(n,shift,day)) return false;

      // ── 절대규칙: 아래는 최소인원 강제 단계에서도 지킵니다 ──
      const key=makeDateKey(y,m,day);
      const existing=String(schedule[key]?.[n.id]||'').toUpperCase();
      if(workCodes.includes(existing) && existing!==shift) return false;
      if(['D','E','N'].includes(shift) && dailyCount(key,shift) >= maxForDay(day,shift) && existing!==shift) return false;
      const maxC=getNurseNumberSetting(n,'maxConsecutiveDays',data.commonScheduleSettings?.defaultMaxConsecutiveDays ?? 5);
      const prevCode=prevCodeAt(day,n.id);
      if(opt.enforcePreviousMonthTransition && violatesWorkTypeTransition(n, prevCode, shift)) return false;
      if(maxC>0 && consecutiveIf(n,day,shift)>maxC) return false;
      return true;
    }
    function candidatePriority(n, shift, day){
      const key=makeDateKey(y,m,day);
      const cur=String(schedule[key]?.[n.id]||'').toUpperCase();
      let p=0;
      if(cur==='') p-=200;
      if(cur==='OF' || cur==='O') p-=100;
      if(isLockedOff(day,n.id)) p+=200; // N 후 회복 OFF는 가능하면 보존
      if(cur==='WO') p+=500;            // 원티드 OFF는 마지막 후보
      p+=score(n,shift,key,getDateType(y,m,day),'mandatoryStaffing');
      return p;
    }
    for(let d=1; d<=last; d++){
      const key=makeDateKey(y,m,d);
      ['D','E','N'].forEach(shift=>{
        const max=maxForDay(d,shift);
        while(max!==Infinity && dailyCount(key,shift)>max){
          const candidates=nurses
            .filter(n=>schedule[key]?.[n.id]===shift)
            .filter(n=>!['AL','SL','WO','HA','HP'].includes(String(schedule[key]?.[n.id]||'').toUpperCase()))
            .sort((a,b)=>score(b,shift,key,getDateType(y,m,d),'staffingMax')-score(a,shift,key,getDateType(y,m,d),'staffingMax'));
          if(!candidates.length) break;
          schedule[key][candidates[0].id]='OF';
          changed=true;
        }
        let guard=0;
        while(staffingCount(key,shift)<minForDay(d,shift) && guard++<nurses.length+5){
          let placed=false;
          if(shift==='N'){
            // 먼저 N 묶음 생성 방식으로 시도합니다.
            // 계약규칙 미충족 후보는 pre-filter로 제외합니다 (tryPlaceNightBlock 내부도 보호되지만, 불필요한 순회 방지).
            const blockCandidates=nurses
              .filter(n=>isOff(schedule[key]?.[n.id]||''))
              .filter(n=>isContractEligible(n,'N',d))
              .filter(n=>remainingNightQuota(n)>0)
              .sort((a,b)=>candidatePriority(a,shift,d)-candidatePriority(b,shift,d));
            for(const cand of blockCandidates){
              if(tryPlaceNightBlock(cand,d,'mandatoryStaffing')){ placed=true; changed=true; break; }
            }
          }
          if(!placed){
            // 그래도 부족하면 OFF 부족을 감수하고 해당 duty 최소인원을 먼저 맞춥니다.
            const candidates=nurses
              .filter(n=>isOff(schedule[key]?.[n.id]||''))
              .filter(n=>mandatoryCanPlace(n,shift,d))
              .sort((a,b)=>candidatePriority(a,shift,d)-candidatePriority(b,shift,d));
            if(!candidates.length) break;
            schedule[key][candidates[0].id]=shift;
            changed=true; placed=true;
          }
          if(!placed) break;
        }
      });
    }
    return changed;
  }

  function enforceConsecutiveOffRules(){
    // 연속 OFF 최소/최대는 개인별 설정값을 기준으로 보정합니다.
    // 단, 고정 휴가(AL/SL/WO)와 Night 회복 OFF 보호구간, 그리고 병동 D/E/N 최소 인원은 깨지지 않게 합니다.
    let changed=false;
    function canConvertWorkToOff(n, day){
      const key=makeDateKey(y,m,day);
      const code=String(schedule[key]?.[n.id]||'').toUpperCase();
      if(!['D','E','N','MD','SD6'].includes(code)) return false;
      if(['D','E','N'].includes(code) && staffingCount(key,code) <= minForDay(day,code)) return false;
      return true;
    }
    function convertToOff(n, day){
      const key=makeDateKey(y,m,day);
      const cur=String(schedule[key]?.[n.id]||'').toUpperCase();
      if(['AL','SL','WO','HA','HP'].includes(cur)) return false;
      if(isLockedOff(day,n.id)) return false;
      if(!canConvertWorkToOff(n,day)) return false;
      schedule[key][n.id]='OF';
      changed=true;
      return true;
    }
    function canConvertOffToWork(n, day){
      const key=makeDateKey(y,m,day);
      const cur=String(schedule[key]?.[n.id]||'').toUpperCase();
      if(!isOff(cur)) return false;
      if(['AL','SL','WO','HA','HP'].includes(cur)) return false;
      if(isLockedOff(day,n.id)) return false;
      return true;
    }
    function convertOffToBestWork(n, day){
      if(!canConvertOffToWork(n,day)) return false;
      const key=makeDateKey(y,m,day), dtype=getDateType(y,m,day);
      const preferred=['D','E','MD','SD6'];
      const possible=preferred
        .filter(shift=>allowedWorkCodes(n).includes(shift))
        .filter(shift=>!['D','E','N'].includes(shift) || dailyCount(key,shift) < maxForDay(day,shift))
        .filter(shift=>canPlace(n,shift,day,'offLimitRepair',true))
        .sort((a,b)=>score(n,a,key,dtype,'offLimitRepair')-score(n,b,key,dtype,'offLimitRepair'));
      if(!possible.length) return false;
      schedule[key][n.id]=possible[0];
      changed=true;
      return true;
    }

    // 1) 연속 OFF 최대 초과 보정: 초과된 OF를 가능한 근무로 되돌립니다.
    nurses.forEach(n=>{
      const maxOff=getNurseNumberSetting(n,'maxConsecutiveOff',data.commonScheduleSettings?.defaultMaxConsecutiveOff ?? 3);
      if(maxOff<=0) return;
      let start=0, len=0;
      for(let d=1; d<=last+1; d++){
        const c=d<=last ? String(codeAt(d,n.id)||'').toUpperCase() : '';
        if(d<=last && isOff(c)){
          if(len===0) start=d;
          len++;
        } else if(len>0){
          if(len>maxOff){
            // 보호 OFF와 휴가를 피하고, 뒤쪽부터 근무로 전환해 불필요한 긴 OFF를 끊습니다.
            for(let x=start+len-1; x>=start && len>maxOff; x--){
              if(convertOffToBestWork(n,x)) len--;
            }
          }
          start=0; len=0;
        }
      }
    });

    // 2) 연속 OFF 최소 미달 보정: 1일짜리 OFF 등은 가능하면 앞/뒤 근무를 OFF로 바꿔 최소일을 맞춥니다.
    nurses.forEach(n=>{
      const minOff=getNurseNumberSetting(n,'minConsecutiveOff',data.commonScheduleSettings?.defaultMinConsecutiveOff ?? 1);
      if(minOff<=1) return;
      let start=0, len=0;
      for(let d=1; d<=last+1; d++){
        const c=d<=last ? String(codeAt(d,n.id)||'').toUpperCase() : '';
        if(d<=last && isOff(c)){
          if(len===0) start=d;
          len++;
        } else if(len>0){
          while(len<minOff){
            let ok=false;
            const after=start+len;
            if(after<=last) ok=convertToOff(n,after);
            if(!ok && start>1) ok=convertToOff(n,start-1);
            if(!ok) break;
            len++;
          }
          start=0; len=0;
        }
      }
    });
    return changed;
  }

  function fillNightOnlyMonthlyQuota(){
    // N 전담자는 D/E를 하지 않으므로 월간 N 목표(기본: 해당 월 절반(홀수 달은 N 1개 추가), 예 30일=15 / 31일=16)에 가깝게 N/OFF만 배치합니다.
    // 병동 N 최소/최대 인원, 개인별 연속 N 최소/최대, N 후 OFF 보호구간은 그대로 지킵니다.
    for(let iter=0; iter<200; iter++){
      const stats=statNow();
      const targets=nurses.filter(isNightOnlyNurse).sort((a,b)=>Number(stats[a.id]?.nights||0)-Number(stats[b.id]?.nights||0));
      let changed=false;
      for(const n of targets){
        if(Number(stats[n.id]?.nights||0) >= effectiveMonthlyMaxNight(n)) continue;
        for(let d=1; d<=last && !changed; d++){
          const key=makeDateKey(y,m,d);
          if(!isOff(schedule[key]?.[n.id]||'')) continue;
          if(isLockedOff(d,n.id)) continue;
